    // カタログパーツのプレースホルダーを一括置換する（{{token}}の全出現を置換。1パーツ内で
    // 同じトークンが複数回出る場合（#23のボタン3種の{{url}}等）も1回の入力で全て揃える）
    function substituteCatalogTokenAll(html, token, value) {
      return (html || '').split('{{' + token + '}}').join(value == null ? '' : String(value));
    }

    // テーマトークンへの置換（{{color}}→accent, {{light}}→hero, {{dark}}→ink, {{accent}}→cta）と、
    // {{text}}/{{title}}の既定値埋め込み（選択テキスト or 既定文言）。行ごとの個別入力は求めず、
    // 挿入後にエディタ内で直接編集してもらう（既存MOCAパーツと同じ考え方）。
    function substituteCatalogThemeTokens(html, tokens, selectedText) {
      const T = tokens || {};
      let out = html || '';
      out = substituteCatalogTokenAll(out, 'color', T.accent);
      out = substituteCatalogTokenAll(out, 'light', T.hero);
      out = substituteCatalogTokenAll(out, 'dark', T.ink);
      out = substituteCatalogTokenAll(out, 'accent', T.cta);
      out = substituteCatalogTokenAll(out, 'text', selectedText || 'ここに本文を入れます');
      out = substituteCatalogTokenAll(out, 'title', 'タイトル');
      return out;
    }

    // {{accent}}(→cta)は明るい/淡い色のテーマもあるため、背景がcta色になったstyle="…"属性に
    // 限り、白文字（color:#fff/#ffffff/white）をonCta（読める文字色）へ差し替える。
    // {{color}}(→accent)側は12テーマ全てaccentが濃色のため、白文字はそのまま維持する（変更しない）。
    function fixCatalogCtaTextColor(html, tokens) {
      const T = tokens || {};
      const ctaHex = normalizeColorToHex(T.cta);
      if (!ctaHex || !T.onCta) return html;
      return (html || '').replace(/style="([^"]*)"/g, (m, styleBody) => {
        const bgMatch = /(?:^|;)\s*background(?:-color)?\s*:\s*([^;]+)/i.exec(styleBody);
        if (!bgMatch) return m;
        const bgHex = normalizeColorToHex(bgMatch[1].trim());
        if (bgHex !== ctaHex) return m;
        const nextStyle = styleBody.replace(/color\s*:\s*(#FFFFFF|#FFF|white)\b/gi, 'color:' + T.onCta);
        return 'style="' + nextStyle + '"';
      });
    }

    // カタログパーツの「行数可変」再構成用ヘルパー：同じタグ名・同じ直接の子要素数
    // （catalogSignature）を持つ要素かどうかを比較するための署名を作る。
    function catalogSignature(el) {
      return el.tagName + ':' + el.children.length;
    }

    // テンプレHTML（DOM化済み）の中から、兄弟要素が2つ以上・同じ署名を持つコンテナを探す
    // （浅い階層から順に探索し、最初に見つかったものを使う）。見つかった場合、その並びを
    // 先頭パターン（head）・末尾パターン（tail）・中間パターン（middle。3つ以上ある時は実際の
    // 中間要素、2つしかない時は先頭を使う）に分解できる形で返す（#27の中間行パターンに対応）。
    function findCatalogRepeatSpan(root) {
      const queue = [root];
      while (queue.length) {
        const node = queue.shift();
        if (node.children && node.children.length >= 2) {
          const groups = {};
          Array.from(node.children).forEach((child, idx) => {
            const sig = catalogSignature(child);
            (groups[sig] = groups[sig] || []).push({ el: child, idx: idx });
          });
          let best = null;
          Object.keys(groups).forEach((sig) => {
            const g = groups[sig];
            if (g.length >= 2 && (!best || g.length > best.length)) best = g;
          });
          if (best) {
            return {
              container: node,
              items: best.map((g) => g.el),
              startIdx: best[0].idx,
              endIdx: best[best.length - 1].idx
            };
          }
        }
        if (node.children) Array.from(node.children).forEach((c) => queue.push(c));
      }
      return null;
    }

    // 行内のテキストノードのうち「1〜2桁の数字」「01のような0埋め」「STEP n」だけを
    // 行番号（1始まり）で振り直す。それ以外のテキスト（本文・ラベル等）はそのまま。
    function renumberCatalogRowText(rowEl, rowIndex) {
      if (!rowEl || rowEl.nodeType !== 1) return;
      const ownerDoc = rowEl.ownerDocument || document;
      const walker = ownerDoc.createTreeWalker(rowEl, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      nodes.forEach((textNode) => {
        const raw = textNode.nodeValue;
        const trimmed = raw.trim();
        if (!trimmed) return;
        if (/^\d{1,2}$/.test(trimmed)) {
          const padded = trimmed.length === 2 && trimmed.charAt(0) === '0';
          const num = rowIndex + 1;
          const next = padded ? String(num).padStart(2, '0') : String(num);
          if (next !== trimmed) textNode.nodeValue = raw.replace(trimmed, next);
        } else if (/^STEP\s*\d+$/i.test(trimmed)) {
          const next = trimmed.replace(/\d+/, String(rowIndex + 1));
          if (next !== trimmed) textNode.nodeValue = raw.replace(trimmed, next);
        }
      });
    }

    // 行数可変パーツの本体：N=1→headのみ（tail用の装飾は使わずheadをそのまま採用）／
    // N=2→head+tail／N>=3→head + (N-2)×middle + tail。内部に繰り返し構造が見つからない
    // パーツ（単一ブロックのもの）はhtmlをそのまま返す。
    function applyCatalogRowCount(rawHtml, n) {
      // v0.13.0: 構造解析用のwrapperはDOMParserで作る（{{img}}等の未置換プレースホルダーが
      // <img src="…">に残っていても、DOMParserの文書はブラウジングコンテキストを持たない
      // ため画像取得（＝存在しないURLへの404リクエスト）が発生しない）
      const inertDoc = new DOMParser().parseFromString(
        '<!doctype html><html><body><div id="catalog-row-wrap">' + rawHtml + '</div></body></html>',
        'text/html'
      );
      const wrapper = inertDoc.getElementById('catalog-row-wrap');
      const span = findCatalogRepeatSpan(wrapper);
      if (!span) return rawHtml;
      const container = span.container;
      const items = span.items;
      const startIdx = span.startIdx;
      const endIdx = span.endIdx;
      const head = items[0];
      const tail = items[items.length - 1];
      const middle = items.length > 2 ? items[Math.floor(items.length / 2)] : items[0];

      let rows;
      if (n <= 1) rows = [head];
      else if (n === 2) rows = [head, tail];
      else rows = [head].concat(new Array(n - 2).fill(middle)).concat([tail]);

      const clones = rows.map((source, i) => {
        const clone = source.cloneNode(true);
        renumberCatalogRowText(clone, i);
        return clone;
      });

      const originalChildren = Array.from(container.children);
      const before = originalChildren.slice(0, startIdx);
      const after = originalChildren.slice(endIdx + 1);
      while (container.firstChild) container.removeChild(container.firstChild);
      before.forEach((el) => container.appendChild(el));
      clones.forEach((el) => container.appendChild(el));
      after.forEach((el) => container.appendChild(el));

      return wrapper.innerHTML;
    }

    // カタログパーツ挿入時、インライン色から data-role（bg/accent/text/line）を推定して付与する。
    // これにより既存の「パーツの色」ポップオーバー（getPartRoleElements/applyPartColor）が
    // カタログパーツにもそのまま使える（label: 「カタログ パーツ」はPART_COLOR_LABELS側で定義）。
    function scanCatalogPartRoles(rootEl, tokens) {
      if (!rootEl) return;
      const T = tokens || {};
      const bgHexes = [T.accent, T.hero, T.cta].map(normalizeColorToHex).filter(Boolean);
      const accentHexes = [T.accent, T.cta].map(normalizeColorToHex).filter(Boolean);
      const textHex = normalizeColorToHex(T.ink);
      const borderProps = ['border', 'border-color', 'border-top', 'border-right', 'border-bottom', 'border-left',
        'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color'];
      const all = [rootEl].concat(Array.from(rootEl.querySelectorAll('*')));
      all.forEach((el) => {
        if (!el.getAttribute || !el.getAttribute('style')) return;
        const roles = new Set();
        const existing = el.getAttribute('data-role');
        if (existing) existing.split(/\s+/).forEach((r) => { if (r) roles.add(r); });

        ['background', 'background-color'].forEach((prop) => {
          const v = el.style.getPropertyValue(prop);
          if (!v) return;
          const found = (v.match(RETHEME_COLOR_TOKEN_RE) || []).map(normalizeColorToHex);
          if (found.some((h) => h && bgHexes.indexOf(h) !== -1)) roles.add('bg');
        });

        const colorVal = el.style.getPropertyValue('color');
        if (colorVal) {
          const hex = normalizeColorToHex(colorVal);
          if (hex && accentHexes.indexOf(hex) !== -1) roles.add('accent');
          else if (hex && textHex && hex === textHex) roles.add('text');
        }

        borderProps.forEach((prop) => {
          const v = el.style.getPropertyValue(prop);
          if (v && /#[0-9a-fA-F]{3,6}/.test(v)) roles.add('line');
        });

        if (roles.size) el.setAttribute('data-role', Array.from(roles).join(' '));
      });
    }

    // ========================================
    // v0.13.0: カタログパーツ挿入ダイアログ用のプレースホルダー解析ヘルパー群
    // （editor/DOM状態を持たない純粋関数。{{title}}/{{text}}/{{url}}/{{img}}/{{tel}} の
    // 出現を繰り返しユニット（例：カード3つ・ボタン3種）に割り当てるために使う。
    // 「関連記事」等、同じプレースホルダーが複数回出るパーツで従来は1回の入力（window.prompt）
    // を全出現へ一括適用していた不具合の修正用。詳細はSPEC.md参照）
    // ========================================
    const CATALOG_FIELD_TOKENS = ['title', 'text', 'url', 'img', 'tel'];
    const CATALOG_FIELD_LABELS = { title: 'タイトル', text: '本文', url: 'リンク先URL', img: '画像URL', tel: '電話番号' };
    const CATALOG_FIELD_TOKEN_RE = /\{\{(title|text|url|img|tel)\}\}/g;

    // テンプレHTML文字列 → 解析専用の非活性DOM（画像等のネットワーク取得を発生させない。
    // applyCatalogRowCountと同じ考え方のwrapperを毎回新規に作る）
    function parseCatalogInert(html) {
      const inertDoc = new DOMParser().parseFromString(
        '<!doctype html><html><body><div id="catalog-analyze-wrap">' + (html || '') + '</div></body></html>',
        'text/html'
      );
      return inertDoc.getElementById('catalog-analyze-wrap');
    }

    // v0.13.0: outerHTML（要素自身のhref/src属性＋子孫のテキスト・属性すべて）で判定する。
    // innerHTMLだけだと、#35（LINE/メール/電話の3ボタン）のようにプレースホルダーが
    // href属性側にしかない（表示テキストは固定文言）要素を誤って「プレースホルダーなし」と
    // 判定し、件数の既定値検出（catalogNativeUnitCount）を壊してしまう
    function catalogElHasFieldPlaceholder(el) {
      const html = el.outerHTML || '';
      return CATALOG_FIELD_TOKENS.some((t) => html.indexOf('{{' + t + '}}') !== -1);
    }

    // wrapper内から、フィールド用の繰り返しユニット（要素の配列。DOM順＝1件目/2件目…の順）を
    // 検出する。findCatalogRepeatSpanが見つけた兄弟グループのうち、2つ以上がタイトル/本文/URL/
    // 画像/電話のいずれかのプレースホルダーを含む場合だけを「ユニット」として認める
    // （装飾だけの繰り返し要素を誤って1件ずつの入力欄にしてしまわないため）。
    function findCatalogFieldUnits(wrapper) {
      const span = findCatalogRepeatSpan(wrapper);
      if (!span || !span.items || span.items.length < 2) return null;
      const withPlaceholder = span.items.filter(catalogElHasFieldPlaceholder);
      if (withPlaceholder.length < 2) return null;
      return span.items;
    }

    // nodeがunits（要素配列）のどれか、またはその子孫かを調べ、0-basedインデックスを返す。
    // どのユニットにも属さない場合はnull（＝「共通」扱い）。
    function catalogUnitIndexOf(units, node) {
      if (!units || !node) return null;
      for (let i = 0; i < units.length; i++) {
        if (units[i] === node || (units[i].contains && units[i].contains(node))) return i;
      }
      return null;
    }

    // wrapper内を document order（TreeWalker順）でたどり、{{title}}等を含むテキストノード・
    // href/src属性に出会うたびに visit(node, attrNameOrNull, currentValue) を呼ぶ、唯一の
    // 走査ロジック。「何番目の出現か」（seq）はこの順序に対してのみ意味を持つため、出現の
    // 列挙（walkCatalogFieldOccurrences）と実際の値の適用（applyCatalogFieldValues）の
    // 両方が必ずこの関数を経由することで、両者の「N番目」がずれないようにする。
    function walkCatalogFieldNodes(wrapper, visit) {
      const walker = wrapper.ownerDocument.createTreeWalker(wrapper, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        if (n.nodeType === 1) {
          ['href', 'src'].forEach((attr) => {
            const v = n.getAttribute && n.getAttribute(attr);
            if (!v || v.indexOf('{{') === -1) return;
            visit(n, attr, v);
          });
        } else if (n.nodeType === 3) {
          const v = n.nodeValue;
          if (!v || v.indexOf('{{') === -1) continue;
          visit(n, null, v);
        }
      }
    }

    // wrapper内の{{title}}/{{text}}/{{url}}/{{img}}/{{tel}}をDOM順（document order）に辿り、
    // [{ token, unitIndex, seq }, ...] を返す。seqは「同じユニット（またはunitIndex=nullの
    // 共通）・同じtoken」の中で何番目の出現か（0始まり）。ダイアログはこのseqを使って、
    // 同じ種類のプレースホルダーが1つのユニット/共通の中に複数回出る場合（例：#43の各カラム
    // 内の{{text}}×4）でも「本文 1」「本文 2」…と1件ずつ別々の入力欄を出す。
    function walkCatalogFieldOccurrences(wrapper, units) {
      const occurrences = [];
      const seqCounters = {};
      walkCatalogFieldNodes(wrapper, (node, attr, value) => {
        const idx = catalogUnitIndexOf(units, node);
        CATALOG_FIELD_TOKEN_RE.lastIndex = 0;
        let m;
        while ((m = CATALOG_FIELD_TOKEN_RE.exec(value))) {
          const token = m[1];
          const scopeKey = (idx == null ? 'common' : idx) + ':' + token;
          const seq = seqCounters[scopeKey] || 0;
          seqCounters[scopeKey] = seq + 1;
          occurrences.push({ token, unitIndex: idx, seq });
        }
      });
      return occurrences;
    }

    // wrapper内の{{title}}等を、出現ごとに実際の値で置換する。unitValues[i][token] /
    // commonValues[token] は「その(ユニット, token)内でのN番目の値」を並べた配列で、
    // walkCatalogFieldOccurrencesが割り当てたseqと同じ順序（=同じwalkCatalogFieldNodes）で
    // 消費する。1つのユニットに同じtokenが複数回出るパーツ（#43等）でも、出現ごとに別々の
    // 値を当てられる。戻り値は置換後のwrapper.innerHTML。
    function applyCatalogFieldValues(wrapper, units, unitValues, commonValues) {
      const seqCounters = {};
      function nextValue(token, idx) {
        const scopeKey = (idx == null ? 'common' : idx) + ':' + token;
        const seq = seqCounters[scopeKey] || 0;
        seqCounters[scopeKey] = seq + 1;
        const bucket = (idx == null ? commonValues : (unitValues && unitValues[idx])) || {};
        const arr = bucket[token];
        if (Array.isArray(arr)) return arr[seq] != null ? arr[seq] : '';
        return arr != null ? arr : ''; // 配列でない値が渡された場合は全出現へそのまま使う（後方互換）
      }
      walkCatalogFieldNodes(wrapper, (node, attr, value) => {
        const idx = catalogUnitIndexOf(units, node);
        CATALOG_FIELD_TOKEN_RE.lastIndex = 0;
        const next = value.replace(CATALOG_FIELD_TOKEN_RE, (m, tok) => nextValue(tok, idx));
        if (attr) node.setAttribute(attr, next);
        else node.nodeValue = next;
      });
      return wrapper.innerHTML;
    }

    // part.html（未加工のテンプレート）だけを見て、件数ステッパーの初期値
    // （＝そのテンプレートに元々含まれているユニット数）を求める。
    // ユニットが検出できない場合は1（単一カード相当）。variableでないパーツは常に1。
    function catalogNativeUnitCount(part) {
      if (!part || !part.variable) return 1;
      const wrapper = parseCatalogInert(part.html);
      const units = findCatalogFieldUnits(wrapper);
      return units ? units.length : 1;
    }

    // part（＋行数rowCount。variableでなければ無視）を解析し、挿入ダイアログの構築に
    // 必要な情報を返す：{ wrapper, units, unitCount, unitTokenCounts, commonTokenCounts, occurrences }
    // unitTokenCounts[i] / commonTokenCounts は { token: 出現回数 }（0件のtokenはキー自体が無い）。
    // 出現回数が2以上のtokenは、ダイアログ側で「本文 1」「本文 2」…と1件ずつの入力欄になる。
    function analyzeCatalogPartFields(part, rowCount) {
      let html = part.html || '';
      if (part.variable) {
        const n = Math.max(1, Math.min(20, rowCount || 1));
        html = applyCatalogRowCount(html, n);
      }
      const wrapper = parseCatalogInert(html);
      const units = findCatalogFieldUnits(wrapper);
      const occurrences = walkCatalogFieldOccurrences(wrapper, units);
      const unitCount = units ? units.length : 0;
      const unitTokenCounts = [];
      for (let i = 0; i < unitCount; i++) unitTokenCounts.push({});
      const commonTokenCounts = {};
      occurrences.forEach((occ) => {
        const target = occ.unitIndex == null ? commonTokenCounts : unitTokenCounts[occ.unitIndex];
        target[occ.token] = (target[occ.token] || 0) + 1;
      });
      return { wrapper, units, unitCount, unitTokenCounts, commonTokenCounts, occurrences };
    }

    // ========================================
    // v0.13.0: カタログパーツ挿入ダイアログ（openCatalogInsertDialog）
    // 「関連記事」等、同じプレースホルダーが複数回出るパーツで従来1回しか聞かれなかった
    // URL/画像URL/タイトル等を、繰り返しユニット単位（1件目/2件目…）で入力できるようにする。
    // window.promptの逐次呼び出しを置き換える唯一の入口（insertCatalogPartから呼ばれる）。
    // 戻り値：キャンセル時はnull。挿入時は
    //   { rowCount, unitValues: [{token:value}, ...], commonValues: {token:value} }
    // （値はすでに検証・既定値埋め込み済み。実際のHTML組み立てはinsertCatalogPart側で、
    //   applyCatalogRowCount → applyCatalogFieldValues → テーマトークン置換の順に行う）
    // ========================================
    function openCatalogInsertDialog(part, selectedText) {
      return new Promise((resolve) => {
        let settled = false;
        let rowCount = catalogNativeUnitCount(part);
        let state = analyzeCatalogPartFields(part, rowCount);

        // ユーザー入力のキャッシュ（件数変更でセクションを作り直しても値が消えないように）。
        // savedUnitValues[i][token] / savedCommonValues[token] は「出現ごと」の値を並べた配列
        // （1回しか出現しないtokenでも長さ1の配列。#43等、1ユニット内に同じtokenが複数回出る
        // パーツはこの配列が2件以上になり、「本文 1」「本文 2」…として別々に入力できる）
        const savedUnitValues = [];
        const savedCommonValues = {};
        let firstTextDefaultUsed = false;
        let unitFieldEls = []; // unitFieldEls[i][token] = [inputEl, ...]（出現順）
        let commonFieldEls = {}; // commonFieldEls[token] = [inputEl, ...]

        function cleanup(result) {
          if (settled) return;
          settled = true;
          document.removeEventListener('keydown', onKeydown, true);
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          resolve(result);
        }

        function onKeydown(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            cleanup(null);
          }
        }

        function defaultFor(token) {
          if (token === 'title') return 'タイトル';
          if (token === 'text') {
            if (!firstTextDefaultUsed) {
              firstTextDefaultUsed = true;
              return selectedText || 'ここに本文を入れます';
            }
            return 'ここに本文を入れます';
          }
          return ''; // url / img / tel は空欄スタート（プレースホルダー文言だけ見せる）
        }

        function placeholderFor(token) {
          if (token === 'url') return 'https://';
          if (token === 'img') return 'https://placehold.co/600x400?text=IMAGE';
          if (token === 'tel') return '000-000-0000';
          return '';
        }

        // token・出現回数countの1つの出現（0始まりのk番目）につき1つの入力欄を作る。
        // countが2以上のときだけラベルへ「 1」「 2」…を付ける（1回だけの出現は従来どおり
        // 「本文」「リンク先URL」等の素のラベルのまま）。savedBucket[token]は配列。
        function makeField(container, token, k, count, savedBucket) {
          const field = document.createElement('div');
          field.className = 'catalog-insert-field';
          const label = document.createElement('label');
          label.textContent = CATALOG_FIELD_LABELS[token] + (count > 1 ? ' ' + (k + 1) : '');
          field.appendChild(label);
          let input;
          if (token === 'text') {
            input = document.createElement('textarea');
            input.rows = 3;
          } else {
            input = document.createElement('input');
            input.type = 'text';
          }
          const ph = placeholderFor(token);
          if (ph) input.placeholder = ph;
          if (savedBucket && !Array.isArray(savedBucket[token])) savedBucket[token] = [];
          const savedArr = savedBucket ? savedBucket[token] : null;
          const hasSaved = savedArr && k < savedArr.length && savedArr[k] != null;
          input.value = hasSaved ? savedArr[k] : defaultFor(token);
          if (savedArr) savedArr[k] = input.value; // 初期値もキャッシュしておく
          field.appendChild(input);
          const err = document.createElement('div');
          err.className = 'catalog-insert-error';
          field.appendChild(err);
          container.appendChild(field);
          return input;
        }

        // 見た目：プレビューモーダルと同じオーバーレイ／シートの構造を流用（SPEC.md参照）
        const overlay = document.createElement('div');
        overlay.className = 'preview-modal-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');

        const sheet = document.createElement('div');
        sheet.className = 'preview-modal-sheet catalog-insert-sheet';

        const toolbar = document.createElement('div');
        toolbar.className = 'preview-modal-toolbar';
        const toolbarLabel = document.createElement('span');
        toolbarLabel.className = 'preview-modal-label';
        toolbarLabel.textContent = part.no + ' ' + part.name;
        toolbar.appendChild(toolbarLabel);
        sheet.appendChild(toolbar);

        const scroll = document.createElement('div');
        scroll.className = 'preview-modal-scroll catalog-insert-body';
        sheet.appendChild(scroll);

        const desc = document.createElement('p');
        desc.className = 'catalog-insert-desc';
        desc.textContent = part.usage || '';
        scroll.appendChild(desc);

        let stepperInput = null;
        if (part.variable) {
          const stepperWrap = document.createElement('div');
          stepperWrap.className = 'catalog-insert-stepper';
          const stepperLabel = document.createElement('label');
          stepperLabel.textContent = '件数';
          stepperLabel.setAttribute('for', 'catalog-insert-rowcount');
          stepperInput = document.createElement('input');
          stepperInput.type = 'number';
          stepperInput.id = 'catalog-insert-rowcount';
          stepperInput.min = '1';
          stepperInput.max = '20';
          stepperInput.value = String(rowCount);
          stepperWrap.appendChild(stepperLabel);
          stepperWrap.appendChild(stepperInput);
          scroll.appendChild(stepperWrap);
        }

        const sectionsWrap = document.createElement('div');
        scroll.appendChild(sectionsWrap);

        const actions = document.createElement('div');
        actions.className = 'catalog-insert-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn-tertiary';
        cancelBtn.textContent = 'キャンセル';
        const insertBtn = document.createElement('button');
        insertBtn.type = 'button';
        insertBtn.className = 'btn-primary';
        insertBtn.textContent = '挿入';
        actions.appendChild(cancelBtn);
        actions.appendChild(insertBtn);
        sheet.appendChild(actions);

        overlay.appendChild(sheet);
        document.body.appendChild(overlay);

        function renderSections() {
          sectionsWrap.innerHTML = '';
          unitFieldEls = [];
          commonFieldEls = {};

          for (let i = 0; i < state.unitCount; i++) {
            savedUnitValues[i] = savedUnitValues[i] || {};
            const unitBox = document.createElement('div');
            unitBox.className = 'catalog-insert-unit';
            const unitTitle = document.createElement('div');
            unitTitle.className = 'catalog-insert-unit-title';
            unitTitle.textContent = (i + 1) + '件目';
            unitBox.appendChild(unitTitle);
            const fieldEls = {};
            CATALOG_FIELD_TOKENS.forEach((tok) => {
              const count = state.unitTokenCounts[i][tok] || 0;
              if (!count) return;
              fieldEls[tok] = [];
              for (let k = 0; k < count; k++) {
                fieldEls[tok][k] = makeField(unitBox, tok, k, count, savedUnitValues[i]);
              }
            });
            unitFieldEls[i] = fieldEls;
            sectionsWrap.appendChild(unitBox);
          }

          const hasCommon = Object.keys(state.commonTokenCounts).length > 0;
          if (hasCommon) {
            const wrapAsSection = state.unitCount > 0;
            const commonBox = wrapAsSection ? document.createElement('div') : sectionsWrap;
            if (wrapAsSection) {
              commonBox.className = 'catalog-insert-unit';
              const commonTitle = document.createElement('div');
              commonTitle.className = 'catalog-insert-unit-title';
              commonTitle.textContent = '共通';
              commonBox.appendChild(commonTitle);
            }
            CATALOG_FIELD_TOKENS.forEach((tok) => {
              const count = state.commonTokenCounts[tok] || 0;
              if (!count) return;
              commonFieldEls[tok] = [];
              for (let k = 0; k < count; k++) {
                commonFieldEls[tok][k] = makeField(commonBox, tok, k, count, savedCommonValues);
              }
            });
            if (wrapAsSection) sectionsWrap.appendChild(commonBox);
          }

          const firstInput = sectionsWrap.querySelector('input, textarea');
          if (firstInput) firstInput.focus();
        }

        renderSections();

        function captureCurrentValues() {
          // 現在の入力値を保存してからセクションを作り直す（件数変更で値が消えないように）
          for (let i = 0; i < unitFieldEls.length; i++) {
            savedUnitValues[i] = savedUnitValues[i] || {};
            Object.keys(unitFieldEls[i] || {}).forEach((tok) => {
              savedUnitValues[i][tok] = unitFieldEls[i][tok].map((el) => el.value);
            });
          }
          Object.keys(commonFieldEls).forEach((tok) => {
            savedCommonValues[tok] = commonFieldEls[tok].map((el) => el.value);
          });
        }

        if (stepperInput) {
          stepperInput.addEventListener('change', () => {
            captureCurrentValues();

            let n = parseInt(stepperInput.value, 10);
            if (!Number.isFinite(n) || n < 1) n = 1;
            if (n > 20) n = 20;
            stepperInput.value = String(n);
            rowCount = n;
            state = analyzeCatalogPartFields(part, rowCount);
            renderSections();
          });
        }

        function isValidUrlLike(v) {
          return /^(https?:\/\/|\/)/i.test(v);
        }

        // 1グループ分（1ユニット or 共通）のフィールドを読み取り、検証する。fieldEls[tok]は
        // 出現ごとの入力欄の配列。url/imgは未入力なら既定値（#／プレースホルダー画像）で埋め、
        // tel未入力も既定電話番号で埋める。url/imgが非空でhttp(s)://または/で始まらない場合は
        // エラー（挿入させない）。valuesは同じ形（{ token: [値, ...] }）で返す。
        function collect(fieldEls, savedBucket) {
          const values = {};
          let hasError = false;
          let firstErrorInput = null;
          let emptyUrl = false;
          Object.keys(fieldEls).forEach((tok) => {
            const inputs = fieldEls[tok];
            values[tok] = [];
            if (savedBucket) savedBucket[tok] = [];
            inputs.forEach((input, k) => {
              const field = input.parentElement;
              field.classList.remove('has-error');
              const trimmed = (input.value || '').trim();
              let value;
              if (tok === 'url' || tok === 'img') {
                if (!trimmed) {
                  value = tok === 'url' ? '#' : placeholderFor('img');
                  if (tok === 'url') emptyUrl = true;
                } else if (!isValidUrlLike(trimmed)) {
                  field.classList.add('has-error');
                  const err = field.querySelector('.catalog-insert-error');
                  if (err) err.textContent = 'URLは http(s):// または / で始めてください';
                  if (!firstErrorInput) firstErrorInput = input;
                  hasError = true;
                  value = trimmed;
                } else {
                  value = trimmed;
                }
              } else if (tok === 'tel') {
                value = trimmed || placeholderFor('tel');
              } else {
                value = input.value;
              }
              values[tok][k] = value;
              if (savedBucket) savedBucket[tok][k] = input.value;
            });
          });
          return { values, hasError, firstErrorInput, emptyUrl };
        }

        function onInsert() {
          let hasError = false;
          let firstErrorInput = null;
          let anyEmptyUrl = false;

          const unitValues = [];
          for (let i = 0; i < unitFieldEls.length; i++) {
            const r = collect(unitFieldEls[i] || {}, savedUnitValues[i]);
            unitValues[i] = r.values;
            if (r.hasError) {
              hasError = true;
              if (!firstErrorInput) firstErrorInput = r.firstErrorInput;
            }
            if (r.emptyUrl) anyEmptyUrl = true;
          }
          const rc = collect(commonFieldEls, savedCommonValues);
          if (rc.hasError) {
            hasError = true;
            if (!firstErrorInput) firstErrorInput = rc.firstErrorInput;
          }
          if (rc.emptyUrl) anyEmptyUrl = true;

          if (hasError) {
            if (firstErrorInput) firstErrorInput.focus();
            return;
          }
          if (anyEmptyUrl) {
            showToast('URLが未入力の項目があります（# を仮に入れました）', 'info');
          }
          cleanup({ rowCount: rowCount, unitValues: unitValues, commonValues: rc.values });
        }

        insertBtn.onclick = onInsert;
        cancelBtn.onclick = () => cleanup(null);
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) cleanup(null);
        });
        sheet.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            onInsert();
          }
        });
        document.addEventListener('keydown', onKeydown, true);
      });
    }

    // ========================================
    // v0.13.0 P2: 「パーツの色」機能用の純粋ヘルパー群
    // （editor/DOM状態を持たず、partEl・role・tokensだけで完結する関数はここに集約する）
    // ========================================

    // data-part値 → ポップオーバー見出しに出す日本語ラベル
    const PART_COLOR_LABELS = {
      heading: '見出し',
      subheading: 'サブ見出し',
      box: 'ポイント枠',
      list: 'リスト',
      bubble: '吹き出し',
      button: 'ボタン',
      consult: '申込枠',
      empathy: '保護者の方へ',
      note: '室長より',
      highlight: 'マーカー行',
      table: '表',
      hero: 'ヒーロー見出し',
      catalog: 'カタログ パーツ',
      // v0.13.0: 生成語彙対応（新パーツ5種）
      toc: '目次',
      cta: 'CTA',
      summary: 'まとめ',
      related: '関連記事',
      schoolinfo: '教室情報'
    };

    // ターゲット（背景／アクセント／文字／線）セグメントの定義。data-roleの値と対応する。
    const PART_COLOR_ROLE_DEFS = [
      { role: 'bg', label: '背景' },
      { role: 'accent', label: 'アクセント' },
      { role: 'text', label: '文字' },
      { role: 'line', label: '線' }
    ];

    // partEl配下（partEl自身も含む）で data-role が role を含む要素を集める。
    // data-roleは "text line" のように複数トークンを持てるため ~= （単語一致）で判定する。
    function getPartRoleElements(partEl, role) {
      if (!partEl || !role) return [];
      const sel = '[data-role~="' + role + '"]';
      const list = Array.from(partEl.querySelectorAll(sel));
      if (partEl.matches && partEl.matches(sel)) list.unshift(partEl);
      return list;
    }

    // 指定ロールの色を partEl 配下の対象要素へ実際に適用する。
    // 呼び出し側（チップクリック／リセット）はこの関数を経由することで挙動を一本化する。
    function applyPartColor(partEl, role, color) {
      if (!partEl || !role || !color) return;
      const partKey = partEl.getAttribute('data-part') || '';
      const els = getPartRoleElements(partEl, role);
      els.forEach((el) => {
        if (role === 'bg') {
          if (partKey === 'highlight') {
            // マーカー行の背景は「下線風」グラデーション表現のため単純上書きではなく再構築する
            el.style.background = color;
            el.style.background = `linear-gradient(transparent 62%, ${color} 62%)`;
          } else {
            el.style.background = color;
          }
        } else if (role === 'accent') {
          const hasText = (el.textContent || '').trim().length > 0;
          if (hasText) {
            el.style.color = color;
            if ((el.style.borderRadius || '').trim() === '50%') {
              // 吹き出しの丸アイコンのように文字と枠を両方持つ場合は枠色も揃える
              el.style.borderColor = color;
            }
          } else {
            // テキストを持たない装飾バー（見出し脇の細い棒など）
            el.style.background = color;
          }
        } else if (role === 'text') {
          el.style.color = color;
        } else if (role === 'line') {
          // 元々borderが無い辺はwidthが0なので、borderColorだけ設定しても見た目に影響しない
          el.style.borderColor = color;
        }
      });
      // v0.13.0: 吹き出しの背景色を変えたら、尾（ボーダー三角のspan）の色も追従させる。
      // 尾は data-role="tail" で bg 対象には含まれないため、bg変更時にここで別途同期する。
      if (role === 'bg' && partKey === 'bubble') {
        const tailEl = partEl.querySelector('[data-role~="tail"]');
        if (tailEl) {
          if (partEl.getAttribute('data-side') === 'right') {
            tailEl.style.borderLeftColor = color;
          } else {
            tailEl.style.borderRightColor = color;
          }
        }
      }
      if (partEl.dataset) {
        const key = 'color' + role.charAt(0).toUpperCase() + role.slice(1);
        partEl.dataset[key] = color;
      }
    }

    // 「テーマの色に戻す」用：パーツ種別・ロールから、そのテーマ本来の色（トークン値）を返す。
    // 生成テンプレート（buildThemeFromTokens/buildThemedTableHtml等）が実際にどのトークンを
    // 使っているかに合わせたテーブル。単一ロールに複数トークンが混在する箇所（吹き出しの丸アイコン等）
    // は、より視認性の高い方（枠線側）を優先する簡略化をしている。
    function defaultRoleColor(partKey, role, tokens, partEl) {
      const T = tokens || {};
      if (role === 'bg') {
        if (partKey === 'consult' || partKey === 'highlight' || partKey === 'cta') return T.soft;
        if (partKey === 'button') return T.cta;
        if (partKey === 'bubble') {
          // 吹き出しは左右で背景トークンが異なる（左=hero／右=soft）
          const side = partEl && partEl.getAttribute ? partEl.getAttribute('data-side') : null;
          return side === 'right' ? T.soft : T.hero;
        }
        return T.hero; // box, list, hero, toc, summary
      }
      if (role === 'accent') {
        if (partKey === 'note') return T.decor;   // 室長より：引用符（"）
        if (partKey === 'bubble') return T.decor; // 吹き出し：丸アイコンの枠線を優先して復元
        return T.accent;
      }
      if (role === 'text') {
        if (partKey === 'schoolinfo') return T.muted; // 教室情報：控えめな文字色
        return T.ink;
      }
      if (role === 'line') {
        if (partKey === 'empathy' || partKey === 'hero') return T.decor;
        return T.line; // list, table, toc, summary, related, schoolinfo（v0.13.0: 吹き出しはlineロールを持たない新デザインへ移行）
      }
      return T.ink;
    }

    // ========================================
    // v0.13.0 P3: 「テーマを変更」— 貼り直さずにエディタ内の記事の配色だけを
    // 選択中テーマへ入れ替える機能。テキスト・構造・パーツごとの自由色
    // （data-color-*で上書き済みの値）はすべて維持し、テーマトークンから来ている
    // 色だけを見つけて新テーマの同じトークンへ置換する。
    // ========================================

    // key（新12テーマ／旧テーマいずれの表記でも）を必ず有効な12テーマキーへ解決する。
    // getTheme()と同じ解決規則（そのまま→LEGACY_THEME_MAP→不明時はgirly-pink）を
    // 「テーマオブジェクト」ではなく「キー文字列」で返す版。
    function resolveThemeKey(key) {
      const themes = window.PRESET_THEMES || {};
      if (key && themes[key]) return key;
      const mapped = window.LEGACY_THEME_MAP && window.LEGACY_THEME_MAP[key];
      if (mapped && themes[mapped]) return mapped;
      return 'girly-pink';
    }

    // トースト文言用：「12 ネイビー×ゴールド」ではなく「ネイビー×ゴールド」の表示名を返す
    function getThemeDisplayName(key) {
      const resolved = resolveThemeKey(key);
      const entry = (window.THEME_TOKENS_V3 || []).find((t) => t.id === resolved);
      return (entry && entry.name) || resolved;
    }

    // CSS値の中に現れる色表現（#hex または rgb()/rgba()）を検出する正規表現
    const RETHEME_COLOR_TOKEN_RE = /#[0-9a-fA-F]{3,6}\b|rgba?\([^)]*\)/g;

    // 色文字列を "#RRGGBB"（大文字）に正規化する。ブラウザがhex指定をrgb()へ
    // シリアライズし直すことがあるため、比較前に必ずこれを通す。
    function normalizeColorToHex(raw) {
      if (!raw) return null;
      const str = String(raw).trim();
      let m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(str);
      if (m) {
        let hex = m[1];
        if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
        return '#' + hex.toUpperCase();
      }
      m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*[\d.]+\s*)?\)$/i.exec(str);
      if (m) {
        const toHex = (v) => {
          const n = Math.max(0, Math.min(255, Math.round(parseFloat(v))));
          return n.toString(16).padStart(2, '0');
        };
        return '#' + (toHex(m[1]) + toHex(m[2]) + toHex(m[3])).toUpperCase();
      }
      return null;
    }

    // value（例: "1px solid #DEDAD8" や "linear-gradient(transparent 62%,#FFE1EB 62%)"）の
    // 中から、tokenKeyPrecedenceの先頭トークンから順に一致する色を探し、見つかったトークン
    // だけをnewTokens側の同名トークンへ差し替える。一致するトークンが無ければnull（変更なし）。
    function substituteTokenColorInCssValue(value, tokenKeyPrecedence, oldTokens, newTokens) {
      if (!value) return null;
      const found = value.match(RETHEME_COLOR_TOKEN_RE);
      if (!found || !found.length) return null;
      for (let i = 0; i < tokenKeyPrecedence.length; i++) {
        const tokenKey = tokenKeyPrecedence[i];
        const oldHex = normalizeColorToHex(oldTokens && oldTokens[tokenKey]);
        const newHex = newTokens && newTokens[tokenKey];
        if (!oldHex || !newHex) continue;
        const matches = Array.from(new Set(found.filter((s) => normalizeColorToHex(s) === oldHex)));
        if (!matches.length) continue;
        let next = value;
        matches.forEach((sub) => { next = next.split(sub).join(newHex); });
        if (next !== value) return next;
      }
      return null;
    }

    const RETHEME_BG_PROPS = ['background', 'background-color', 'background-image'];
    const RETHEME_COLOR_PROPS = ['color'];
    const RETHEME_BORDER_PROPS = [
      'border-color', 'border',
      'border-top', 'border-right', 'border-bottom', 'border-left',
      'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color'
    ];
    // 通常パーツ：背景/文字/線それぞれの優先順位でトークンを探す
    // v0.13.0: 吹き出しの尾（border-right-color/border-left-color）はhero/soft、
    // アバターの枠線はdecorを使うため、border優先順位にhero/soft/paperを追加した
    // v0.13.0: 本ボタンのborderがcta色（背景と同色の枠線）になったため、末尾にctaを追加
    // （既存トークンとの一致を優先し、ctaは他が一致しない場合のフォールバックとして働く）
    const RETHEME_GENERIC_PRECEDENCE = {
      bg: ['hero', 'soft', 'paper', 'decor', 'accent', 'cta'],
      color: ['ink', 'accent', 'muted', 'decor', 'onCta'],
      border: ['line', 'decor', 'accent', 'ink', 'ctaBorder', 'hero', 'soft', 'paper', 'cta']
    };
    // ボタン（[data-part="button"] および CTA保護ブロック内の<a>）専用の対応表
    // v0.13.0: 本ボタンのborderがcta色になったため、ctaBorderより先にctaを見る
    const RETHEME_BUTTON_PRECEDENCE = {
      bg: ['cta'],
      color: ['onCta'],
      border: ['cta', 'ctaBorder']
    };

    function isRethemeButtonLikeEl(el) {
      return !!(el && el.getAttribute && el.getAttribute('data-part') === 'button');
    }

    // 1要素分：inlineスタイルのbackground/color/border系プロパティを、oldTokens→newTokens
    // のトークン置換規則で塗り替える。何か変わればtrueを返す。data-color-*属性には触れない。
    function retoneElementInlineColors(el, oldTokens, newTokens, isButtonLike) {
      if (!el || !el.style || !el.getAttribute || !el.getAttribute('style')) return false;
      const precedence = isButtonLike ? RETHEME_BUTTON_PRECEDENCE : RETHEME_GENERIC_PRECEDENCE;
      let changed = false;
      const applyGroup = (props, tokenKeys) => {
        if (!tokenKeys || !tokenKeys.length) return;
        props.forEach((prop) => {
          const current = el.style.getPropertyValue(prop);
          if (!current) return;
          const next = substituteTokenColorInCssValue(current, tokenKeys, oldTokens, newTokens);
          if (next !== null && next !== current) {
            el.style.setProperty(prop, next);
            changed = true;
          }
        });
      };
      applyGroup(RETHEME_BG_PROPS, precedence.bg);
      applyGroup(RETHEME_COLOR_PROPS, precedence.color);
      applyGroup(RETHEME_BORDER_PROPS, precedence.border);
      return changed;
    }

    // エディタ内の記事全体を、貼り直さずに選択中テーマ(newKey)の配色へ入れ替える。
    // テキスト・構造・パーツごとの自由色（data-color-*）はすべて維持する。
    // 戻り値：実際に色が変わった要素数。
    function rethemeEditorContent(newKey) {
      const editorEl = document.querySelector('.eisai-editor');
      if (!editorEl) return 0;

      const resolvedNewKey = resolveThemeKey(newKey);
      const newTheme = getTheme(resolvedNewKey);
      const newTokens = newTheme.tokens;
      const fallbackOldKeyRaw = window.lastAppliedThemeKey || 'girly-pink';
      let changedCount = 0;

      // 1) [data-part] を持つ現行方式のパーツ（consult内のbutton等の入れ子も含めて辿る。
      //    子は親の走査で既に更新済みになるため、子自身の走査は実質no-opで安全）
      Array.from(editorEl.querySelectorAll('[data-part]')).forEach((partRoot) => {
        const rawOldKey = partRoot.getAttribute('data-theme') || fallbackOldKeyRaw;
        const resolvedOldKey = resolveThemeKey(rawOldKey);
        if (resolvedOldKey === resolvedNewKey) return; // すでにこのテーマ

        const oldTokens = getTheme(resolvedOldKey).tokens;
        const styled = [];
        if (partRoot.hasAttribute('style')) styled.push(partRoot);
        partRoot.querySelectorAll('[style]').forEach((el) => styled.push(el));
        styled.forEach((el) => {
          if (retoneElementInlineColors(el, oldTokens, newTokens, isRethemeButtonLikeEl(el))) changedCount++;
        });

        partRoot.setAttribute('data-theme', resolvedNewKey);
      });

      // 2) 旧クラスベースのパーツ（.theme-heading 等）：data-themeの張り替えだけでよい。
      //    実際の見た目はaddThemeStylesが注入するCSS（[data-theme]セレクタ）が担う。
      const legacyPartSelector = [
        '.theme-heading[data-theme]', '.theme-subheading[data-theme]', '.theme-box[data-theme]',
        '.theme-bubble-left[data-theme]', '.theme-bubble-right[data-theme]',
        '.theme-button[data-theme]', '.theme-list[data-theme]'
      ].join(', ');
      Array.from(editorEl.querySelectorAll(legacyPartSelector)).forEach((el) => {
        const resolvedOldKey = resolveThemeKey(el.getAttribute('data-theme'));
        if (resolvedOldKey === resolvedNewKey) return;
        el.setAttribute('data-theme', resolvedNewKey);
        changedCount++;
      });
      if (typeof addThemeStyles === 'function') {
        addThemeStyles(resolvedNewKey, newTheme);
      }

      // 3) data-cta-protected ブロック：テキスト・hrefは一切変えず、
      //    ラッパー背景（soft）と内部<a>（ボタン規則）だけ塗り替える
      Array.from(editorEl.querySelectorAll('[data-cta-protected]')).forEach((node) => {
        const rawOldKey = node.getAttribute('data-theme') || fallbackOldKeyRaw;
        const resolvedOldKey = resolveThemeKey(rawOldKey);
        if (resolvedOldKey === resolvedNewKey) return;
        const oldTokens = getTheme(resolvedOldKey).tokens;
        if (retoneElementInlineColors(node, oldTokens, newTokens, false)) changedCount++;
        node.querySelectorAll('a').forEach((a) => {
          if (retoneElementInlineColors(a, oldTokens, newTokens, true)) changedCount++;
        });
      });

      // 4) 上記のいずれにも属さない素の装飾（地の文<p>・<ol>等）。ink（本文色）は
      //    12テーマ共通のため実際に変わることは無いが、将来のトークン差異に備え
      //    汎用ルールを通しておく。
      const fallbackOldTokens = getTheme(resolveThemeKey(fallbackOldKeyRaw)).tokens;
      Array.from(editorEl.querySelectorAll('[style]')).forEach((el) => {
        if (el.closest('[data-part]') || el.closest('[data-cta-protected]')) return;
        if (retoneElementInlineColors(el, fallbackOldTokens, newTokens, false)) changedCount++;
      });

      return changedCount;
    }

    // 現在のキャレット位置を含む、最も内側の [data-part] 要素を返す（無ければnull）。
    // consultの中のbuttonのように入れ子になっている場合は内側（button）を返す。
    function getCaretPartEl(editor) {
      if (!editor) return null;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      let node = sel.getRangeAt(0).startContainer;
      if (!editor.contains(node)) return null;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      if (!node || node.nodeType !== Node.ELEMENT_NODE || typeof node.closest !== 'function') return null;
      const partEl = node.closest('[data-part]');
      if (partEl && editor.contains(partEl)) return partEl;
      return null;
    }

    // v0.13.0: 「リンク編集」ボタン用 — 現在のキャレット/選択位置から編集対象の<a>を1つ求める。
    // 1) キャレットが<a>の内側にある場合はそれ。
    // 2) そうでなくても、直近の[data-part]要素（カード等）が<a>をちょうど1つだけ含む場合はそれ。
    // どちらにも該当しなければnull（＝ボタンは無効）。
    function getCaretLinkContext(editor) {
      if (!editor) return null;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      let node = sel.getRangeAt(0).startContainer;
      if (!editor.contains(node)) return null;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      if (!node || node.nodeType !== Node.ELEMENT_NODE || typeof node.closest !== 'function') return null;

      const directA = node.closest('a');
      if (directA && editor.contains(directA)) {
        return { anchor: directA, root: directA };
      }

      const partEl = node.closest('[data-part]');
      if (partEl && editor.contains(partEl)) {
        const anchors = partEl.querySelectorAll('a');
        if (anchors.length === 1) {
          return { anchor: anchors[0], root: partEl };
        }
      }
      return null;
    }

    // v0.13.0: 「リンク編集」ダイアログ本体。対象の<a>のhref（リンク先URL）と、
    // その<a>（またはカード）内にimgが1つだけあれば画像URL（src）を編集する。
    // OKで確定した値をその場でDOMへ適用し、EditorHistoryへ1手として確定する。
    // 戻り値：適用したらtrue、キャンセルしたらfalse。
    function openLinkEditDialog(editor, linkCtx) {
      return new Promise((resolve) => {
        const anchorEl = linkCtx.anchor;
        const rootEl = linkCtx.root;
        const imgEl = anchorEl.querySelector('img') || (rootEl !== anchorEl ? rootEl.querySelector('img') : null);

        let settled = false;
        function cleanup(applied) {
          if (settled) return;
          settled = true;
          document.removeEventListener('keydown', onKeydown, true);
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          resolve(applied);
        }
        function onKeydown(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            cleanup(false);
          }
        }

        const overlay = document.createElement('div');
        overlay.className = 'preview-modal-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');

        const sheet = document.createElement('div');
        sheet.className = 'preview-modal-sheet link-edit-sheet';

        const toolbar = document.createElement('div');
        toolbar.className = 'preview-modal-toolbar';
        const toolbarLabel = document.createElement('span');
        toolbarLabel.className = 'preview-modal-label';
        toolbarLabel.textContent = 'リンク編集';
        toolbar.appendChild(toolbarLabel);
        sheet.appendChild(toolbar);

        const scroll = document.createElement('div');
        scroll.className = 'preview-modal-scroll catalog-insert-body';
        sheet.appendChild(scroll);

        function makeField(labelText, initialValue, placeholder) {
          const field = document.createElement('div');
          field.className = 'catalog-insert-field';
          const label = document.createElement('label');
          label.textContent = labelText;
          field.appendChild(label);
          const input = document.createElement('input');
          input.type = 'text';
          input.value = initialValue || '';
          if (placeholder) input.placeholder = placeholder;
          field.appendChild(input);
          const err = document.createElement('div');
          err.className = 'catalog-insert-error';
          field.appendChild(err);
          scroll.appendChild(field);
          return input;
        }

        const hrefInput = makeField('リンク先URL', anchorEl.getAttribute('href') || '', 'https://');
        const srcInput = imgEl ? makeField('画像URL', imgEl.getAttribute('src') || '', 'https://') : null;

        const actions = document.createElement('div');
        actions.className = 'catalog-insert-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn-tertiary';
        cancelBtn.textContent = 'キャンセル';
        const okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'btn-primary';
        okBtn.textContent = 'OK';
        actions.appendChild(cancelBtn);
        actions.appendChild(okBtn);
        sheet.appendChild(actions);

        overlay.appendChild(sheet);
        document.body.appendChild(overlay);
        hrefInput.focus();
        hrefInput.select();

        // href：http(s)://・/・tel:・mailto:・#（既存テンプレの相談ボタン等で使われる形式）を許可。
        // 空欄はそのまま送信させず、#（仮のリンク）へフォールバックして警告を出す。
        function isValidHref(v) {
          return /^(https?:\/\/|\/|tel:|mailto:|#)/i.test(v);
        }

        function onOk() {
          const hrefField = hrefInput.parentElement;
          hrefField.classList.remove('has-error');
          let href = hrefInput.value.trim();
          let warnEmpty = false;
          if (!href) {
            href = '#';
            warnEmpty = true;
          } else if (!isValidHref(href)) {
            hrefField.classList.add('has-error');
            const err = hrefField.querySelector('.catalog-insert-error');
            if (err) err.textContent = 'URLは http(s):// / tel: mailto: のいずれかで始めてください';
            hrefInput.focus();
            return;
          }

          let src = null;
          if (srcInput) {
            src = srcInput.value.trim();
            if (!src) {
              src = 'https://placehold.co/600x400?text=IMAGE';
            } else if (!/^(https?:\/\/|\/)/i.test(src)) {
              const srcField = srcInput.parentElement;
              srcField.classList.add('has-error');
              const err = srcField.querySelector('.catalog-insert-error');
              if (err) err.textContent = 'URLは http(s):// または / で始めてください';
              srcInput.focus();
              return;
            }
          }

          anchorEl.setAttribute('href', href);
          if (srcInput && imgEl) imgEl.setAttribute('src', src);

          if (warnEmpty) {
            showToast('URLが未入力の項目があります（# を仮に入れました）', 'info');
          }
          if (typeof markUnsavedChange === 'function') markUnsavedChange();
          EditorHistory.commit();
          cleanup(true);
        }

        okBtn.onclick = onOk;
        cancelBtn.onclick = () => cleanup(false);
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) cleanup(false);
        });
        sheet.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            onOk();
          }
        });
        document.addEventListener('keydown', onKeydown, true);
      });
    }

    // === アイコン版エディタコア ===
    function createEisaiEditorIcons(options = {}) {
      const { target = document.body, initialContent = '', onCopyHtml = null, onPreview = null } = options;
      const TOOL_ID = 'eisai-editor-icons';
      
      function createEl(tag, props = {}, parent = null, text = '') {
        const el = document.createElement(tag);
        try {
          // id / className はDOM属性として設定し、それ以外をstyleへ
          const { className, id, ...styles } = props;
          if (className) el.className = className;
          if (id) el.id = id;
          Object.assign(el.style, styles);
          if (text) el.textContent = text;
          if (parent) parent.appendChild(el);
        } catch (e) {
          console.error('createEl error', e);
        }
        return el;
      }

      function insertNodeAtCursor(node, preserveSelection = false) {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        if (!preserveSelection) {
          range.deleteContents();
        }
        range.insertNode(node);
        range.setStartAfter(node);
        range.setEndAfter(node);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      // ブロック要素用: 段落途中で押された場合でも、前後のテキストを保ったまま
      // [前のテキストの<p>] [ブロック] [後ろのテキストの<p>] になるように挿入する
      // v0.11.0 P1 C4b (OPS-09): <p>（や装飾のない<div>）の途中にブロックを挿入する際、
      // <div>を<p>の中に入れ子にしてしまわず、本当に段落を分割する。
      // 前半のテキストは元の<p>に残し、ブロックをその後に挿入し、後半は新しい<p>へ。
      function insertBlockAtCursor(editor, blockNode) {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;

        const range = sel.getRangeAt(0);

        // 選択範囲があれば削除してキャレット位置に確定する
        if (!range.collapsed) {
          range.deleteContents();
        }

        // 分割対象にできる「地の文の段落」かどうか判定
        // （装飾テーマ・枠・吹き出し等の特殊要素は対象外。それぞれ専用の挿入処理がある）
        const isPlainParagraph = (el) => {
          if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
          if (el.tagName === 'P') return true;
          if (el.tagName === 'DIV') {
            const hasStyle = el.getAttribute('style');
            const hasClass = el.className && String(el.className).trim();
            return !hasStyle && !hasClass;
          }
          return false;
        };

        let startContainer = range.startContainer;
        let container = startContainer.nodeType === Node.TEXT_NODE ? startContainer.parentNode : startContainer;

        let paraEl = null;
        let cur = container;
        while (cur && cur !== editor) {
          if (isPlainParagraph(cur)) { paraEl = cur; break; }
          cur = cur.parentNode;
        }

        if (paraEl) {
          // キャレットより後ろの内容を取り出す（前半は paraEl に残る）
          const afterRange = document.createRange();
          afterRange.setStart(range.startContainer, range.startOffset);
          afterRange.setEnd(paraEl, paraEl.childNodes.length);
          const afterFragment = afterRange.extractContents();

          const beforeHasText = (paraEl.textContent || '').replace(/ /g, ' ').trim() !== '';
          const afterHasText = (afterFragment.textContent || '').replace(/ /g, ' ').trim() !== '';

          if (beforeHasText && afterHasText) {
            // 前後どちらにも本文があるので、実際に段落を分割する
            const afterEl = paraEl.cloneNode(false);
            afterEl.removeAttribute('id');
            afterEl.appendChild(afterFragment);
            paraEl.parentNode.insertBefore(blockNode, paraEl.nextSibling);
            paraEl.parentNode.insertBefore(afterEl, blockNode.nextSibling);
          } else if (afterHasText) {
            // キャレットが段落の先頭付近：取り出した内容を元の<p>へ戻し、ブロックはその前に挿入
            while (afterFragment.firstChild) paraEl.appendChild(afterFragment.firstChild);
            paraEl.parentNode.insertBefore(blockNode, paraEl);
          } else {
            // キャレットが段落の末尾付近：ブロックはその後に挿入
            paraEl.parentNode.insertBefore(blockNode, paraEl.nextSibling);
            if (!beforeHasText && paraEl.childNodes.length === 0) {
              // 段落が空になった場合はキャレット表示のため<br>を残す
              paraEl.appendChild(document.createElement('br'));
            }
          }
        } else {
          // 段落の外（エディタ直下など）ではそのまま挿入
          range.insertNode(blockNode);
        }

        // v0.11.0 D-2 Part1-1: 分割時にエディタ直下へ孤立した<br>が残ることがある
        // （例: P:AAAA, DIV.theme-box, BR, P:BBBB）。ブロックに隣接するその<br>を除去する。
        if (blockNode.parentNode === editor) {
          const prevSib = blockNode.previousSibling;
          if (prevSib && prevSib.nodeType === Node.ELEMENT_NODE && prevSib.tagName === 'BR') {
            prevSib.remove();
          }
          const nextSib = blockNode.nextSibling;
          if (nextSib && nextSib.nodeType === Node.ELEMENT_NODE && nextSib.tagName === 'BR') {
            nextSib.remove();
          }
        }

        // キャレットをブロックの後に移動
        const caretRange = document.createRange();
        caretRange.setStartAfter(blockNode);
        caretRange.setEndAfter(blockNode);
        sel.removeAllRanges();
        sel.addRange(caretRange);
      }
