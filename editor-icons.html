      // 用途ごとにアイテムを生成
      function buildMocaItems(role) {
        const items = {};
        MOCA_TEMPLATES.forEach(t => {
          if (t.roles.includes(role)) {
            const key = `moca_${t.no}`;
            // プレビュー用のHTMLを調整（外枠を消し、サイズを小さくする）
            let previewHtml = t.html;
            
            // 見出し・枠は background を維持しつつ border だけ細くする
            if (role === 'heading' || role === 'box') {
              previewHtml = previewHtml.replace(/border:\s*(\d+)px\s*solid\s*#[^;]+/g, (match) => {
                return match.replace(/(\d+)px/, (width) => {
                  const newWidth = Math.max(1, Math.floor(parseInt(width) / 2));
                  return `${newWidth}px`;
                });
              });
            }

            // 見出しプレビューは、テキストと余白を見出しらしく調整
            if (role === 'heading') {
              let inner = previewHtml;
              inner = inner.replace(/ここに本文を入れます♪/g, 'サンプル');
              // 元のfont-sizeを統一サイズに置換
              inner = inner.replace(/font-size:\s*\d+%?;?/g, '');

              previewHtml = `
                <div style="
                  padding:4px 10px;
                  max-width:180px;
                  box-sizing:border-box;
                ">
                  <div style="font-size:16px; font-weight:600; line-height:1.4;">
                    ${inner}
                  </div>
                </div>
              `;
            }

            // 枠・BOXプレビューは、標準サイズの文字で統一（8文字×2行）
            if (role === 'box') {
              let inner = previewHtml;
              inner = inner.replace(/ここに本文を入れます♪/g, 'ここにテキストが<br>入ります。');
              // 元のfont-sizeを削除して統一
              inner = inner.replace(/font-size:\s*\d+%?;?/g, '');

              previewHtml = `
                <div style="
                  padding:4px;
                  max-width:180px;
                  box-sizing:border-box;
                ">
                  <div style="font-size:12px; line-height:1.4;">
                    ${inner}
                  </div>
                </div>
              `;
            }

            // 吹き出しは、元の moca HTML デザインをほぼそのまま使う。
            // ただし margin だけ削って、プレビューコンテナ内に収まるようにする。
            if (role === 'bubble') {
              let inner = previewHtml;
              inner = inner.replace(/margin(-\w+)?:\s*[^;]+;?/g, '');
              inner = inner.replace(/ここに本文を入れます♪/g, '吹き出しです');
              // no: 32, 34 の吹き出し口位置をプレビュー用に調整
              if (t.no === 32 || t.no === 34) {
                inner = inner.replace(/top:\s*20px;/g, 'top: 15px;');
              }
              // no: 37, 38 の吹き出し口位置をプレビュー用に調整
              if (t.no === 37 || t.no === 38) {
                inner = inner.replace(/top:\s*50%;/g, 'top: 15px;');
                inner = inner.replace(/margin-top:\s*-15px;/g, '');
              }

              // no: 40 (右下向き) の三角位置調整
              // margin全消去により左端に行っているので、右寄せにする
              if (t.no === 40) {
                inner = inner.replace(/border-width:\s*15px\s*15px\s*0\s*15px;/g, 'border-width: 15px 15px 0 15px; margin-left: auto; margin-right: 20px;');
              }

              // no: 42 (上向き) の三角位置調整
              // margin全消去により左端に行っているので、適度な左位置(20px)に戻す
              if (t.no === 42) {
                inner = inner.replace(/border-width:\s*15px\s*;/g, 'border-width: 15px; margin-left: 20px;');
              }
              previewHtml = `
                <div style="
                  display:flex;
                  align-items:center;
                  justify-content:flex-start;
                  max-width:180px;
                  min-height:40px;
                  overflow:visible;
                ">
                  <div style="font-size:90%; line-height:1.4;">
                    ${inner}
                  </div>
                </div>
              `;
            }

            // リストは縮小表示して全体を見せる
            if (role === 'list') {
              // ポイント4を削除
              previewHtml = previewHtml.replace(/<li>ポイント4<\/li>/g, '');
              // marginを調整（上マージンを確保して、突き出しタイトルが見切れないようにする）
              previewHtml = previewHtml.replace(/margin:\s*[^;]+;/g, 'margin: 20px 0 0 0;');
              
              // タイトル被り防止：タイトル付きボックスのみ、上paddingを増やしてリストを下げる
              if (t.label.includes('タイトル')) {
                // 最初のタグ（親コンテナ）の style 属性に padding-top を追加
                previewHtml = previewHtml.replace(/style="([^"]+)"/, 'style="$1 padding-top: 45px !important;"');
              }

              previewHtml = `
                <div style="
                  transform: scale(0.6);
                  transform-origin: center;
                  width: 240px; /* scale0.6 なので実質 144px 程度に収まる */
                  margin: -20px -40px; /* 縮小分の余白調整 */
                ">
                  ${previewHtml}
                </div>
              `;
            }

            // メモ系は border を完全に消して、背景や影だけで見せる
            if (role === 'memo') {
              previewHtml = previewHtml.replace(/border:\s*[^;]+;/g, '');
              previewHtml = previewHtml.replace(/border-[^:]*:\s*[^;]+;/g, '');
            }

            // ボタンはonclickを削除し、縮小表示
            if (role === 'button') {
              previewHtml = previewHtml.replace(/onclick="[^"]*"/g, '');
              // marginをリセット
              previewHtml = previewHtml.replace(/margin[^;]+;/g, 'margin: 0 auto;');
              previewHtml = `
                <div style="padding: 5px; transform: scale(0.75); transform-origin: center;">
                  ${previewHtml}
                </div>
              `;
            }
            
            // 役割別のサンプルテキストやスタイル調整は行わず、
            // MOCA_TEMPLATES に定義された HTML をそのまま（プレビュー用の軽微な加工のみ）表示する
            items[key] = {
              label: `moca ${t.label}`,
              preview: previewHtml,
              data: { no: t.no, role, raw: t.html },
              colors: t.colors || null  // テンプレート固有の色パターン
            };
          }
        });
        return items;
      }

      // 完全なデザイン定義
      const DESIGNS = {
        heading: {
          label: '見出し',
          items: buildMocaItems('heading')
        },
        box: {
          label: '枠・BOX',
          items: buildMocaItems('box')
        },
        memo: {
          label: 'メモ',
          items: buildMocaItems('memo')
        },
        bubble: {
          label: '吹き出し',
          items: buildMocaItems('bubble')
        },
        button: {
          label: 'ボタン',
          items: buildMocaItems('button')
        },
        list: {
          label: 'リスト',
          items: buildMocaItems('list')
        },
        text: {
          label: 'テキスト',
          items: {
            marker_yellow: { label: '黄色マーカー', type: 'marker', color: 'yellow' },
            marker_pink: { label: 'ピンクマーカー', type: 'marker', color: 'pink' },
            marker_blue: { label: '青マーカー', type: 'marker', color: 'blue' },
            marker_green: { label: '緑マーカー', type: 'marker', color: 'green' },
            marker_orange: { label: 'オレンジマーカー', type: 'marker', color: 'orange' },
          },
        },
        insert: {
          label: '挿入',
          items: {
            quote: { label: '引用', type: 'quote' },
            code: { label: 'コードブロック', type: 'code' },
            table: { label: 'テーブル', type: 'table' },
          },
        }
      };

      // 色定義（テキスト用は濃色、背景用・マーカー用は対応する色）
      const COLORS = {
        text:   ['#111827', '#ef4444', '#2563eb', '#16a34a', '#eab308', '#f97316'],
        bg:     ['#ffffff', '#fee2e2', '#dbeafe', '#dcfce7', '#fef3c7', '#ffedd5'],
        // マーカーはクラス名のキー（実際の色は別マップで管理）
        marker: ['yellow', 'pink', 'blue', 'green', 'orange']
      };

      // 選択範囲保存用（ボタンクリックでフォーカスが外れる対策）
      let globalSavedRange = null;

      // v0.11.0 D-2 Part1-4 (OPS-22): globalSavedRangeが古い/別画面のノードを指していると
      // 復元時に例外や意図しない場所への挿入を起こす。エディタ内の有効な範囲であることを
      // 確認できた場合のみ復元する。復元できたかどうかをboolで返す。
      function restoreSavedRange(editor) {
        if (!globalSavedRange) return false;
        try {
          const container = globalSavedRange.commonAncestorContainer;
          if (!container || !editor.contains(container)) return false;
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(globalSavedRange);
          return true;
        } catch (e) {
          return false;
        }
      }

      async function applyBlock(editor, catKey, itemDef) {
        // 選択範囲を復元（ボタンクリックで外れたフォーカスを戻す）
        if (!restoreSavedRange(editor)) {
          editor.focus();
          // 選択範囲がない場合はエディタの末尾にキャレットを置く
          const s = window.getSelection();
          if (s.rangeCount === 0) {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            s.addRange(range);
          }
        }
        editor.focus();

        // 選択中のテキストを取得
        const sel = window.getSelection();
        let selectedText = '';
        if (sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) {
          selectedText = sel.toString();
        }

        let newNode;
        
        switch (catKey) {
          case 'heading':
          case 'box':
          case 'list':
            // 見出し・枠・リストは横幅いっぱい、配置選択なし
            newNode = createMocaBlock(itemDef.no, catKey, selectedText, itemDef.color, itemDef.isGradient);
            break;
          case 'memo':
          case 'bubble':
            // 吹き出しは配置選択あり
            const alignment = await showListAlignmentDialog();
            // v0.11.0 P1 C4d: キャンセル（null）の場合は何も挿入・変更しない
            if (alignment === null) {
              editor.focus();
              restoreSavedRange(editor);
              return;
            }
            newNode = createMocaBlock(itemDef.no, catKey, selectedText, itemDef.color, itemDef.isGradient, '', alignment);
            // ダイアログ後にフォーカスを戻す
            editor.focus();
            restoreSavedRange(editor);
            break;
          case 'button':
            newNode = createMocaBlock(itemDef.no, catKey, selectedText, itemDef.color, itemDef.isGradient, itemDef.url);
            break;
          case 'text':
            applyTextStyle(itemDef.type, itemDef.color);
            EditorHistory.commit();
            return;
          case 'insert':
            if (itemDef.type === 'table') {
              // テーブルは行数・列数を指定するダイアログを表示
              showTableDialog(editor);
              return;
            }
            newNode = createInsertBlock(itemDef.type);
            break;
          default:
            return;
        }

        // ブロック系は段落を分割して挿入
        insertBlockAtCursor(editor, newNode);
        // 末尾に空行を入れる（ブロックの直後に既に段落等が続く場合は入れない。
        // 入れてしまうとエディタ直下に孤立した<br>が残り、コピー時に余分な空行になる）
        if (!newNode.nextSibling) {
          insertNodeAtCursor(document.createElement('br'));
        }
        // v0.13.0: パーツ挿入（見出し/枠/リスト/吹き出し/ボタン/引用/コードブロック等）を1手として確定
        EditorHistory.commit();
      }

      // ========================================
      // v0.13.0: カスタムモード「ニュー」セット（承認済み47パーツカタログ）の挿入。
      // MOCAパーツと同じ経路（restoreSavedRange → insertBlockAtCursor → EditorHistory.commit）
      // に乗せつつ、プレースホルダー置換・行数可変の再構成・URLダイアログ等はカタログ専用に行う。
      // ========================================
      async function insertCatalogPart(editorEl, no) {
        const part = (window.PARTS_CATALOG_V2 || []).find((p) => p.no === no);
        if (!part) return;

        if (!restoreSavedRange(editorEl)) {
          editorEl.focus();
          const s = window.getSelection();
          if (s.rangeCount === 0) {
            const range = document.createRange();
            range.selectNodeContents(editorEl);
            range.collapse(false);
            s.addRange(range);
          }
        }
        editorEl.focus();

        const sel = window.getSelection();
        let selectedText = '';
        if (sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) {
          selectedText = sel.toString();
        }

        // v0.13.0: 逐次prompt()の代わりに1つの挿入ダイアログでまとめて聞く。
        // 複数カード／複数ボタン等、同じプレースホルダーが複数回出るパーツでも
        // 1件ずつ別々の値を入力できる（キャンセル時はnullが返り、何も挿入しない）
        const dialogResult = await openCatalogInsertDialog(part, selectedText);
        if (dialogResult === null) { restoreSavedRange(editorEl); return; }

        // 行数可変パーツ：ダイアログで確定した件数で先に構造を組み立てる
        let html = part.html;
        if (part.variable) {
          html = applyCatalogRowCount(html, dialogResult.rowCount);
        }

        // {{title}}/{{text}}/{{url}}/{{img}}/{{tel}}を、出現順に「属するユニット」の値で置換する
        const fieldWrapper = parseCatalogInert(html);
        const fieldUnits = findCatalogFieldUnits(fieldWrapper);
        html = applyCatalogFieldValues(fieldWrapper, fieldUnits, dialogResult.unitValues, dialogResult.commonValues);

        const theme = getTheme(currentTheme);
        const tokens = theme.tokens;
        // {{color}}/{{light}}/{{dark}}/{{accent}}等のテーマトークンを置換する。
        // {{text}}/{{title}}は上ですでに置換済みのため、ここでは何もしない（no-op）
        html = substituteCatalogThemeTokens(html, tokens, selectedText);
        html = fixCatalogCtaTextColor(html, tokens);

        const wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        let rootNode;
        if (wrapper.children.length === 1) {
          rootNode = wrapper.firstElementChild;
        } else {
          // 複数トップレベル要素のパーツ（#31/#39/#44等）は単一rootにまとめてdata属性を持たせる
          rootNode = document.createElement('div');
          while (wrapper.firstChild) rootNode.appendChild(wrapper.firstChild);
        }
        rootNode.setAttribute('data-part', 'catalog');
        rootNode.setAttribute('data-catalog-no', String(part.no));
        rootNode.setAttribute('data-theme', currentTheme);
        scanCatalogPartRoles(rootNode, tokens);

        restoreSavedRange(editorEl);
        editorEl.focus();
        insertBlockAtCursor(editorEl, rootNode);
        if (!rootNode.nextSibling) {
          insertNodeAtCursor(document.createElement('br'));
        }
        markUnsavedChange();
        // v0.13.0: カタログパーツ挿入を1手として確定（MOCA/プリセットと同じ扱い）
        EditorHistory.commit();
      }

      function applyTextStyle(type, color) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        
        const range = selection.getRangeAt(0);
        const selectedText = range.toString();
        
        if (type === 'marker') {
          if (!selectedText) return;

          // 選択範囲が複数の段落（ブロック）をまたいでいないか確認する（v0.11.0 P1 C4c / OPS-15）
          // またいでいる場合、そのまま適用すると段落が統合され構造が壊れるため中断する
          const getBlockAncestor = (node) => {
            const blockTags = ['P', 'DIV', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'TD', 'TH', 'PRE'];
            let el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
            while (el && el !== editor) {
              if (blockTags.includes(el.tagName)) return el;
              el = el.parentElement;
            }
            return editor;
          };
          const startBlock = getBlockAncestor(range.startContainer);
          const endBlock = getBlockAncestor(range.endContainer);
          if (startBlock !== endBlock) {
            showToast('1つの段落内で選択してください', 'info');
            return;
          }

          // マーカー色ごとの下線ハイライト色を定義（CSSに依存せずHTMLだけで完結させる）
          const markerBgMap = {
            yellow: '#fef3c7',
            pink:   '#fce7f3',
            blue:   '#e0f2fe',
            green:  '#dcfce7',
            orange: '#fed7aa',
          };

          const bg = markerBgMap[color] || '#fce7f3';
          // 下側だけ色が付くように linear-gradient でアンダーマーカーを表現
          const span = document.createElement('span');
          span.style.backgroundImage = `linear-gradient(transparent 60%, ${bg} 60%)`;

          // ★ 選択範囲の中身（ネストした太字・リンク等）を保持したままspanで包む（OPS-15）
          const frag = range.extractContents();
          span.appendChild(frag);
          range.insertNode(span);
        }
      }

      function applyFontSize(size) {
        // styleWithCSS: true にすることで <span style="font-size:..."> を生成させる
        // Chrome等のブラウザでは 1=x-small, 2=small, 3=medium, 4=large, 5=x-large, 6=xx-large, 7=xxx-large となる
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('fontSize', false, size);
        document.execCommand('styleWithCSS', false, false);
      }

      function applyColorToHTML(html, color, role) {
        if (!color) return html;
        
        // 薄い色を生成（ストライプ・ドット用）
        const lightColor = color + '40'; // HEX + 25% alpha
        
        // 保護する色（白・グレー系）
        const protectedColors = ['#fff', '#ffffff', '#ccc', '#cccccc', '#ddd', '#dddddd', '#eee', '#eeeeee', '#cecece'];
        const isProtected = (c) => protectedColors.includes(c.toLowerCase());
        
        // 枠線と背景色の両方があるパターンを検出（背景色を薄くする）
        // ただし、枠線が白（ステッチ風など）の場合は除外
        const hasBorderWithColor = /border:\s*\d+px\s+(double|solid|dashed)\s+#(?!fff|ffffff)[0-9a-fA-F]{3,6}/.test(html);
        const hasBorderAndBackground = hasBorderWithColor && /background\s*:/.test(html);
        
        let updatedHTML = html;
        
        // 1. border系 (ショートハンド含む) -> mainColor
        updatedHTML = updatedHTML.replace(/(border(?:-(?:top|right|bottom|left))?\s*:\s*[^;]*?\s*)(#[0-9a-fA-F]{3,6}|rgba?\([^)]+\))/gi, (match, prefix, oldColor) => {
          if (isProtected(oldColor)) return match;
          return match.replace(oldColor, color);
        });

        // 2. background (単色のみ、gradient内は除外)
        // 複数backgroundがある場合: タイトル/バッジ部分はメインカラー、BOX部分は薄い色
        // 判定: span/div内のbackgroundはタイトル、外側divのbackgroundはBOX
        const bgMatches = html.match(/background\s*:\s*#[0-9a-fA-F]{3,8}\s*;/gi) || [];
        const hasMultipleBg = bgMatches.length > 1;
        
        // BOX背景かタイトル背景かを判定するためにHTML構造を解析
        // position: absoluteを持つ要素内のbackgroundはタイトル
        const hasTitleInAbsolute = /position:\s*absolute[^>]*background\s*:\s*#[0-9a-fA-F]{3,8}/.test(html);
        
        let bgCount = 0;
        updatedHTML = updatedHTML.replace(/(background\s*:\s*)(#[0-9a-fA-F]{3,8})(\s*;)/gi, (match, prefix, oldColor, suffix) => {
          if (isProtected(oldColor)) return match;
          bgCount++;
          
          if (hasMultipleBg) {
            // absoluteでタイトルがある場合: 最初がBOX、後がタイトル
            if (hasTitleInAbsolute) {
              if (bgCount === 1) {
                return prefix + lightColor + suffix; // BOX背景は薄い色
              }
              return prefix + color + suffix; // タイトルはメインカラー
            }
            // それ以外（スマート等）: 最初がタイトル、後がBOX
            if (bgCount === bgMatches.length) {
              return prefix + lightColor + suffix;
            }
            return prefix + color + suffix;
          }
          
          if (hasBorderAndBackground) {
            return prefix + lightColor + suffix;
          }
          return prefix + color + suffix;
        });

        // 3. linear-gradient内の色 -> 白・グレー以外をlightColorに
        updatedHTML = updatedHTML.replace(/linear-gradient\([^)]+\)/gi, (match) => {
          return match.replace(/#[0-9a-fA-F]{3,6}/g, (hexColor) => {
            if (isProtected(hexColor)) return hexColor;
            return lightColor;
          });
        });

        // 4. color (文字色) -> mainColor
        updatedHTML = updatedHTML.replace(/((?:^|;|\s)color\s*:\s*)(#[0-9a-fA-F]{3,6}|rgba?\([^)]+\))/gi, (match, prefix, oldColor) => {
          if (isProtected(oldColor)) return match;
          return match.replace(oldColor, color);
        });
        
        // 5. box-shadow -> 白・グレー以外をメインカラーに
        updatedHTML = updatedHTML.replace(/(box-shadow\s*:\s*)([^;]+)/gi, (match, prefix, values) => {
          return prefix + values.replace(/#[0-9a-fA-F]{3,6}/g, (hexColor) => {
            if (isProtected(hexColor)) return hexColor;
            return color;
          });
        });

        // 6. border-color (吹き出し口) -> メインカラー
        updatedHTML = updatedHTML.replace(/(border-color\s*:\s*)([^;]+)(;?)/gi, (match, prefix, values, suffix) => {
          const newValues = values.replace(/#[0-9a-fA-F]{3,8}/g, (m) => {
            if (isProtected(m)) return m;
            return color;
          });
          return prefix + newValues + suffix;
        });

        // 7. border-right, border-left等の個別指定 (吹き出しの三角部分)
        updatedHTML = updatedHTML.replace(/(border-(?:right|left|top|bottom)\s*:\s*)(\d+px\s+solid\s+)(#[0-9a-fA-F]{3,8})/gi, (match, prefix, style, oldColor) => {
          if (isProtected(oldColor)) return match;
          return prefix + style + color;
        });

        // 8. ボタン用: background-color -> メインカラー
        updatedHTML = updatedHTML.replace(/(background-color\s*:\s*)(#[0-9a-fA-F]{3,8})/gi, (match, prefix, oldColor) => {
          if (isProtected(oldColor)) return match;
          return prefix + color;
        });

        // 9. ボタン用: onmouseover/onmouseout内の色を変更
        // 「背景色が反転するボタン」かどうかを検出（backgroundColor と color の両方を変更している場合）
        const isReverseButton = /onmouseover="[^"]*backgroundColor[^"]*color[^"]*"/.test(html) || 
                                /onmouseover="[^"]*this\.style\.color[^"]*"/.test(html);
        
        if (isReverseButton) {
          // 反転ボタン: ホバー時は背景が暗く、文字がメインカラーに
          updatedHTML = updatedHTML.replace(/onmouseover="([^"]*)"/gi, (match, content) => {
            // backgroundColor を #000000 または暗い色に
            let newContent = content.replace(/backgroundColor\s*=\s*'[^']*'/g, `backgroundColor='#222222'`);
            // color をメインカラーに
            newContent = newContent.replace(/this\.style\.color\s*=\s*'[^']*'/g, `this.style.color='${color}'`);
            return `onmouseover="${newContent}"`;
          });
          updatedHTML = updatedHTML.replace(/onmouseout="([^"]*)"/gi, (match, content) => {
            // backgroundColor をメインカラーに戻す
            let newContent = content.replace(/backgroundColor\s*=\s*'[^']*'/g, `backgroundColor='${color}'`);
            // color を黒に戻す
            newContent = newContent.replace(/this\.style\.color\s*=\s*'[^']*'/g, `this.style.color='#000000'`);
            return `onmouseout="${newContent}"`;
          });
          // 初期の文字色も黒に
          updatedHTML = updatedHTML.replace(/((?:^|;|\s)color\s*:\s*)(#[0-9a-fA-F]{3,6})/gi, (match, prefix, oldColor) => {
            return prefix + '#000000';
          });
        } else {
          // 通常ボタン: ホバー時の色を少し暗くする
          const darkerColor = adjustColorBrightness(color, -40);
          
          // 立体ボタン（boxShadowを含む）かどうかを検出
          const is3DButton = /box-shadow:\s*0\s+\d+px\s+0\s+#/.test(html);
          
          if (is3DButton) {
            // 立体ボタン: boxShadowの色も暗い色に変更
            updatedHTML = updatedHTML.replace(/onmouseover="([^"]*)"/gi, (match, content) => {
              let newContent = content.replace(/boxShadow\s*=\s*'([^']*)'/g, (m, shadowVal) => {
                return `boxShadow='${shadowVal.replace(/#[0-9a-fA-F]{6}/g, darkerColor)}'`;
              });
              return `onmouseover="${newContent}"`;
            });
            updatedHTML = updatedHTML.replace(/onmouseout="([^"]*)"/gi, (match, content) => {
              let newContent = content.replace(/boxShadow\s*=\s*'([^']*)'/g, (m, shadowVal) => {
                return `boxShadow='${shadowVal.replace(/#[0-9a-fA-F]{6}/g, darkerColor)}'`;
              });
              return `onmouseout="${newContent}"`;
            });
            updatedHTML = updatedHTML.replace(/onmousedown="([^"]*)"/gi, (match, content) => {
              let newContent = content.replace(/boxShadow\s*=\s*'([^']*)'/g, (m, shadowVal) => {
                return `boxShadow='${shadowVal.replace(/#[0-9a-fA-F]{6}/g, darkerColor)}'`;
              });
              return `onmousedown="${newContent}"`;
            });
            // 初期のbox-shadowも変更
            updatedHTML = updatedHTML.replace(/(box-shadow:\s*0\s+\d+px\s+0\s+)(#[0-9a-fA-F]{6})/gi, `$1${darkerColor}`);
          } else {
            // 通常ボタン
            updatedHTML = updatedHTML.replace(/onmouseover="([^"]*)"/gi, (match, content) => {
              const newContent = content.replace(/#[0-9a-fA-F]{3,6}/g, (hexColor) => {
                if (isProtected(hexColor)) return hexColor;
                return darkerColor;
              });
              return `onmouseover="${newContent}"`;
            });
            updatedHTML = updatedHTML.replace(/onmouseout="([^"]*)"/gi, (match, content) => {
              const newContent = content.replace(/#[0-9a-fA-F]{3,6}/g, (hexColor) => {
                if (isProtected(hexColor)) return hexColor;
                return color;
              });
              return `onmouseout="${newContent}"`;
            });
          }
        }

        return updatedHTML;
      }

      // 色の明度を調整するヘルパー関数
      function adjustColorBrightness(hex, percent) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        }
        const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + percent));
        const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + percent));
        const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + percent));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }

      // グラデーションをHTMLに適用する関数
      function applyGradientToHTML(html, gradient) {
        // background: linear-gradient(...) を置換
        let updatedHTML = html.replace(/background\s*:\s*linear-gradient\([^)]+\)/gi, `background: ${gradient}`);
        // background-color も念のため置換（グラデーションに）
        updatedHTML = updatedHTML.replace(/background-color\s*:\s*#[0-9a-fA-F]{3,8}/gi, `background: ${gradient}`);
        return updatedHTML;
      }

      // リスト配置選択ダイアログを表示
      function showListAlignmentDialog() {
        return new Promise((resolve) => {
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; justify-content: center; align-items: center;';

          const dialog = document.createElement('div');
          dialog.style.cssText = 'background: white; padding: 20px 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center;';

          const title = document.createElement('p');
          title.textContent = '配置を選択してください';
          title.style.cssText = 'margin: 0 0 15px 0; font-weight: bold; font-size: 14px; color: #333;';

          const btnContainer = document.createElement('div');
          btnContainer.style.cssText = 'display: flex; gap: 10px; justify-content: center;';

          const alignments = [
            { value: 'left', label: '左寄せ', icon: '◀' },
            { value: 'center', label: '中央', icon: '●' },
            { value: 'right', label: '右寄せ', icon: '▶' }
          ];

          // v0.11.0 P1 C4d (OPS-12 / UX-16): キャンセル可能にする。
          // Escape・オーバーレイクリック・キャンセルボタンはすべて null を返し、
          // 呼び出し元で「何も挿入・変更しない」ことを判定できるようにする。
          let settled = false;
          function cleanup(result) {
            if (settled) return;
            settled = true;
            document.removeEventListener('keydown', onKeydown, true);
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            resolve(result);
          }
          function onKeydown(e) {
            if (e.key === 'Escape') {
              e.preventDefault();
              e.stopPropagation();
              cleanup(null);
            }
          }

          alignments.forEach(align => {
            const btn = document.createElement('button');
            btn.innerHTML = `${align.icon}<br><span style="font-size: 12px;">${align.label}</span>`;
            btn.style.cssText = 'padding: 12px 20px; border: 2px solid #3498db; background: white; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; min-width: 80px;';
            btn.onmouseover = () => { btn.style.background = '#3498db'; btn.style.color = 'white'; };
            btn.onmouseout = () => { btn.style.background = 'white'; btn.style.color = '#333'; };
            btn.onclick = () => {
              cleanup(align.value);
            };
            btnContainer.appendChild(btn);
          });

          // キャンセルボタン
          const cancelBtn = document.createElement('button');
          cancelBtn.textContent = 'キャンセル';
          cancelBtn.style.cssText = 'display: block; width: 100%; margin-top: 14px; padding: 8px 20px; border: 1px solid #ccc; background: #f9fafb; color: #555; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;';
          cancelBtn.onmouseover = () => { cancelBtn.style.background = '#e5e7eb'; };
          cancelBtn.onmouseout = () => { cancelBtn.style.background = '#f9fafb'; };
          cancelBtn.onclick = () => {
            cleanup(null);
          };

          dialog.appendChild(title);
          dialog.appendChild(btnContainer);
          dialog.appendChild(cancelBtn);
          overlay.appendChild(dialog);
          document.body.appendChild(overlay);
          document.addEventListener('keydown', onKeydown, true);

          // オーバーレイクリックでキャンセル（null＝何もしない）
          overlay.onclick = (e) => {
            if (e.target === overlay) {
              cleanup(null);
            }
          };
        });
      }

      // プリセットモードで要素を挿入する関数（新HTMLテンプレート形式対応）
      async function insertPresetElement(editor, elementType) {
        const theme = getTheme(currentTheme);
        if (!theme || !theme.html || !theme.html[elementType]) return;

        // エディタにフォーカス
        editor.focus();

        // 選択範囲を復元または作成
        const sel = window.getSelection();
        // globalSavedRangeがエディタ内の有効な範囲かチェックして復元
        let rangeRestored = restoreSavedRange(editor);

        // 復元できなかった場合、末尾にカーソルを置く
        if (!rangeRestored) {
          const range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }

        // 選択中のテキストを取得
        let selectedText = '';
        if (sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) {
          selectedText = sel.toString();
        }

        let html = theme.html[elementType];

        // ボタンの場合はURL入力ダイアログを表示
        if (elementType === 'button') {
          const url = prompt('リンク先URLを入力してください:', 'https://');
          if (url === null) return; // キャンセル
          // v0.11.0 D-2 Part1-7 (UX-15): 未入力やhttps://だけの状態でリンクを作らせない
          const trimmedUrl = url.trim();
          if (!trimmedUrl || trimmedUrl === 'https://' || trimmedUrl === 'http://') {
            showToast('URLを入力してください', 'info');
            return;
          }
          html = html.replace('{{url}}', trimmedUrl);
          html = html.replace('{{text}}', appendCtaArrowIfNeeded(selectedText || 'ボタン'));
        } else if (elementType === 'consult') {
          // 申込枠：見出し・本文・URLを入力（URLは必須）
          const title = prompt('見出しを入力してください:', 'まずは、無料体験授業へ。');
          if (title === null) return;
          const bodyText = prompt('本文を入力してください:', 'お子さまに合う勉強の進め方を、一緒に見つけていきませんか。');
          if (bodyText === null) return;
          const url = prompt('リンク先URLを入力してください:', 'https://');
          if (url === null) return;
          const trimmedUrl = url.trim();
          if (!trimmedUrl || trimmedUrl === 'https://' || trimmedUrl === 'http://') {
            showToast('URLを入力してください', 'info');
            return;
          }
          html = html.replace('{{title}}', title.trim() || 'まずは、無料体験授業へ。');
          html = html.replace('{{text}}', (bodyText.trim() || 'お子さまに合う勉強の進め方を、一緒に見つけていきませんか。').replace(/\r?\n/g, '<br>'));
          html = html.replace('{{url}}', trimmedUrl);
          html = html.replace('{{text}}', appendCtaArrowIfNeeded('無料体験を申し込む'));
        } else if (elementType === 'heading' || elementType === 'hero') {
          // 見出し／ヒーロー見出しは横幅いっぱい、配置選択なし
          html = html.replace('{{text}}', selectedText || '見出しテキスト');
        } else if (elementType === 'subheading') {
          // サブ見出しは横幅いっぱい、配置選択なし（v0.13.0: インラインテンプレートを直接使用）
          html = html.replace('{{text}}', selectedText || 'サブ見出しテキスト');
        } else if (elementType === 'bubbleLeft' || elementType === 'bubbleRight') {
          // 吹き出しは左右でデフォルトの名前・イニシャルが違う（左=先生/室長側、右=生徒/保護者側）
          const text = selectedText ? selectedText.replace(/\r?\n/g, '<br>') : '吹き出しテキスト';
          const defaults = elementType === 'bubbleLeft' ? { initial: '先', name: '先生' } : { initial: '生', name: '生徒' };
          html = html.replace('{{initial}}', defaults.initial).replace('{{name}}', defaults.name).replace('{{text}}', text);
        } else if (elementType === 'list') {
          // リストは横幅いっぱい、配置選択なし
          // 選択テキストを改行で分割してすべてリストアイテムに（v0.13.0: 行はdiv、01,02,…で連番）
          let title = 'タイトル';
          let items = ['ポイント1', 'ポイント2', 'ポイント3'];

          if (selectedText) {
            const lines = selectedText.split(/\r?\n/).filter(line => line.trim());
            if (lines.length > 0) {
              items = lines.map(line => line.trim());
            }
          }

          const rowsHtml = buildThemeListRowsHtml(theme.tokens, items);
          html = html.replace('{{title}}', title);
          html = html.replace('{{items}}', rowsHtml);
          html = html.replace('{{label}}', 'Practice');
        } else if (elementType === 'empathy') {
          const text = selectedText ? selectedText.replace(/\r?\n/g, '<br>') : '「数学は無理」と言われると、親としては胸が痛みますよね。';
          html = html.replace('{{title}}', '保護者の方へ').replace('{{text}}', text);
        } else if (elementType === 'note') {
          const text = selectedText ? selectedText.replace(/\r?\n/g, '<br>') : 'ここに室長からのコメントを入力します。';
          html = html.replace('{{title}}', '室長より').replace('{{text}}', text);
        } else if (elementType === 'highlight') {
          const text = selectedText ? selectedText.replace(/\r?\n/g, '<br>') : 'ここに強調したい一文を入力します。';
          html = html.replace('{{text}}', text);
        } else if (elementType === 'toc' || elementType === 'summary') {
          // v0.13.0: 生成語彙対応 — 目次／まとめ。選択テキストを改行で分割して行にする（listと同じ流儀）
          let items = elementType === 'toc' ? ['今日10分でできる、範囲の見える化', '1日1教科、間違えた問題だけ', '前日は見直しだけ'] : ['まとめ1', 'まとめ2', 'まとめ3'];
          if (selectedText) {
            const lines = selectedText.split(/\r?\n/).filter(line => line.trim());
            if (lines.length > 0) items = lines.map(line => line.trim());
          }
          const rowsHtml = elementType === 'toc'
            ? buildThemeTocRowsHtml(theme.tokens, items)
            : buildThemeSummaryRowsHtml(theme.tokens, items);
          html = html.replace('{{title}}', elementType === 'toc' ? '目次' : 'まとめ');
          html = html.replace('{{items}}', rowsHtml);
        } else if (elementType === 'related') {
          // v0.13.0: 生成語彙対応 — 関連記事。1〜3件のタイトル＋URLを逐次入力する
          const countStr = prompt('関連記事の件数を入力してください（1〜3）:', '2');
          if (countStr === null) return;
          let count = parseInt(countStr, 10);
          if (!Number.isFinite(count) || count < 1) count = 1;
          if (count > 3) count = 3;
          const rows = [];
          for (let i = 0; i < count; i++) {
            const rowTitle = prompt(`${i + 1}件目のタイトルを入力してください:`, '');
            if (rowTitle === null) return;
            const rowUrl = prompt(`${i + 1}件目のリンク先URLを入力してください:`, 'https://');
            if (rowUrl === null) return;
            const trimmedRowUrl = rowUrl.trim();
            if (!trimmedRowUrl || trimmedRowUrl === 'https://' || trimmedRowUrl === 'http://') {
              showToast('URLを入力してください', 'info');
              return;
            }
            rows.push({ title: rowTitle.trim() || `関連記事${i + 1}`, url: trimmedRowUrl });
          }
          html = html.replace('{{title}}', 'あわせて読みたい');
          html = html.replace('{{items}}', buildThemeRelatedRowsHtml(theme.tokens, rows));
        } else if (elementType === 'cta') {
          // v0.13.0: 生成語彙対応 — 中間CTA（toolbarからの挿入は常にmid種別）
          const text = prompt('文言を入力してください:', '範囲表を持って、対策会で一緒に計画を立てませんか？');
          if (text === null) return;
          const btnText = prompt('ボタン文言を入力してください:', '申し込む');
          if (btnText === null) return;
          const url = prompt('リンク先URLを入力してください:', 'https://');
          if (url === null) return;
          const trimmedUrl = url.trim();
          if (!trimmedUrl || trimmedUrl === 'https://' || trimmedUrl === 'http://') {
            showToast('URLを入力してください', 'info');
            return;
          }
          const buttonHtml = buildCtaMainButtonHtml(theme.tokens, trimmedUrl, (btnText.trim() || '申し込む'));
          html = buildCtaHtml(theme, 'mid', (text.trim() || '範囲表を持って、対策会で一緒に計画を立てませんか？').replace(/\r?\n/g, '<br>'), buttonHtml);
        } else {
          // 枠は横幅いっぱい、配置選択なし
          // 改行を<br>に変換
          const text = selectedText ? selectedText.replace(/\r?\n/g, '<br>') : 'ここにテキストを入力';
          html = html.replace('{{text}}', text);
        }

        // HTMLをDOM要素に変換
        const wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        const newNode = wrapper.firstChild;

        // ブロック系は段落を分割して挿入
        insertBlockAtCursor(editor, newNode);
        // 末尾に空行を入れる（ブロックの直後に既に段落等が続く場合は入れない。
        // 入れてしまうとエディタ直下に孤立した<br>が残り、コピー時に余分な空行になる）
        if (!newNode.nextSibling) {
          insertNodeAtCursor(document.createElement('br'));
        }

        // v0.13.0: 見出し／リスト（＋目次）を挿入したら連番を振り直す
        if (elementType === 'heading' && typeof renumberHeadings === 'function') {
          renumberHeadings(editor);
        } else if ((elementType === 'list' || elementType === 'toc') && typeof renumberListRows === 'function' && newNode && newNode.nodeType === 1) {
          renumberListRows(newNode);
        }
        // v0.13.0: プリセットパーツ挿入（見出し/サブ見出し/枠/吹き出し/ボタン/リスト/
        // ポイント・室長より・申込枠・マーカー行・ヒーロー見出し・目次/まとめ/関連記事/中間CTA）を1手として確定
        EditorHistory.commit();
      }

      // 配置をHTMLに適用するヘルパー関数
      function applyAlignmentToHtml(html, alignment) {
        // margin: 1em auto; の部分を配置に応じて変更
        switch (alignment) {
          case 'left':
            return html.replace(/margin:\s*[^;]*auto[^;]*;/g, (match) => {
              return match.replace('auto', 'auto').replace(/auto\s*;/, '0;').replace(/;\s*$/, ' 0;').replace('1em auto 0;', '1em auto 1em 0;');
            }).replace(/margin:\s*1em\s+auto;/g, 'margin: 1em auto 1em 0;');
          case 'right':
            return html.replace(/margin:\s*[^;]*auto[^;]*;/g, (match) => {
              return match.replace('1em auto', '1em 0 1em auto');
            }).replace(/margin:\s*1em\s+auto;/g, 'margin: 1em 0 1em auto;');
          case 'center':
          default:
            return html; // デフォルトは中央
        }
      }

      // moca テンプレを用途に応じてスタイル調整して挿入
      function createMocaBlock(no, role, content, color, isGradient = false, url = '', alignment = 'center') {
        const tmpl = MOCA_TEMPLATES.find(t => t.no === no);
        if (!tmpl) return document.createElement('div');
        const wrapper = document.createElement('div');

        let html = tmpl.html;
        
        // ボタンの場合：URLを適用し、エディタ上ではonclickを無効化
        if (role === 'button') {
          // URLを適用
          html = html.replace(/location\.href='URL'/g, `location.href='${url || '#'}'`);
          // エディタ上ではonclickを無効化（data-hrefに保存）
          html = html.replace(/onclick="([^"]*)"/g, 'data-onclick="$1" onclick="event.preventDefault();"');
        }
        
        // 色の適用（グラデーションの場合は専用関数を使用）
        if (isGradient && color.startsWith('linear-gradient')) {
          html = applyGradientToHTML(html, color);
        } else {
          html = applyColorToHTML(html, color, role);
        };
        
        // リスト以外の場合のテキスト置換
        if (role !== 'list') {
          let replacement = content;
          if (!replacement) {
            // デフォルト文言
            if (role === 'heading') replacement = 'サンプル';
            else if (role === 'box') replacement = 'ここに本文を入れます。メッセージを入力します。';
            else if (role === 'bubble') replacement = '吹き出しです';
            else replacement = 'ここに本文を入れます♪';
          }
          // 改行を<br>タグに変換して枠内で改行されるようにする
          replacement = replacement.replace(/\r?\n/g, '<br>');
          html = html.replace(/ここに本文を入れます♪/g, replacement);
        }

        wrapper.innerHTML = html;
        
        // リストの場合は、DOM構築後に中身を差し替える
        if (role === 'list') {
          // デフォルトではポイント4を削除して3つにする（テンプレートそのままの場合）
          // 選択テキストがある場合は、それを使ってリストを再生成する
          const listRoot = wrapper.querySelector('ul, ol');
          if (listRoot) {
            // リスト自体にスタイルを設定
            listRoot.style.marginLeft = '20px';
            listRoot.style.paddingLeft = '20px';
            
            // 元のテンプレートの最初のli要素からスタイルを取得
            const originalLi = listRoot.querySelector('li');
            let originalStyle = '';
            if (originalLi) {
              originalStyle = originalLi.getAttribute('style') || '';
            }
            
            if (content) {
              // 選択テキストがある場合: 改行で分割して li を生成
              listRoot.innerHTML = ''; // 一旦クリア
              const lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
              lines.forEach(line => {
                const li = document.createElement('li');
                li.textContent = line;
                // 基本的なリストスタイルを設定
                li.style.marginBottom = '4px';
                li.style.lineHeight = '1.5';
                // 元のliにスタイルがあれば引き継ぐ
                if (originalStyle) {
                  li.setAttribute('style', originalStyle + '; ' + li.getAttribute('style'));
                }
                listRoot.appendChild(li);
              });
            } else {
              // 選択テキストがない場合: デフォルトのまま（ただしポイント4は消す）
              // テンプレート内のHTML文字列操作ですでに消せればよいが、DOM操作でやる
              const lis = listRoot.querySelectorAll('li');
              lis.forEach(li => {
                // 基本的なリストスタイルを設定
                if (!li.style.marginBottom) {
                  li.style.marginBottom = '4px';
                }
                if (!li.style.lineHeight) {
                  li.style.lineHeight = '1.5';
                }
                if (li.textContent.includes('ポイント4')) {
                  li.remove();
                }
              });
            }
          }
        }

        const block = wrapper.firstChild;

        // 見出し用途ならフォントを大きめ＋太字＋上下マージン
        if (role === 'heading') {
          const targets = block.querySelectorAll('*');
          targets.forEach(el => {
            const current = el.style.fontSize || '100%';
            // デフォルト 100% を 125% に引き上げる
            el.style.fontSize = current === '100%' ? '125%' : current;
            el.style.fontWeight = 'bold';
          });

          // ブロック全体に上下の余白を少し足す
          if (!block.style.marginTop) block.style.marginTop = '24px';
          if (!block.style.marginBottom) block.style.marginBottom = '16px';
        }

        // 枠用途のときは、全体の文字を少しだけ小さくする
        if (role === 'box') {
          const targets = block.querySelectorAll('*');
          targets.forEach(el => {
            const current = el.style.fontSize || '100%';
            if (current === '100%') {
              el.style.fontSize = '95%';
            }
          });
        }
        
        // 配置を適用（吹き出しのみ）
        // 見出し・枠・リストは横幅いっぱい
        if ((role === 'bubble' || role === 'memo') && alignment) {
          // width: fit-content を設定（まだ設定されていない場合）
          if (!block.style.width) {
            block.style.width = 'fit-content';
          }

          // ★ 配置をmargin autoで効かせるためには block レベルが必須
          // MOCAテンプレートで `display: inline-block` のものは margin: auto が無視されて
          // 右配置を選んでも左にとどまる不具合があるため、ここで強制的に block へ変更する
          block.style.display = 'block';

          // margin を配置に応じて変更
          const currentMargin = block.style.margin || '';
          const marginMatch = currentMargin.match(/^(\d+(?:\.\d+)?(?:em|px)?)/);
          const topMargin = marginMatch ? marginMatch[1] : '1em';

          switch (alignment) {
            case 'left':
              block.style.margin = `${topMargin} auto ${topMargin} 0`;
              break;
            case 'right':
              block.style.margin = `${topMargin} 0 ${topMargin} auto`;
              break;
            case 'center':
            default:
              block.style.margin = `${topMargin} auto`;
              break;
          }
        }
        
        return block;
      }

      // 指定サイズのテーブルを作成
      function createTableWithSize(cols, rows, hasHeader, hasLeftHeader) {
        const table = createEl('table', { className: 'eisai-table' });
        let html = '';
        let dataRows = rows;
        
        if (hasHeader) {
          html += '<thead><tr>';
          for (let c = 0; c < cols; c++) {
            html += `<th>見出し${c + 1}</th>`;
          }
          html += '</tr></thead>';
          dataRows--; // ヘッダー分を引く
        }
        
        html += '<tbody>';
        for (let r = 0; r < dataRows; r++) {
          html += '<tr>';
          for (let c = 0; c < cols; c++) {
            if (hasLeftHeader && c === 0) {
              // 左列見出し
              html += `<th>項目${r + 1}</th>`;
            } else {
              html += '<td></td>';
            }
          }
          html += '</tr>';
        }
        html += '</tbody>';
        
        table.innerHTML = html;
        return table;
      }

      // v0.11.0 P1 D1-5: ドロップダウン/色ポップアップが画面外に出ないよう位置を補正する
      // position:fixed / position:absolute のどちらでも、getBoundingClientRect() の
      // ビューポート座標を基準に left/top を必要な分だけずらす（絶対配置でも差分適用で機能する）
      function clampPopupToViewport(el) {
        if (!el) return;
        const margin = 8;
        const rect = el.getBoundingClientRect();
        const w = el.offsetWidth || rect.width;
        const h = el.offsetHeight || rect.height;
        if (!w || !h) return;
        const clampedLeft = Math.max(margin, Math.min(rect.left, window.innerWidth - w - margin));
        const clampedTop = Math.max(margin, Math.min(rect.top, window.innerHeight - h - margin));
        const dx = clampedLeft - rect.left;
        const dy = clampedTop - rect.top;
        if (dx !== 0 || dy !== 0) {
          const cs = window.getComputedStyle(el);
          const curLeft = parseFloat(cs.left) || 0;
          const curTop = parseFloat(cs.top) || 0;
          el.style.left = (curLeft + dx) + 'px';
          el.style.top = (curTop + dy) + 'px';
        }
      }
      // 画面リサイズ時に開いているメニュー・ポップアップを再クランプ
      window.addEventListener('resize', () => {
        document.querySelectorAll('.eisai-dropdown-menu.show').forEach(clampPopupToViewport);
        document.querySelectorAll('.eisai-color-popup').forEach((p) => {
          if (p.style.display === 'block') clampPopupToViewport(p);
        });
      });

      function createColorPicker(toolbar, type) {
        const dropdown = createEl('div', { className: 'eisai-dropdown' }, toolbar);
        const btn = createEl('button', { className: 'eisai-dropdown-btn' }, dropdown);

        // 種類ごとにラベルとアイコンを切り替え
        let icon, labelText;
        if (type === 'text') {
          icon = ICONS.textColor;
          labelText = '文字色';
        } else if (type === 'bg') {
          icon = ICONS.bgColor;
          labelText = '背景色';
        } else { // marker
          icon = ICONS.textColor;
          labelText = 'マーカー';
        }
        // v0.12.0 E2-1: ツールバー行に収まるよう、ラベルは表示せずアイコンのみ＋title属性に
        btn.innerHTML = icon;
        btn.title = labelText;
        // カラーピッカー用メニューは専用クラスで幅をコンパクトに
        const menu = createEl('div', { className: 'eisai-dropdown-menu eisai-color-menu' }, dropdown);
        
        const picker = createEl('div', { className: 'eisai-color-picker' }, menu);
        COLORS[type].forEach(colorKey => {
          let swatchColor = colorKey;

          // マーカーの場合はキー名 → 実際の表示色に変換
          if (type === 'marker') {
            const markerColorMap = {
              yellow: '#facc15',
              pink:   '#fb7185',
              blue:   '#3b82f6',
              green:  '#22c55e',
              orange: '#f97316',
            };
            swatchColor = markerColorMap[colorKey] || '#facc15';
          }

          // createEl は props を style オブジェクトとして扱うので、background プロパティで色を渡す
          const colorBtn = createEl('button', { 
            className: 'eisai-color-btn',
            background: swatchColor
          }, picker);

          colorBtn.onmousedown = (e) => e.preventDefault();
          colorBtn.onclick = () => {
            restoreSavedRange(editor);
            editor.focus();

            if (type === 'text') {
              document.execCommand('foreColor', false, colorKey);
            } else if (type === 'bg') {
              document.execCommand('hiliteColor', false, colorKey);
            } else {
              // マーカーは下線ハイライト用の span.eisai-marker-* を挿入
              applyTextStyle('marker', colorKey);
            }
            EditorHistory.commit();
            menu.classList.remove('show');
          };
        });
        
        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          document.querySelectorAll('.eisai-dropdown-menu.show').forEach(m => {
            if (m !== menu) m.classList.remove('show');
          });
          menu.classList.toggle('show');
          if (menu.classList.contains('show')) clampPopupToViewport(menu);
        };

        document.addEventListener('click', (e) => {
          if (!dropdown.contains(e.target)) {
            menu.classList.remove('show');
          }
        });
        
        return dropdown;
      }

      // テーブルセルのダブルクリックメニュー
      function showTableCellMenu(table, row, cell, x, y) {
        // 既存のメニューを削除
        const existingMenu = document.querySelector('.eisai-table-menu');
        if (existingMenu) existingMenu.remove();
        
        const allRows = Array.from(table.querySelectorAll('tr'));
        const colIndex = Array.from(row.children).indexOf(cell);
        const totalRows = allRows.length;
        const totalCols = allRows[0] ? allRows[0].children.length : 0;
        
        const menu = document.createElement('div');
        menu.className = 'eisai-table-menu';
        menu.style.cssText = `
          position: fixed;
          left: ${x}px;
          top: ${y}px;
          background: #fff;
          border-radius: 8px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.2);
          padding: 6px 0;
          z-index: 10001;
          min-width: 140px;
        `;
        
        const menuItems = [
          { label: '▲ 上に行を追加', action: 'addRowAbove' },
          { label: '▼ 下に行を追加', action: 'addRowBelow' },
          { label: '◀ 左に列を追加', action: 'addColLeft' },
          { label: '▶ 右に列を追加', action: 'addColRight' },
          { label: '─', action: 'separator' },
          { label: '🗑 この行を削除', action: 'deleteRow', disabled: totalRows <= 1 },
          { label: '🗑 この列を削除', action: 'deleteCol', disabled: totalCols <= 1 },
          { label: '─', action: 'separator' },
          { label: '✕ テーブルを削除', action: 'deleteTable' }
        ];
        
        menuItems.forEach(item => {
          if (item.action === 'separator') {
            const sep = document.createElement('div');
            sep.style.cssText = 'height: 1px; background: #e5e7eb; margin: 4px 0;';
            menu.appendChild(sep);
            return;
          }
          
          const btn = document.createElement('button');
          btn.textContent = item.label;
          btn.style.cssText = `
            display: block;
            width: 100%;
            padding: 8px 14px;
            border: none;
            background: transparent;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            color: ${item.disabled ? '#aaa' : '#333'};
          `;
          btn.disabled = item.disabled;
          
          btn.onmouseenter = () => { if (!item.disabled) btn.style.background = '#f3f4f6'; };
          btn.onmouseleave = () => { btn.style.background = 'transparent'; };
          
          btn.onclick = () => {
            menu.remove();
            
            // 左列見出しがあるかチェック（tbody内の最初のセルがthかどうか）
            const hasLeftHeader = table.querySelector('tbody tr th:first-child') !== null;
            
            switch (item.action) {
              case 'addRowAbove':
                const newRowAbove = document.createElement('tr');
                for (let i = 0; i < totalCols; i++) {
                  // 最初の列で左列見出しがある場合はthを使用
                  const cellTag = (i === 0 && hasLeftHeader) ? 'th' : 'td';
                  newRowAbove.appendChild(document.createElement(cellTag));
                }
                row.parentNode.insertBefore(newRowAbove, row);
                break;
              case 'addRowBelow':
                const newRowBelow = document.createElement('tr');
                for (let i = 0; i < totalCols; i++) {
                  // 最初の列で左列見出しがある場合はthを使用
                  const cellTag = (i === 0 && hasLeftHeader) ? 'th' : 'td';
                  newRowBelow.appendChild(document.createElement(cellTag));
                }
                row.parentNode.insertBefore(newRowBelow, row.nextSibling);
                break;
              case 'addColLeft':
                allRows.forEach((r, idx) => {
                  const newCell = document.createElement(idx === 0 && r.parentNode.tagName === 'THEAD' ? 'th' : 'td');
                  r.insertBefore(newCell, r.children[colIndex]);
                });
                break;
              case 'addColRight':
                allRows.forEach((r, idx) => {
                  const newCell = document.createElement(idx === 0 && r.parentNode.tagName === 'THEAD' ? 'th' : 'td');
                  if (r.children[colIndex + 1]) {
                    r.insertBefore(newCell, r.children[colIndex + 1]);
                  } else {
                    r.appendChild(newCell);
                  }
                });
                break;
              case 'deleteRow':
                if (totalRows > 1) row.remove();
                break;
              case 'deleteCol':
                if (totalCols > 1) {
                  allRows.forEach(r => {
                    if (r.children[colIndex]) r.children[colIndex].remove();
                  });
                }
                break;
              case 'deleteTable':
                const plainDiv = document.createElement('div');
                plainDiv.textContent = table.textContent || '';
                table.parentNode.insertBefore(plainDiv, table);
                table.remove();
                break;
            }
          };
          
          menu.appendChild(btn);
        });
        
        document.body.appendChild(menu);
        
        // メニュー外クリックで閉じる
        const closeMenu = (e) => {
          if (!menu.contains(e.target)) {
            menu.remove();
            document.removeEventListener('click', closeMenu);
          }
        };
        setTimeout(() => document.addEventListener('click', closeMenu), 0);
      }

      // 書式キャンセル:
      // - ブロック要素（見出し・吹き出し・枠・リストなど）: カーソルがあるだけでクリア可能
      // - テキスト装飾（色・サイズ・背景色・マーカー）: 選択して初めてクリア可能
      function clearFormatting(editor) {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;

        const range = sel.getRangeAt(0);

        // 装飾ブロックかどうか判定する関数
        function isDecoratedBlock(el) {
          if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
          const hasStyle = el.getAttribute && el.getAttribute('style');
          const className = el.className || '';
          const hasEisaiClass = className.includes('eisai-');
          const hasThemeClass = className.includes('theme-');
          const isList = el.tagName === 'UL' || el.tagName === 'OL';
          const isFieldset = el.tagName === 'FIELDSET';
          const isStyledDiv = el.tagName === 'DIV' && (hasStyle || hasEisaiClass || hasThemeClass);
          const isButton = el.tagName === 'BUTTON';
          const isTable = el.tagName === 'TABLE';
          const isBlockquote = el.tagName === 'BLOCKQUOTE';
          const isPre = el.tagName === 'PRE';
          return isStyledDiv || isList || isFieldset || isButton || isTable || isBlockquote || isPre;
        }

        // 1. まずカーソル位置の親要素に装飾ブロックがあるかチェック
        let node = range.commonAncestorContainer;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;

        let targetBlock = null;
        let current = node;
        while (current && current !== editor) {
          if (isDecoratedBlock(current)) {
            targetBlock = current;
            break; // カーソルに最も近い装飾ブロックを採用（外側まで辿らない）
          }
          current = current.parentNode;
        }

        // 2. 装飾ブロック内の場合はブロック全体をクリア（カーソルのみでもOK）
        // ※テーブルの行・列削除はダブルクリックメニューで行う
        if (targetBlock) {
          const textContent = targetBlock.textContent || '';
          const plainDiv = document.createElement('div');
          plainDiv.textContent = textContent;
          targetBlock.parentNode.insertBefore(plainDiv, targetBlock);
          targetBlock.parentNode.removeChild(targetBlock);
          
          // カーソルを新しい要素に移動
          const newRange = document.createRange();
          newRange.selectNodeContents(plainDiv);
          newRange.collapse(false);
          sel.removeAllRanges();
          sel.addRange(newRange);
          return;
        }

        // 3. 選択範囲内の装飾ブロックを収集（複数選択時）
        if (!range.collapsed) {
          const blocksToRemove = [];
          const children = Array.from(editor.children);
          children.forEach(child => {
            if (range.intersectsNode(child) && isDecoratedBlock(child)) {
              blocksToRemove.push(child);
            }
          });

          // 装飾ブロックがある場合は一括処理
          if (blocksToRemove.length > 0) {
            blocksToRemove.forEach(block => {
              const textContent = block.textContent || '';
              const plainDiv = document.createElement('div');
              plainDiv.textContent = textContent;
              block.parentNode.insertBefore(plainDiv, block);
              block.parentNode.removeChild(block);
            });
            return;
          }
        }

        // 4. テキスト装飾のクリア（選択時のみ）
        // カーソルのみの場合は何もしない
        if (range.collapsed) return;

        // 5. 選択範囲内のspan等のインライン装飾を解除
        const selectedText = range.toString();
        if (!selectedText) return;

        // 選択範囲内の装飾spanを探して解除
        const container = range.commonAncestorContainer;
        const startContainer = range.startContainer;
        const endContainer = range.endContainer;
        
        // 選択範囲を含む親要素から装飾spanを探す
        let parentEl = container;
        if (parentEl.nodeType === Node.TEXT_NODE) parentEl = parentEl.parentNode;
        
        // 装飾されたspanを収集
        const decoratedSpans = [];
        const walkNode = (el) => {
          if (el.nodeType === Node.ELEMENT_NODE) {
            const style = el.getAttribute('style') || '';
            const className = el.className || '';
            const hasInlineStyle = el.tagName === 'SPAN' && style;
            const hasMarkerStyle = style.includes('background-image') || style.includes('backgroundImage') || style.includes('linear-gradient');
            const hasMarkerClass = className.includes('eisai-marker');
            const hasFontTag = el.tagName === 'FONT';
            const hasBold = el.tagName === 'B' || el.tagName === 'STRONG';
            const hasItalic = el.tagName === 'I' || el.tagName === 'EM';
            const hasUnderline = el.tagName === 'U';
            const hasStrike = el.tagName === 'S' || el.tagName === 'STRIKE';
            
            if (hasInlineStyle || hasMarkerStyle || hasMarkerClass || hasFontTag || hasBold || hasItalic || hasUnderline || hasStrike) {
              if (range.intersectsNode(el)) {
                decoratedSpans.push(el);
              }
            }
          }
          el.childNodes.forEach(child => walkNode(child));
        };
        
        // エディタ全体を走査
        walkNode(editor);
        
        // 装飾spanがある場合は解除
        if (decoratedSpans.length > 0) {
          decoratedSpans.forEach(span => {
            const text = span.textContent;
            const textNode = document.createTextNode(text);
            span.parentNode.insertBefore(textNode, span);
            span.parentNode.removeChild(span);
          });
          return;
        }

        // 6. ブラウザ標準の書式解除（フォールバック）
        document.execCommand('removeFormat', false, null);
      }

      renderThemeSwatches(currentTheme);

      // v0.13.0 P3: 「テーマを変更」ボタン（貼り直さずエディタ内の記事を選択中テーマへ塗り替える）

        // v0.13.0: 塗り替え直後の状態をEditorHistoryへ1手として確定する。

        EditorHistory.commit();
        // 「元に戻す」を押した時点でエディタがこの塗り替え直後の状態と一致している場合のみ復元する。
        // その間に本文が編集されていたら、その編集を黒板消しのように消してしまわないよう中止する。
        const postRethemeHtml = EditorHistory.current.html;
        showActionToast(

      // テーマ説明（1行・省略表示）
      const themeDescription = createEl('div', { className: 'theme-description' }, presetContainer);

      // カスタムモード切り替え（右端。marginLeft:autoで右寄せ）

      let isCustomMode = false;

      // v0.13.0: カスタムモード時のセット切替「ニュー（47）｜クラシック（MOCA）」。

      updateCustomSetButtons();

      // ========================================

      const presetButtons = createEl('div', { className: 'preset-buttons' }, fixedHeader);

      const presetBtnData = [
