    // ========================================
    // v0.13.0 P1: applyThemeToGeminiHtml / walkNode 用ヘルパー
    // 「元テキスト・URL・href は変えず、色とマークアップだけをテーマ通りに作り直す」
    // という原則を守るため、DOM操作はすべてここに集約する。
    // ========================================

    // 先頭の <strong>NAME：</strong>（全角/半角コロン）を名前として取り出し、
    // 残りをテキストとして返す。見つからなければデフォルトを使う。
    function extractLeadingStrongName(clone, defaultName) {
      let name = defaultName;
      const first = clone.firstChild;
      if (first && first.nodeType === 1 && first.tagName === 'STRONG') {
        const raw = (first.textContent || '').trim();
        const m = raw.match(/^(.+?)[：:]/);
        if (m && m[1] && m[1].trim()) {
          name = m[1].trim();
          first.remove();
        }
      }
      return name;
    }

    // bubbleLeft/bubbleRight: 装飾用の空span（旧テーマの吹き出し尾）を除去し、
    // 先頭の「NAME：」表記があれば名前とイニシャルを抽出してテンプレートへ差し込む
    function buildBubbleHtml(theme, el, tpl, defaultInitial, defaultName) {
      const clone = el.cloneNode(true);
      Array.from(clone.children).forEach((child) => {
        if (child.tagName === 'SPAN' && !child.textContent.trim() && !child.children.length) {
          child.remove();
        }
      });
      const name = extractLeadingStrongName(clone, defaultName);
      const initial = (name && name.charAt(0)) || defaultInitial;
      const text = clone.innerHTML.trim();
      return tpl.replace('{{initial}}', initial).replace('{{name}}', name).replace('{{text}}', text);
    }

    // eisai-empathy-box / eisai-manager-note 用：先頭の <strong>タイトル</strong> を
    // タイトルとして取り出し、残りをテキストとしてテンプレートへ差し込む
    function buildStrongTitledPartHtml(theme, el, key, defaultTitle) {
      const clone = el.cloneNode(true);
      let title = defaultTitle;
      const strong = clone.querySelector(':scope > strong');
      if (strong && strong.textContent.trim()) {
        title = strong.textContent.trim().replace(/[：:]\s*$/, '');
        strong.remove();
      }
      // v0.13.0: 生成語彙対応 — eisai-empathy-box が <p> の代わりに <ul>/<ol> を持つケース。
      // リストへ直接インラインスタイルを当てて、テーマの本文と揃った見た目にする。
      const listEl = clone.querySelector(':scope > ul, :scope > ol');
      if (listEl) {
        listEl.setAttribute('style', `padding-left:1.2em;margin:0;font-family:${SERIF_STACK_V3};font-size:16px;line-height:1.9;color:${theme.tokens.ink};`);
        Array.from(listEl.children).forEach((li) => {
          if (li.tagName === 'LI') li.style.margin = '4px 0';
        });
      }
      const text = clone.innerHTML.trim();
      const tpl = (theme.html && theme.html[key]) || '<div>{{text}}</div>';
      return tpl.replace('{{title}}', title).replace('{{text}}', text);
    }

    // list パーツ本体：items（各アイテムのinnerHTML文字列配列）から行divを組み立てて{{items}}へ。
    // label はアクセント欄の英字ラベル（既定 Practice。STEP=eisai-steps用途では 'Step' を渡す）。
    function buildListHtmlFromItems(theme, title, items, label) {
      const rowsHtml = buildThemeListRowsHtml(theme.tokens, items);
      const tpl = (theme.html && theme.html.list) || '<div>{{title}}{{items}}</div>';
      return tpl.replace('{{title}}', title).replace('{{items}}', rowsHtml).replace('{{label}}', label || 'Practice');
    }

    // v0.13.0 修正: <ul>/<ol>のlisを対象要素から取り出す共通処理。ラッパーの<ul>/<ol>が
    // 見つからない場合も、直下に<li>が裸で置かれているケース（モデルがラッパーを省略）を拾う。
    function extractListItemsHtmlFrom(clone) {
      const listEl = clone.querySelector('ul, ol');
      if (listEl) {
        return Array.from(listEl.children).filter((c) => c.tagName === 'LI').map((li) => li.innerHTML);
      }
      return Array.from(clone.querySelectorAll(':scope > li')).map((li) => li.innerHTML);
    }

    // eisai-point-list 用：先頭の<strong>をタイトルに、<ul>/<ol>のliをitemsに変換
    // （<strong>が無ければ既定「ポイント」、<ul>/<ol>ラッパーが無く直下に<li>だけの場合も対応）
    function buildPointListHtml(theme, el) {
      const clone = el.cloneNode(true);
      let title = 'ポイント';
      const strong = clone.querySelector(':scope > strong');
      if (strong && strong.textContent.trim()) {
        title = strong.textContent.trim().replace(/[：:]\s*$/, '');
        strong.remove();
      }
      const items = extractListItemsHtmlFrom(clone);
      return buildListHtmlFromItems(theme, title, items);
    }

    // v0.13.0: 生成語彙対応 — <a>を除去してテキストだけ残す（目次のリンクはCMS側で不安定なため）
    function stripAnchorsKeepText(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      tmp.querySelectorAll('a').forEach((a) => {
        while (a.firstChild) a.parentNode.insertBefore(a.firstChild, a);
        a.remove();
      });
      return tmp.innerHTML;
    }

    // toc/summary パーツ本体：items（各アイテムのinnerHTML文字列配列）から行を組み立てる
    function buildTocHtmlFromItems(theme, title, items) {
      const rowsHtml = buildThemeTocRowsHtml(theme.tokens, items);
      const tpl = (theme.html && theme.html.toc) || '<div>{{title}}{{items}}</div>';
      return tpl.replace('{{title}}', title).replace('{{items}}', rowsHtml);
    }
    function buildSummaryHtmlFromItems(theme, title, items) {
      const rowsHtml = buildThemeSummaryRowsHtml(theme.tokens, items);
      const tpl = (theme.html && theme.html.summary) || '<div>{{title}}{{items}}</div>';
      return tpl.replace('{{title}}', title).replace('{{items}}', rowsHtml);
    }

    // eisai-toc 用：<strong>をタイトルに、<ol>/<ul>のliをitemsに変換（li内の<a>はテキストへ展開）。
    // v0.13.0 修正: <ol>/<ul>ラッパーが無く、直下の<li>だけ／直下の<p>行だけで
    // 目次が書かれているケース（モデルがリストマークアップを省略）にも対応する。
    function buildTocHtml(theme, el) {
      const clone = el.cloneNode(true);
      let title = '目次';
      const strong = clone.querySelector(':scope > strong');
      if (strong && strong.textContent.trim()) {
        title = strong.textContent.trim();
        strong.remove();
      }
      const listEl = clone.querySelector('ol, ul');
      let items;
      if (listEl) {
        items = Array.from(listEl.children).filter((c) => c.tagName === 'LI').map((li) => stripAnchorsKeepText(li.innerHTML));
      } else {
        const bareLis = Array.from(clone.querySelectorAll(':scope > li'));
        if (bareLis.length) {
          items = bareLis.map((li) => stripAnchorsKeepText(li.innerHTML));
        } else {
          items = Array.from(clone.querySelectorAll(':scope > p'))
            .map((p) => stripAnchorsKeepText(p.innerHTML).trim())
            .filter((t) => t !== '');
        }
      }
      return buildTocHtmlFromItems(theme, title, items);
    }

    // eisai-summary 用：<strong>をタイトルに、<ul>/<ol>のliをitemsに変換
    // （<strong>が無ければ既定「まとめ」、<ul>/<ol>ラッパーが無く直下に<li>だけの場合も対応）
    function buildSummaryHtml(theme, el) {
      const clone = el.cloneNode(true);
      let title = 'まとめ';
      const strong = clone.querySelector(':scope > strong');
      if (strong && strong.textContent.trim()) {
        title = strong.textContent.trim();
        strong.remove();
      }
      const items = extractListItemsHtmlFrom(clone);
      return buildSummaryHtmlFromItems(theme, title, items);
    }

    // related パーツ本体：rows（{title, url}の配列）から行を組み立てる
    function buildRelatedHtml(theme, title, rows) {
      const rowsHtml = buildThemeRelatedRowsHtml(theme.tokens, rows);
      const tpl = (theme.html && theme.html.related) || '<div>{{title}}{{items}}</div>';
      return tpl.replace('{{title}}', title).replace('{{items}}', rowsHtml);
    }

    // eisai-related 用：<strong>をタイトルに、内部の<a>群をrowsに変換（href/テキストは維持）。
    // v0.13.0 修正: 直下の<a>だけでなく、<ul><li><a>や<p><a>に包まれた形も受け付ける
    // （:scope > a に限定していたため、リスト形式で来ると読み取れなかった）。
    function buildRelatedHtmlFromNode(theme, el) {
      const clone = el.cloneNode(true);
      let title = 'あわせて読みたい';
      const strong = clone.querySelector(':scope > strong');
      if (strong && strong.textContent.trim()) {
        title = strong.textContent.trim();
        strong.remove();
      }
      const anchors = Array.from(clone.querySelectorAll('a'));
      const rows = anchors.map((a) => ({ url: a.getAttribute('href') || '#', title: a.innerHTML.trim() }));
      return buildRelatedHtml(theme, title, rows);
    }

    // eisai-school-info 用：中身（<br>/<p>込み）をそのままテンプレへ差し込む
    function buildSchoolInfoHtml(theme, el) {
      const tpl = (theme.html && theme.html.schoolinfo) || '<div>{{text}}</div>';
      return tpl.replace('{{text}}', el.innerHTML.trim());
    }

    // v0.13.0: 生成語彙対応 — CTA（中間/本）の主ボタン・サブボタン（tel/LINE等）。
    // data-partは持たせない（cta本体への入れ子をnormalizeParts側で外へ追い出されないようにするため）。
    function buildCtaMainButtonHtml(T, href, text) {
      return `<a data-role="bg" href="${href}" style="${BLOCK_SAFE_V3}${buildMainButtonStyle(T)}">${appendCtaArrowIfNeeded(text)}</a>`;
    }
    function buildCtaSubButtonHtml(T, href, text) {
      return `<a href="${href}" style="${BLOCK_SAFE_V3}${buildSubButtonStyle(T)}">${text}</a>`;
    }
    // cta本体：kind（mid/final）に応じてpadding/margin/リード文フォントを切り替える
    function buildCtaHtml(theme, kind, leadTextHtml, buttonsHtml) {
      const isFinal = kind === 'final';
      const padding = isFinal ? '32px 24px' : '22px 20px';
      const margin = isFinal ? '44px 0 0' : '28px 0';
      const textStyle = isFinal
        ? `font-family:${SERIF_STACK_V3};font-size:20px;font-weight:600;`
        : `font-size:15px;font-weight:700;`;
      const tpl = (theme.html && theme.html.cta) || '<div>{{text}}{{buttons}}</div>';
      return tpl
        .replace('{{kind}}', kind)
        .replace('{{padding}}', padding)
        .replace('{{margin}}', margin)
        .replace('{{textStyle}}', textStyle)
        .replace('{{text}}', leadTextHtml)
        .replace('{{buttons}}', wrapCtaButtonsHtml(buttonsHtml));
    }
    // v0.13.0 修正: CTA本文の「リード文」＝要素内の<a>の外側にあるテキストをすべて
    // 抜き出して1つの文にする（<p>/<strong>等でどう包まれていても対応する）。空なら既定文を使う。
    const CTA_DEFAULT_LEAD_TEXT = 'まずは、気軽にご相談ください。';
    function ctaLeadTextFromEl(el) {
      const parts = [];
      const collect = (node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          const t = (node.textContent || '').replace(/\s+/g, ' ').trim();
          if (t) parts.push(t);
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE || node.tagName === 'A') return;
        Array.from(node.childNodes).forEach(collect);
      };
      Array.from(el.childNodes).forEach(collect);
      const text = parts.join(' ').trim();
      return text || CTA_DEFAULT_LEAD_TEXT;
    }
    // v0.13.0 修正: CTA内の<a>群から本ボタン・サブボタンを振り分ける。
    // class="cta-sub"が付いた<a>はDOM順で先頭でも絶対に本ボタンにしない
    // （本ボタン候補が無いモデル出力ではやむを得ず先頭のcta-subを本ボタンとして扱う）。
    function pickCtaMainAndSubAnchors(anchors) {
      if (!anchors.length) return { mainA: null, subAs: [] };
      let mainIdx = anchors.findIndex((a) => !(a.classList && a.classList.contains('cta-sub')));
      if (mainIdx === -1) mainIdx = 0;
      const mainA = anchors[mainIdx];
      const subAs = anchors.filter((a, i) => i !== mainIdx);
      return { mainA, subAs };
    }
    // eisai-cta 用：data-kind="mid|final"（省略時はisLastTopLevelで判定）、本ボタン＝要素内で
    // 最初に見つかる<a>（<p>/<strong>に包まれていても構わない）、class="cta-sub"の<a>は
    // 何本あってもサブボタンとして変換する。元テキスト・hrefは一切変えない（Preserve every href exactly）。
    function buildCtaHtmlFromNode(theme, el, isLastTopLevel) {
      const explicitKind = el.getAttribute('data-kind');
      const kind = (explicitKind === 'final' || explicitKind === 'mid')
        ? explicitKind
        : (isLastTopLevel ? 'final' : 'mid');
      const clone = el.cloneNode(true);
      const leadText = ctaLeadTextFromEl(clone);
      const anchors = Array.from(clone.querySelectorAll('a'));
      const { mainA, subAs } = pickCtaMainAndSubAnchors(anchors);
      let buttonsHtml = '';
      if (mainA) {
        buttonsHtml += buildCtaMainButtonHtml(theme.tokens, mainA.getAttribute('href') || '#', mainA.innerHTML.trim());
      }
      subAs.forEach((a) => {
        buttonsHtml += buildCtaSubButtonHtml(theme.tokens, a.getAttribute('href') || '#', a.innerHTML.trim());
      });
      return buildCtaHtml(theme, kind, leadText, buttonsHtml);
    }
    // v0.13.0 修正: 生成語彙対応 — wrapper（class="eisai-cta"）を省略し、<p>にリード文＋<a>1本だけを
    // 書いてくるモデル出力パターン（申込・相談等の語＋http系href）を中間CTAとして検出する。
    const BARE_CTA_LINK_TEXT_RE = /申し込む|申込|相談|体験|問い合わせ|予約/;
    function isBareCtaParagraphEl(el) {
      if (!el || el.tagName !== 'P') return false;
      const children = Array.from(el.children);
      if (children.length !== 1 || children[0].tagName !== 'A') return false;
      const a = children[0];
      const href = a.getAttribute('href') || '';
      if (!/^https?:\/\//i.test(href)) return false;
      return BARE_CTA_LINK_TEXT_RE.test(a.textContent || '');
    }
    // wrapper省略パターンは常にkind=mid（ラッパー無しの素の<p>+<a>は記事中間の軽いCTAとして扱う）
    function buildBareCtaHtmlFromParagraph(theme, el) {
      const clone = el.cloneNode(true);
      const leadText = ctaLeadTextFromEl(clone);
      const a = clone.querySelector(':scope > a');
      const buttonsHtml = a ? buildCtaMainButtonHtml(theme.tokens, a.getAttribute('href') || '#', a.innerHTML.trim()) : '';
      return buildCtaHtml(theme, 'mid', leadText, buttonsHtml);
    }

    // v0.13.0: 生成語彙対応 — 見出し(h2/h3)先頭の連番表記
    // （①〜⑳／【STEP1】／STEP n／第n章／(n)／n./n、全角数字も含む）を、
    // テーマ側の01,02,…連番と二重にならないよう剥がす。walkNode専用（手動挿入では使わない）。
    const HEADING_NUMBER_PREFIX_RE = /^\s*(?:[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|第\s*[0-9０-９]+\s*章|【\s*STEP\s*[0-9０-９]+\s*】|STEP\s*[0-9０-９]+|[（(]\s*[0-9０-９]+\s*[）)]|[0-9０-９]+[.．)）])\s*[:：]?\s*/i;
    function stripHeadingNumberPrefix(html) {
      if (!html) return html;
      return html.replace(HEADING_NUMBER_PREFIX_RE, '');
    }

    // v0.13.0: 生成語彙対応 — テーブルの内容から「点数系（結果表）」か「通常表」かを判定する。
    // 最終列の“データセル”（thは除く）が全て /^\s*[\d０-９.,]+\s*(点|%|位|人)?\s*$/ に一致すれば点数系。
    const TABLE_SCORE_CELL_RE = /^\s*[\d０-９.,]+\s*(点|%|位|人)?\s*$/;
    function isScoreLikeTableEl(tableEl) {
      const rows = Array.from((tableEl.rows && tableEl.rows.length) ? tableEl.rows : tableEl.querySelectorAll('tr'));
      let hasDataCell = false;
      for (const row of rows) {
        const cells = Array.from(row.cells || row.children);
        if (!cells.length) continue;
        const lastCell = cells[cells.length - 1];
        if (lastCell.tagName === 'TH') continue; // 見出しセルは「データセル」に数えない
        hasDataCell = true;
        const text = (lastCell.textContent || '').trim();
        if (!TABLE_SCORE_CELL_RE.test(text)) return false;
      }
      return hasDataCell;
    }

    // table：内容から点数系（結果表）か通常表かを判定し、スタイルを分ける。
    // 点数系 → 最終列は右寄せ＋Georgia数字フォント、最終行×最終列はaccent色（従来の表現）。
    // 通常表 → th/tdとも左揃え・serifなし。先頭列のth（行見出し）はwidth:auto+ink色+背景なし。
    function buildThemedTableHtml(theme, tableEl) {
      const T = theme.tokens;
      const rows = Array.from((tableEl.rows && tableEl.rows.length) ? tableEl.rows : tableEl.querySelectorAll('tr'));
      if (!rows.length) return tableEl.outerHTML;
      const scoreLike = isScoreLikeTableEl(tableEl);
      // v0.13.0 P3: 1行目のセルが全てth＝「列見出し型」の表かどうかを判定する。
      // 列見出し型は1行目の全セル（左上含む）を同じ列見出しスタイルに揃える。
      // 一方「行見出し型」（各行が th＋td、例：<tr><th>開催日</th><td>…</td></tr>）は
      // 1行目だけを特別扱いしないため、この判定には引っかからない（見た目は変えない）。
      const firstRowCells = rows[0] ? Array.from(rows[0].cells || rows[0].children) : [];
      const isColumnHeaderTable = firstRowCells.length > 0 && firstRowCells.every((c) => c.tagName === 'TH');
      let rowsHtml = '';
      rows.forEach((row, rIdx) => {
        const isLastRow = rIdx === rows.length - 1;
        const cells = Array.from(row.cells || row.children);
        const cellsHtml = cells.map((cell, cIdx) => {
          const isHeader = cell.tagName === 'TH';
          const isFirstCol = cIdx === 0;
          const isLastCol = cIdx === cells.length - 1;
          // 列見出し型の1行目は、左上セルも他の列見出しセルと同じ見た目にする
          const isColumnHeaderCell = isColumnHeaderTable && rIdx === 0;
          const tag = isHeader ? 'th' : 'td';
          let style, extraAttrs;
          if (scoreLike) {
            style = isHeader
              ? `text-align:left;color:${T.muted};font-weight:500;font-size:12px;border-bottom:1px solid ${T.ink};padding:10px 0;`
              : `padding:14px 0;border-bottom:1px solid ${T.line};color:${T.ink};`;
            // v0.13.0 P2: 「パーツの色」の line（線）ターゲットで見出し行・本文行の区切り線を
            // まとめて変更できるよう、border-bottomを持つth/tdには常にdata-role="line"を付与する。
            // 本文セル（th以外）はcolor:${T.ink}も併せ持つのでtextロールも付与する。
            extraAttrs = isHeader ? ' data-role="line"' : ' data-role="text line"';
            if (isLastCol) style += 'text-align:right;';
            if (!isHeader && isLastCol) style += 'font:22px Georgia,serif;';
            if (!isHeader && isLastCol && isLastRow) {
              style += `color:${T.accent};`;
              extraAttrs = ' data-role="accent line"';
            }
          } else if (isHeader) {
            // v0.13.0: 通常表のth。先頭列（行見出し）は強調枠として背景なし・太字で見せる。
            // v0.13.0 P3: ただし列見出し型の1行目では左上セルも他の列見出しと揃える
            // （isColumnHeaderCellがtrueのときはisFirstColの特別扱いをしない）。
            if (isFirstCol && !isColumnHeaderCell) {
              style = `text-align:left;width:auto;font-weight:700;color:${T.ink};background:transparent;font-size:14px;padding:10px 12px;border-bottom:1px solid ${T.line};`;
              extraAttrs = ' data-role="text line"';
            } else {
              style = `text-align:left;font-weight:400;background:${T.hero};color:${T.muted};font-size:12px;padding:10px 12px;border-bottom:1px solid ${T.line};`;
              extraAttrs = ' data-role="bg text line"';
            }
          } else {
            // v0.13.0: 通常表のtd。右寄せ・serifなし
            style = `font-size:14px;color:${T.ink};padding:10px 12px;border-bottom:1px solid ${T.line};`;
            extraAttrs = ' data-role="text line"';
          }
          style += BLOCK_SAFE_V3;
          return `<${tag}${extraAttrs} style="${style}">${cell.innerHTML}</${tag}>`;
        }).join('');
        rowsHtml += `<tr>${cellsHtml}</tr>`;
      });
      const shell = (theme.html && theme.html.table) || `<table data-part="table" style="width:100%;border-collapse:collapse;font-size:14px;margin:26px 0 34px;${BLOCK_SAFE_V3}">{{rows}}</table>`;
      return shell.replace('{{rows}}', rowsHtml);
    }

    // data-cta-protected ブロック：テキスト・href は一切変えず、配色（背景・CTAボタン）だけ
    // 新テーマのトークンで塗り直す
    // v0.13.0: 拡張機能が出力する構造は先頭<a>＝本ボタン、以降の<a>＝サブボタン（tel等）で
    // 固定のため、その順序で本ボタン／サブボタンの共有幾何スタイルを振り分ける
    // （両ボタンが同じ幅・角丸・パディング・影の「対」に見えるようにする）。
    function restyleCtaProtectedNode(node, theme) {
      const T = theme.tokens;
      const clone = node.cloneNode(true);
      clone.setAttribute('style', `background:${T.soft};padding:28px 24px;margin:44px 0 0;text-align:center;border-radius:14px;${BLOCK_SAFE_V3}`);
      const anchors = Array.from(clone.querySelectorAll('a'));
      anchors.forEach((a, i) => {
        a.setAttribute('style', i === 0 ? buildMainButtonStyle(T) : buildSubButtonStyle(T));
        a.setAttribute('data-role', 'bg');
      });
      // v0.13.0: cta本体/consultと同じボタン列（幅を最も広いボタンに揃えるflex column）に
      // 揃える。拡張機能出力は全<a>が同じ親divの直下にあるため、その親をラッパーに転用する
      // （親を新設するとhref等の周辺構造を余計に書き換えることになるため、既存の親を使う）
      if (anchors.length) {
        const btnsParent = anchors[0].parentElement;
        const sameParent = btnsParent && btnsParent !== clone && anchors.every((a) => a.parentElement === btnsParent);
        if (sameParent) {
          btnsParent.setAttribute('style', CTA_BTNS_WRAP_STYLE);
          btnsParent.setAttribute('data-role', 'btns');
        }
      }
      return clone.outerHTML;
    }

    // === GEMINI HTMLにテーマを適用する関数 ===
    function applyThemeToGeminiHtml() {
      let geminiHtml = document.getElementById('gemini-html-input').value.trim();
      if (!geminiHtml) {
        showToast('拡張機能（Gemini / ChatGPT）からコピーしたHTMLを貼り付けてください', 'info');
        return;
      }

      // 現在選択中のテーマを取得（v0.13.0: getTheme()で旧キーもLEGACY_THEME_MAP経由で解決）
      const themeSelector = document.querySelector('.theme-selector');
      const selectedTheme = themeSelector ? themeSelector.value : 'girly-pink';
      const theme = getTheme(selectedTheme);
      if (!theme) {
        showToast('テーマが選択されていません', 'info');
        return;
      }

      console.log('選択されたテーマ:', selectedTheme);
      console.log('テーマオブジェクト:', theme);

      // v0.11.0 B1: テーマにテンプレートキーが欠けていても例外を投げず、
      // heading テンプレート（それも無ければプレーンなタグ）にフォールバックする。
      // これにより一部テーマのテーブル定義が不完全でも適用処理全体が止まらない。
      const getTpl = (key) => {
        if (theme.html && theme.html[key]) return theme.html[key];
        if (theme.html && theme.html.heading) return theme.html.heading;
        return '<div>{{text}}</div>';
      };
      // v0.13.0 P2: hero（ヒーロー見出し）はツールバーからの手動挿入専用に戻したため、
      // walkNode側では使わない。将来の再利用に備えテンプレート取得だけ残しておく。
      const heroTpl = getTpl('hero');
      const headingTpl = getTpl('heading');
      const subheadingTpl = getTpl('subheading');
      const listTpl = (theme.html && theme.html.list) ? theme.html.list : '<div>{{items}}</div>';
      const bubbleLeftTpl = getTpl('bubbleLeft');
      const bubbleRightTpl = getTpl('bubbleRight');
      const empathyTpl = getTpl('empathy');
      const noteTpl = getTpl('note');
      const highlightTpl = getTpl('highlight');
      const placeholderTpl = getTpl('placeholder');

      // v0.11.0 B9: 適用後の各ブロックのルート要素に data-theme を付与し、
      // 表示（addThemeStyles）・コピー（convertThemeClassesToInlineStyles）の
      // どちらからも「このブロックはどのテーマで生成されたか」を辿れるようにする。
      // 既にテンプレート側で data-theme が入っている場合（business-blueのクラス版）はそのまま尊重する。
      const tagWithTheme = (htmlStr) => {
        try {
          const wrap = document.createElement('div');
          wrap.innerHTML = htmlStr;
          if (wrap.children.length === 1 && !wrap.children[0].hasAttribute('data-theme')) {
            wrap.children[0].setAttribute('data-theme', selectedTheme);
          }
          return wrap.innerHTML;
        } catch (e) {
          return htmlStr;
        }
      };

      // テーマCSSを動的に追加
      addThemeStyles(selectedTheme, theme);

      // エスケープされたHTMLタグをデコード（\< → <, \> → > など）
      geminiHtml = geminiHtml.replace(/\\</g, '<').replace(/\\>/g, '>');
      
      // HTMLエンティティもデコード（&lt; → <, &gt; → > など）
      if (geminiHtml.includes('&lt;') || geminiHtml.includes('&gt;')) {
        const decoder = document.createElement('textarea');
        decoder.innerHTML = geminiHtml;
        geminiHtml = decoder.value;
      }
      console.log('デコード後のHTML:', geminiHtml.substring(0, 100) + '...');

      // タイトル候補（拡張機能が埋め込んだ EISAI_TITLES）を抽出し、コメントを本文から除去
      try {
        const titleParse = parseEisaiTitlesFromHtml(geminiHtml);
        geminiHtml = titleParse.html;
        editorTitleCandidates = titleParse.titles;
      } catch (e) {
        console.warn('[Eisai] タイトル候補抽出に失敗:', e);
        editorTitleCandidates = [];
      }

      // v0.13.0: 生成側が完成CTA（class="eisai-cta"）を含む場合、CTA_DATA素材ブロック（コメントと中身）は
      // 不要なので本文に残さず除去する（そのままだと「中間CTA文言：…」がテキストとして表示されてしまう）
      if (/class=["'][^"']*\beisai-cta\b/i.test(geminiHtml)) {
        geminiHtml = geminiHtml.replace(/<!--\s*CTA_DATA_START\s*-->[\s\S]*?<!--\s*CTA_DATA_END\s*-->/gi, '')
                               .replace(/<!--\s*EISAI_CHECK\s*:[\s\S]*?-->/gi, '');
      }
      // 生CTA素材（未処理のCTA_DATAコメント）を検知したら警告。拡張機能のコピーボタン経由を促す
      // v0.13.0: 生成側が完成CTA（class="eisai-cta"）を含む場合は素材だけの警告を出さない
      if (/<!--\s*CTA_DATA_START\s*-->/i.test(geminiHtml) && !/data-cta-protected/i.test(geminiHtml) && !/class=["'][^"']*\beisai-cta\b/i.test(geminiHtml)) {
        if (typeof setDraftStatus === 'function') {
          setDraftStatus('⚠️ CTAが未処理（生のCTA_DATA）です。拡張機能の「▶ ブログHTMLをコピー」ボタン経由で貼り付けてください', 'error');
        }
        showToast('このHTMLはCTAが未処理（生のCTA_DATA素材）のため、ボタン付きCTAになりません。ChatGPT等のチャットから直接コピーせず、拡張機能パネルの「▶ ブログHTMLをコピーする」ボタンでコピーして貼り付けてください。このまま続行するとCTAは表示されません。', 'error');
        // 生CTA_DATAコメントは本文に残さない（不可視だが除去）
        geminiHtml = geminiHtml.replace(/<!--\s*CTA_DATA_START\s*-->[\s\S]*?<!--\s*CTA_DATA_END\s*-->/gi, '');
      }

      // HTMLを解析
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = geminiHtml;

      // 表題自動抽出 → 表題フォームへ反映 + 本文（tempDiv）からは除去
      // ・H1優先（記事タイトル）。H1が無ければ最初のH2 → 最初のH3 → 本文先頭60字 でフォールバック
      // ・抽出した見出し要素自体を tempDiv から削除し、本文への二重表示を防ぐ
      // v0.12.0 fixup: 抽出元・抽出結果などの技術ログはステータスチップに出さず、
      // 完了トースト（extractTitleToastMsg）にまとめる。チップは常に「未保存」の状態表示のみ。
      let extractTitleToastMsg = '';
      try {
        let extractedTitle = '';
        let source = '';
        let titleNode = tempDiv.querySelector('h1');
        if (titleNode && titleNode.textContent.trim()) {
          extractedTitle = titleNode.textContent.trim();
          source = 'H1';
        } else {
          titleNode = tempDiv.querySelector('h2');
          if (titleNode && titleNode.textContent.trim()) {
            extractedTitle = titleNode.textContent.trim();
            source = 'H2(H1なし)';
          } else {
            titleNode = tempDiv.querySelector('h3');
            if (titleNode && titleNode.textContent.trim()) {
              extractedTitle = titleNode.textContent.trim();
              source = 'H3(H1/H2なし)';
            } else {
              titleNode = null;
              const firstP = tempDiv.querySelector('p');
              if (firstP && firstP.textContent.trim()) {
                extractedTitle = firstP.textContent.trim().slice(0, 60);
                source = '本文先頭(見出しなし)';
              }
            }
          }
        }
        // v0.13.0 P2: パス1でH1も本文に残す変更をしていたが、CMS側がタイトルを別途描画するため
        // 本文にH1相当の見出しが二重表示されてしまっていた。→ v0.11.0までの挙動に戻す：
        // H1から表題を抽出した場合のみ本文（tempDiv）から除去する。
        // H2/H3/本文先頭からの推定タイトルは、除去すると本文の情報が失われるためそのまま残す。
        if (titleNode && titleNode.parentNode) {
          if (source === 'H1') {
            titleNode.parentNode.removeChild(titleNode);
            console.log('[Eisai] 表題ノードを本文から除去:', source, extractedTitle.slice(0, 40));
          } else {
            console.log('[Eisai] 表題ノードは本文に残します（H1以外から推定）:', source, extractedTitle.slice(0, 40));
          }
        }
        if (extractedTitle && typeof setDraftTitle === 'function') {
          setDraftTitle(extractedTitle);
          if (typeof setDraftStatus === 'function') {
            setDraftStatus('未保存', 'saving');
          }
          const isH1 = source === 'H1';
          const inferredLabel = source.replace(/[（(].*$/, '');
          extractTitleToastMsg = isH1
            ? '✅ テーマを適用しました（表題はH1から抽出）'
            : '✅ テーマを適用しました（表題は' + inferredLabel + 'から推定・本文は残しています）';
        }
      } catch (e) {
        console.warn('表題自動抽出に失敗:', e);
      }

      // タイトル候補（3案）ボタンを表題バーに描画（クリックで表題フォームへ反映）
      if (typeof renderEditorTitleCandidates === 'function') renderEditorTitleCandidates();

      // CTAセクション（data-cta-protected）を事前に退避しておく
      // v0.13.0: テキスト・hrefは変えず、配色（背景・CTAボタン）だけ新テーマで塗り直す
      const ctaNodes = Array.from(tempDiv.querySelectorAll('[data-cta-protected]'));
      const ctaHtml = ctaNodes.map(node => restyleCtaProtectedNode(node, theme)).join('\n');
      ctaNodes.forEach(node => node.remove());

      // 結果を格納
      let themedHtml = '';

      // v0.11.0 B2: トップダウンの再帰処理に書き換え。
      // 旧実装は querySelectorAll + closest() でネストした要素をフラットに拾っていたため、
      // (a) <ul><li><p>x</p></li></ul> のようなネスト構造で内側の<p>が二重出力される、
      // (b) hr/img/figure/pre や eisai-empathy-box 等のラッパーdivがセレクタに無く
      //     サイレントに失われる（ラッパー内の<p>だけが生き残り中身のラベルごと消える）、
      // (c) ol が ul テンプレートに変換され番号が失われる、
      // といった問題があった。ここでは tempDiv.childNodes をトップレベルから1回だけ辿り、
      // 処理済みブロックの子孫を再度拾わないようにする。
      // ★ 抽出済みの表題ノードは tempDiv から既に removeChild 済みのため、本文には出ない

      // 既知のEisaiラッパークラス（eisai-empathy-box / eisai-point-list / eisai-manager-note /
      // eisai-highlight 等）はいずれも div なので、下の div/section/article 分岐で
      // クラス・構造を保持したまま再帰処理される（フラット化しない）
      const isBubbleLeft = (el) => typeof el.className === 'string' && el.className.includes('bubble-left');
      const isBubbleRight = (el) => typeof el.className === 'string' && el.className.includes('bubble-right');

      // v0.13.0 修正: CTAのdata-kind省略時、「記事の最後のパーツか」でmid/finalを振り分けるための
      // 判定（tempDiv直下で、これより後ろに意味のある要素・テキストが無ければ「最後」とみなす）
      function isLastArticleNode(node) {
        let sib = node.nextSibling;
        while (sib) {
          if (sib.nodeType === Node.ELEMENT_NODE) return false;
          if (sib.nodeType === Node.TEXT_NODE && sib.textContent.trim()) return false;
          sib = sib.nextSibling;
        }
        return node.parentNode === tempDiv;
      }

      function walkNode(node) {
        // テキストノード：意味のある文字が残っていれば<p>で包んで保持
        if (node.nodeType === Node.TEXT_NODE) {
          const t = node.textContent;
          return t && t.trim() ? `<p>${t}</p>` : '';
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          // コメント等は出力しない
          return '';
        }

        const el = node;
        const tagName = el.tagName.toLowerCase();
        console.log('要素処理:', tagName, (el.textContent || '').substring(0, 30) + '...');

        switch (tagName) {
          case 'h1':
            // v0.13.0 P2: H1は表題抽出時に本文から除去される想定なので通常はここに来ない。
            // 万一（複数H1など）残っていた場合もheroへは変換しない
            // （hero＝ヒーロー見出しパーツはツールバーからの手動挿入専用に戻したため）。
            // H2と同じ見出し扱いにフォールバックする。
          case 'h2':
            // H1(残存時)/H2見出し → テーマの見出しテンプレートを適用（連番は後でrenumberHeadingsが振る）。
            // v0.13.0: 見出しテキストが①②③／STEP n／(n)／n. 等で始まる場合、テーマ側の01,02,…と
            // 二重に番号が付くのを防ぐため先頭の番号表記を剥がす（walkNode限定・手動挿入には適用しない）。
            return tagWithTheme(headingTpl.replace('{{text}}', stripHeadingNumberPrefix(el.innerHTML)));
          case 'h3':
            // H3サブ見出し → テーマのサブ見出しテンプレートを適用（見出し同様、先頭の番号表記を剥がす）
            return tagWithTheme(subheadingTpl.replace('{{text}}', stripHeadingNumberPrefix(el.innerHTML)));
          case 'h4':
          case 'h5':
          case 'h6':
            // v0.13.0: H4-H6 → サブ見出しテンプレートを適用（同様に先頭の番号表記を剥がす）
            return tagWithTheme(subheadingTpl.replace('{{text}}', stripHeadingNumberPrefix(el.innerHTML)));

          case 'p': {
            // v0.13.0 修正: 本来はdivだが<p class="eisai-cta">のようにpへ付いてくるケースを、
            // 通常の段落処理より先に検出する（放置すると平文＋下線リンクのまま出てしまう）
            if (el.classList && el.classList.contains('eisai-cta')) {
              return tagWithTheme(buildCtaHtmlFromNode(theme, el, isLastArticleNode(el)));
            }
            // v0.13.0 修正: クラス無し、<p>にリード文＋<a>1本だけのCTA（ラッパーdiv省略）を検出する
            if (isBareCtaParagraphEl(el)) {
              return tagWithTheme(buildBareCtaHtmlFromParagraph(theme, el));
            }
            // 写真プレースホルダー → placeholderテンプレート（属性は維持）
            if (el.hasAttribute('data-photo-placeholder')) {
              return tagWithTheme(placeholderTpl.replace('{{text}}', el.innerHTML));
            }
            // p.eisai-highlight → マーカー行テンプレート（全体が強調済みなので内側のstrongは剥がす）
            if (el.classList && el.classList.contains('eisai-highlight')) {
              const tmp = document.createElement('div');
              tmp.innerHTML = el.innerHTML;
              tmp.querySelectorAll('strong').forEach((s) => {
                while (s.firstChild) s.parentNode.insertBefore(s.firstChild, s);
                s.remove();
              });
              return tagWithTheme(highlightTpl.replace('{{text}}', tmp.innerHTML));
            }
            // v0.13.0 修正: 空の<p>・<p><br></p>（生成物のノイズ）はエディタ側が自前で
            // スペーサーを用意するため、そのまま出すと二重に空行ができる → 削除する
            {
              const innerTrim = el.innerHTML.trim();
              if (innerTrim === '' || /^(<br\s*\/?>\s*)+$/i.test(innerTrim)) {
                return '';
              }
            }
            // 通常の段落 → テーマのinkカラーで最小限のスタイルを付与
            return `<p style="font-size:16px;line-height:2.05;margin:0 0 24px;color:${theme.tokens.ink};box-sizing:border-box;max-width:100%;word-break:break-word;overflow-wrap:break-word;">${el.innerHTML}</p>`;
          }

          case 'ul': {
            // リスト → テーマのリストテンプレートを適用（タイトルは「ポイント」固定）
            const items = Array.from(el.children).filter(c => c.tagName === 'LI').map(li => li.innerHTML);
            return tagWithTheme(buildListHtmlFromItems(theme, 'ポイント', items));
          }
          case 'ol': {
            // v0.13.0: 生成語彙対応 — <ol class="eisai-steps"> は既存のlistパーツへ
            // （タイトル固定「STEP」・アクセント欄ラベル「Step」・行は連番）
            // v0.13.0 修正: class="eisai-steps"が付いていなくても、直前がh2/h3で
            // 各行が短い（2〜7項目・各60文字以内）<ol>はモデルがクラスを省略した手順リストと
            // みなし、同じくstepsリストへ変換する（それ以外の<ol>は通常の<ol>のまま維持）。
            const liEls = Array.from(el.children).filter(c => c.tagName === 'LI');
            const prevEl = el.previousElementSibling;
            const looksLikeStepsWithoutClass = !!prevEl
              && (prevEl.tagName === 'H2' || prevEl.tagName === 'H3')
              && liEls.length >= 2 && liEls.length <= 7
              && liEls.every((li) => (li.textContent || '').trim().length <= 60);
            if ((el.classList && el.classList.contains('eisai-steps')) || looksLikeStepsWithoutClass) {
              const stepItems = liEls.map(li => li.innerHTML);
              // v0.13.2: 湯浅さん指摘「Step STEP と重複している」。タイトルを固定の「STEP」にせず、
              // 拡張機能（v0.4.2〜）が付ける data-title（手順の中身が分かる短いタイトル）を使う。
              // 無い時（古い出力）は「進め方」にする（英字ラベル「Step」と重ならないように）。
              const rawTitle = (el.getAttribute && el.getAttribute('data-title')) || '';
              const stepsTitle = escapeHtmlAttr(rawTitle.trim().slice(0, 30)) || '進め方';
              return tagWithTheme(buildListHtmlFromItems(theme, stepsTitle, stepItems, 'Step'));
            }
            // 順序付きリスト → 番号を保持するため<ol>のまま出力し、テーマのinkカラーで色付けする
            const items = Array.from(el.children).filter(c => c.tagName === 'LI').map(li => `<li>${li.innerHTML}</li>`).join('');
            const startAttr = el.hasAttribute('start') ? ` start="${el.getAttribute('start')}"` : '';
            const typeAttr = el.hasAttribute('type') ? ` type="${el.getAttribute('type')}"` : '';
            return `<ol${startAttr}${typeAttr} style="padding-left:1.4em;font-size:16px;line-height:2.05;color:${theme.tokens.ink};box-sizing:border-box;max-width:100%;word-break:break-word;overflow-wrap:break-word;">${items}</ol>`;
          }

          case 'blockquote':
            // v0.13.0: blockquote → タイトルなしのnoteテンプレート
            return tagWithTheme(noteTpl.replace('{{title}}', '').replace('{{text}}', el.innerHTML));

          case 'table': {
            // CTA以外のテーブル → テーマ配色でth/tdをインライン化（table→{{rows}}テンプレート経由）
            console.log('検出されたテーブルHTML:', el.outerHTML);
            return tagWithTheme(buildThemedTableHtml(theme, el));
          }

          default:
            break;
        }

        // 吹き出し要素の処理（v0.13.0: 先頭の「NAME：」からイニシャル・名前を抽出。
        // 無ければ既定の名前・イニシャルへ：左=先生/室長側、右=生徒/保護者側）
        if (isBubbleLeft(el)) {
          return tagWithTheme(buildBubbleHtml(theme, el, bubbleLeftTpl, '先', '先生'));
        }
        if (isBubbleRight(el)) {
          return tagWithTheme(buildBubbleHtml(theme, el, bubbleRightTpl, '生', '生徒'));
        }

        // v0.13.0: Eisai既知ラッパークラス → 対応する新パーツテンプレートへ変換
        if (el.classList && el.classList.contains('eisai-empathy-box')) {
          return tagWithTheme(buildStrongTitledPartHtml(theme, el, 'empathy', '保護者の方へ'));
        }
        if (el.classList && el.classList.contains('eisai-point-list')) {
          return tagWithTheme(buildPointListHtml(theme, el));
        }
        if (el.classList && el.classList.contains('eisai-manager-note')) {
          return tagWithTheme(buildStrongTitledPartHtml(theme, el, 'note', '室長より'));
        }
        // v0.13.0: 生成語彙対応（新パーツ5種）
        if (el.classList && el.classList.contains('eisai-toc')) {
          return tagWithTheme(buildTocHtml(theme, el));
        }
        if (el.classList && el.classList.contains('eisai-summary')) {
          return tagWithTheme(buildSummaryHtml(theme, el));
        }
        if (el.classList && el.classList.contains('eisai-related')) {
          return tagWithTheme(buildRelatedHtmlFromNode(theme, el));
        }
        if (el.classList && el.classList.contains('eisai-school-info')) {
          return tagWithTheme(buildSchoolInfoHtml(theme, el));
        }
        if (el.classList && el.classList.contains('eisai-cta')) {
          return tagWithTheme(buildCtaHtmlFromNode(theme, el, isLastArticleNode(el)));
        }

        // 既知のEisaiラッパー、および div/section/article は構造・クラスを保持したまま
        // 子要素だけ再帰的にテーマ変換する（フラット化して中身だけ残す旧実装のバグを修正）
        if (tagName === 'div' || tagName === 'section' || tagName === 'article') {
          try {
            const clone = el.cloneNode(false);
            clone.innerHTML = Array.from(el.childNodes).map(walkNode).join('');
            return clone.outerHTML;
          } catch (e) {
            console.warn('ラッパー要素の再帰処理に失敗、そのまま出力します:', tagName, e);
            return el.outerHTML;
          }
        }

        // hr / img / figure / pre / code / 未知タグなどは変更せずそのまま通す
        return el.outerHTML;
      }

      const topNodes = Array.from(tempDiv.childNodes);
      console.log('処理対象トップレベルノード数:', topNodes.length);

      if (topNodes.length === 0) {
        // HTMLタグがない場合はそのままテキストとして出力
        themedHtml = `<p>${geminiHtml}</p>`;
      } else {
        themedHtml = topNodes.map(walkNode).join('');
        if (!themedHtml.trim()) {
          // 有効な要素・テキストが一つも無かった場合はそのままテキストとして出力
          themedHtml = `<p>${geminiHtml}</p>`;
        }
      }

      // 退避しておいたCTAセクションを末尾にそのまま付与
      if (ctaHtml) {
        themedHtml += '\n\n' + ctaHtml;
      }

      // v0.13.0: 見出し（01,02,…）とリスト行（01,02,…）の連番を、実DOM上で振り直す
      try {
        const resultWrap = document.createElement('div');
        resultWrap.innerHTML = themedHtml;
        if (typeof renumberHeadings === 'function') renumberHeadings(resultWrap);
        if (typeof renumberListRows === 'function') {
          resultWrap.querySelectorAll('[data-part="list"], [data-part="toc"]').forEach((listRoot) => renumberListRows(listRoot));
        }
        themedHtml = resultWrap.innerHTML;
      } catch (e) {
        console.warn('[Eisai] 連番の振り直しに失敗:', e);
      }

      console.log('生成されたHTML:', themedHtml);

      // エディタに設定
      if (themedHtml.trim()) {
        if (!guardUnsaved('テーマを適用')) return;
        // 新しく適用した記事は、直前まで開いていた履歴エントリを上書きせず
        // 新規履歴として保存されるようにする（履歴上書きバグ対策）
        Drafts.clearCurrentId();
        if (editor && editor.setContent) {
          editor.setContent(themedHtml);
        } else {
          const editorElement = document.querySelector('.eisai-editor');
          if (editorElement) {
            _suppressUnsavedMark = true;
            editorElement.innerHTML = themedHtml;
            setTimeout(() => { _suppressUnsavedMark = false; }, 0);
          }
        }
        // v0.13.0: 「テーマを適用」は同じ記事の続き（直前の状態へ戻せる）として1手確定する
        EditorHistory.commit();
        _dirty = false;
        // v0.13.0 P3: 「テーマを変更」のoldKeyフォールバック用に、実際に適用したテーマを記録する
        window.lastAppliedThemeKey = selectedTheme;
        document.getElementById('gemini-html-input').value = '';
        showToast(extractTitleToastMsg || '✅ テーマを適用しました！', 'success');
      } else {
        showToast('変換できる要素が見つかりませんでした', 'error');
      }
    }

    // 未保存の変更がある状態でページを離脱しようとしたら警告する（v0.11.0 P0）
    window.addEventListener('beforeunload', (e) => {
      if (hasUnsavedChanges()) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // イベントリスナー設定
    document.addEventListener('DOMContentLoaded', () => {
      initEditor();

      document.getElementById('btn-generate-dummy').onclick = generateDummyArticle;
      document.getElementById('btn-generate-sample').onclick = generateSampleArticle;
      document.getElementById('btn-generate-full').onclick = generateFullDemo;
      document.getElementById('btn-theme-samples').onclick = generateThemeSamples;
      document.getElementById('btn-custom-samples').onclick = generateCustomToolSamples;
      document.getElementById('btn-clear-content').onclick = clearContent;
      // テーマ適用ボタンと左カラムHTML出力ボタンの初期化は initEditor 内で実施

      // 表題バー＆本文コピーバー注入（v0.9.0）
      injectArticleTitleBar();

      // v0.12.0 E1-1/E1-2: アプリシェル（左パネル/履歴パネルの開閉、プレビューモーダル）
      initPanelToggles();
      initPreviewModal();

      // 下書き保存システム初期化（v0.9.0）
      // 起動時はまっさら：履歴は localStorage に永続化されているが
      // 「現在編集中」はインメモリのため自動的にリセット済み
      try { localStorage.removeItem('eisai_editor_current_id_v3'); } catch (e) {}
      // v0.13.0: 旧バージョン（v2）からの履歴引き継ぎ（初回のみ・v3が空の時だけ）
      migrateDraftsFromLegacyIfNeeded();
      // 既存の履歴データを起動時に重複排除して再保存（過去バグの巻き添え対策）
      try {
        const before = JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]');
        const after = Drafts.load();
        if (Array.isArray(before) && before.length !== after.length) {
          Drafts.save(after);
          console.log('[Eisai] 起動時重複排除:', before.length, '→', after.length);
        }
      } catch (e) {}
      bindDraftUI();
      // エディタは空のまま起動。履歴サイドバーから明示選択するか、
      // GEMINI HTMLを貼って「テーマを適用」した時点で初めて新規エントリが作られる
      setDraftTitle('');
      setPlaygroundHtml('');
      setDraftStatus('新しい記事（未保存）', '');
    });
  </script>
</body>
</html>
