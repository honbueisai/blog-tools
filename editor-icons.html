        { type: 'list', label: 'リスト', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>' },
        // v0.13.0 P1: テーマv3で追加した新パーツ
        { type: 'empathy', label: 'ポイント（保護者の方へ）', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v16M4 4h14l-3 5 3 5H4"/></svg>' },
        { type: 'note', label: '室長より', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>' },
        { type: 'consult', label: '申込枠', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>' },
        { type: 'highlight', label: 'マーカー行', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l-6 6v3h3l6-6M15 4l-4 4m0 0l-2 2m2-2l7 7m-7-7l-3 3"/></svg>' },
        { type: 'hero', label: 'ヒーロー見出し', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9v6M16 9v6M8 12h8"/></svg>' },
        // v0.13.0: 新しい生成語彙対応（目次／まとめ／関連記事／中間CTA）
        { type: 'toc', label: '目次', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h4M4 12h4M4 18h4M11 6h9M11 12h9M11 18h9"/></svg>' },
        { type: 'summary', label: 'まとめ', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>' },
        { type: 'related', label: '関連記事', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>' },
        { type: 'cta', label: '中間CTA', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 4v3M12 17v3"/></svg>' }
      ];
      
      presetBtnData.forEach(btn => {
        const presetBtn = createEl('button', { className: 'preset-btn' }, presetButtons);
        presetBtn.innerHTML = btn.icon + '<span>' + btn.label + '</span>';
        // mousedownで選択範囲を保存（フォーカスが外れる前に）
        presetBtn.onmousedown = (e) => {
          e.preventDefault();
          const sel = window.getSelection();
          if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            globalSavedRange = sel.getRangeAt(0).cloneRange();
          }
        };
        presetBtn.onclick = () => insertPresetElement(editor, btn.type);
      });
      
            
      // テーマ変更時の処理
      themeSelector.onchange = () => {
        currentTheme = themeSelector.value;
        themeDescription.textContent = getTheme(currentTheme).description;
        // テーマカラーでボタンの色を変更
        const color = getTheme(currentTheme).color;
        presetButtons.querySelectorAll('.preset-btn').forEach(btn => {
          btn.style.borderColor = color;
        });
        // v0.13.0: スワッチ（hero/accent/cta）も選択中テーマに合わせて更新
        renderThemeSwatches(currentTheme);
        // ★ 動的テーマCSSを再注入（吹き出し等のスタイル）
        if (typeof addThemeStyles === 'function') {
          addThemeStyles(currentTheme, getTheme(currentTheme));
        }
        // v0.13.0 P3: 選択が変わったことに気付いてもらうため「テーマを変更」ボタンを一時的にハイライト
        if (rethemeBtn && !rethemeBtn.disabled) {
          rethemeBtn.classList.add('is-ready');
          clearTimeout(rethemeBtn._readyTimer);
          rethemeBtn._readyTimer = setTimeout(() => rethemeBtn.classList.remove('is-ready'), 2600);
        }
      };

      // ★ 起動時：デフォルトテーマのCSSを即座に注入（プリセットモードのプレビュー用）
      if (typeof addThemeStyles === 'function' && getTheme(currentTheme)) {
        addThemeStyles(currentTheme, getTheme(currentTheme));
      }
      
      // カスタムモード切り替え（トグルスイッチ）
      toggleSwitch.onclick = () => {
        isCustomMode = !isCustomMode;
        toggleSwitch.classList.toggle('active', isCustomMode);
        isPresetMode = !isCustomMode;
        // カスタムモードの場合、ツールバーのカテゴリを表示
        const categoryContainer = document.querySelector('.eisai-category-container');
        if (categoryContainer) {
          categoryContainer.style.display = isCustomMode ? 'flex' : 'none';
        }
        // v0.11.0 P1 D1-3: プリセットモード時は空の第2ツールバー行自体を隠し、
        // 空バンドが残らないようにする
        row2Toolbar.hidden = !isCustomMode;
        // プリセットボタンの表示/非表示（v0.12.0: 横1行チップ帯なので display:flex）
        presetButtons.style.display = isCustomMode ? 'none' : 'flex';
        themeSelector.style.display = isCustomMode ? 'none' : 'block';
        themeDescription.style.display = isCustomMode ? 'none' : 'block';
        // v0.13.0: 「ニュー／クラシック」セット切替の表示/非表示もカスタムモードに連動させる
        updateCustomSetButtons();
      };

      // ツールバー（2列レイアウト用）- 固定ヘッダーに追加
      const toolbarContainer = createEl('div', { className: 'eisai-toolbar-container' }, fixedHeader);
      const row1Toolbar = createEl('div', { className: 'eisai-toolbar' }, toolbarContainer);
      const row2Toolbar = createEl('div', { className: 'eisai-toolbar' }, toolbarContainer);
      // v0.11.0 P1 D1-3: 初期状態（プリセットモード）では第2行を隠し、空バンドを出さない
      row2Toolbar.hidden = !isCustomMode;
      
      const editorArea = createEl('div', { className: 'eisai-editor-container' }, panel);
      const editor = createEl('div', { className: 'eisai-editor' }, editorArea);
      editor.contentEditable = 'true';

      // v0.13.0: EditorHistory をこのエディタ要素で初期化（現在の内容＝空を起点にする）
      EditorHistory.init(editor);

      // v0.13.0: 入力（タイピング）は600ms無操作でコミット（連続した文字入力を1手にまとめる）。
      // Enter/Backspace/貼り付け等の「特別な変更」の直前（beforeinput）では、
      // まだコミットされていないタイピングをその場で確定させ、通常入力と分けて
      // それぞれ別の1手として undo できるようにする。
      let _historyTypingTimer = null;
      editor.addEventListener('input', (e) => {
        if (EditorHistory.suppress) return;
        if (e && e.isComposing) return; // IME確定前は反映しない
        clearTimeout(_historyTypingTimer);
        _historyTypingTimer = setTimeout(() => {
          EditorHistory.commit('typing');
        }, 600);
      });
      editor.addEventListener('beforeinput', (e) => {
        if (EditorHistory.suppress) return;
        const t = (e && e.inputType) || '';
        if (t.indexOf('delete') === 0 || t === 'insertParagraph' || t === 'insertFromPaste') {
          clearTimeout(_historyTypingTimer);
          EditorHistory.commit('pre-' + t);
        }
      });

      // v0.13.0: ⌘Z/Ctrl+Z＝元に戻す、⌘⇧Z・Ctrl+Y・Ctrl+Shift+Z＝やり直し。
      // ネイティブのundo/redoと競合しないよう、ここで完全に横取りする。
      editor.addEventListener('keydown', (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (!mod || e.altKey) return;
        const key = e.key ? e.key.toLowerCase() : '';
        if (key === 'z' && !e.shiftKey) {
          e.preventDefault();
          EditorHistory.undo();
        } else if ((key === 'z' && e.shiftKey) || key === 'y') {
          e.preventDefault();
          EditorHistory.redo();
        }
      });

      // サイドバー（左カラム）のGEMINI HTML貼り付け下だけにHTML出力ボタンを配置
      const leftGeminiExport = document.getElementById('sidebar-html-export');
      if (leftGeminiExport) {
        createLargeHtmlExportButton(leftGeminiExport);
      }

      // 選択範囲を保存（ボタンクリック時にフォーカスが外れても復元できるようにする）
      // ★ cloneRange() で独立コピーを取ることで、execCommand によるDOM変更で
      //    保存済み range が無効化されないようにする
      const saveSelection = () => {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
          globalSavedRange = sel.getRangeAt(0).cloneRange();
        }
      };
      // 入力操作やマウス操作時のみ更新する（エディタ外へフォーカスが移った blur では上書きしない）
      editor.addEventListener('keyup', saveSelection);
      editor.addEventListener('mouseup', saveSelection);
      // ★ selectionchange も拾って、execCommand 後の最新 selection を保存
      //    （ただし editor 内のときだけ）
      document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
          try { globalSavedRange = sel.getRangeAt(0).cloneRange(); } catch (e) {}
        }
      });
      
      // ========================================
      // v0.13.0: パーツ境界を越えるEnter/Backspace/Delete・パーツ内貼り付け・
      // パーツ操作バー（上へ／下へ／下に段落／削除）。
      // 「パーツが前後すると、改行とか、削除とかが、いろいろぐちゃぐちゃになっていく」報告への対応。
      // 方針：パーツ内外の境界ではブラウザの既定分割・結合に任せず、ここで完結してDOM操作した上で
      // EditorHistory.commit()する（commit内部でnormalizeParts()が必ず走り、取りこぼしも repair する）。
      // ========================================

      // 現在「選択」状態（data-selected）になっているパーツ根。Backspace/Delete 2回目で削除できる。
      let selectedPartEl = null;
      function clearPartSelection() {
        if (selectedPartEl) {
          selectedPartEl.removeAttribute('data-selected');
          selectedPartEl = null;
        }
      }
      function selectPartEl(el) {
        if (!el || selectedPartEl === el) return;
        clearPartSelection();
        el.setAttribute('data-selected', '1');
        selectedPartEl = el;
      }

      // パーツの直後に「抜け出し先」の段落を確保してキャレットを置く（スペーサーがあれば再利用）
      function exitPartBelow(partRoot) {
        const next = partRoot.nextElementSibling;
        let target;
        if (isEmptyParagraphEl(next)) {
          target = next;
          target.removeAttribute('data-spacer');
        } else {
          target = document.createElement('p');
          target.appendChild(document.createElement('br'));
          partRoot.parentNode.insertBefore(target, next);
        }
        placeCaretAtStartEl(target);
        return target;
      }

      // リストパーツ内、キャレットが属する行（data-role~="line"、パーツ直下）を求める
      function closestListRowEl(partRoot, node) {
        const el = node && node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
        if (!el || !el.closest) return null;
        const row = el.closest('[data-role~="line"]');
        return (row && partRoot.contains(row) && row.parentElement === partRoot) ? row : null;
      }
      // テーブルパーツ内、キャレットが属するセル（td/th）を求める
      function closestCellEl(partRoot, node) {
        const el = node && node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
        if (!el || !el.closest) return null;
        const cell = el.closest('td, th');
        return (cell && partRoot.contains(cell)) ? cell : null;
      }

      editor.addEventListener('keydown', (e) => {
        if (e.isComposing) return; // IME確定前は横取りしない
        const key = e.key;
        if (key !== 'Enter' && key !== 'Backspace' && key !== 'Delete') {
          // 「入力中」または矢印キー等：パーツ選択状態は解除する（他キー／選択変更で解除の一環）
          if (selectedPartEl) clearPartSelection();
          return;
        }

        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        if (!editor.contains(range.startContainer) || !editor.contains(range.endContainer)) return;

        // Enterは「入力」に類するのでパーツ選択状態は解除する
        if (key === 'Enter' && selectedPartEl) clearPartSelection();

        // 選択範囲がパーツ境界をまたぐ場合：キー種別を問わず「削除して修復」で統一する
        if (!range.collapsed) {
          const startRoot = closestPartRootEl(editor, range.startContainer);
          const endRoot = closestPartRootEl(editor, range.endContainer);
          if (startRoot !== endRoot) {
            e.preventDefault();
            e.stopImmediatePropagation();
            range.deleteContents();
            normalizeParts(editor);
            EditorHistory.commit();
            return;
          }
          if (key !== 'Enter') return; // 同一パーツ内／パーツ外のBackspace・Deleteは既定動作へ
          range.deleteContents(); // Enterのみ：選択削除後、通常のEnter分岐へ続ける（rangeは崩れず再利用可）
        }

        if (key !== 'Enter' && selectedPartEl) {
          // Backspace/Delete 2回目：選択中のパーツを確定削除する
          e.preventDefault();
          e.stopImmediatePropagation();
          const toRemove = selectedPartEl;
          clearPartSelection();
          toRemove.remove();
          normalizeParts(editor);
          EditorHistory.commit();
          return;
        }

        const partRoot = closestPartRootEl(editor, range.startContainer);
        // v0.13.0: 拡張機能由来の保護CTA（[data-cta-protected]、data-partは持たない）は
        // 内部的に 'ctaProtected' として区別する。生成語彙対応で新設した data-part="cta"
        // （中間／本CTA。中身は編集可能でbox同様の挙動を期待される）とは名前空間を分ける。
        // Enter/Backspace/Deleteのいずれからも参照するため、パーツ判定の直後で1回だけ求める。
        const kind = partRoot ? (partRoot.hasAttribute('data-cta-protected') ? 'ctaProtected' : (partRoot.getAttribute('data-part') || '')) : '';

        if (key === 'Enter') {
          if (!partRoot) return; // パーツの外：既存の挙動のまま
          e.preventDefault();
          e.stopImmediatePropagation();

          if (e.shiftKey) {
            insertLineBreakAtRange(range);
            EditorHistory.commit();
            return;
          }

          const alwaysExitKinds = ['heading', 'subheading', 'hero', 'highlight', 'placeholder', 'button', 'ctaProtected'];

          if (alwaysExitKinds.indexOf(kind) !== -1) {
            exitPartBelow(partRoot);
            EditorHistory.commit();
            return;
          }

          // list/table は行・セル単位で完結する専用ロジックを持つため、
          // 「パーツ末尾なら無条件で抜ける」という汎用ルールより優先する
          // （最終行/最終セルにいる＝末尾、でも「空行なら削除して抜ける」等の扱いが必要なため）。
          // v0.13.0: 目次（toc）／まとめ（summary）もlistと同じ行単位のレイアウトを持つため同様に扱う
          // （renumberListRowsはdata-step="true"がない行には影響しないため、summaryでも安全に呼べる）。
          if (kind === 'list' || kind === 'toc' || kind === 'summary') {
            const row = closestListRowEl(partRoot, range.startContainer);
            if (row) {
              const textEl = row.querySelector('[data-role~="text"]') || row;
              const isEmptyRow = (textEl.textContent || '').trim() === '';
              if (isEmptyRow) {
                row.remove();
                exitPartBelow(partRoot);
              } else {
                const newRow = row.cloneNode(true);
                const newTextEl = newRow.querySelector('[data-role~="text"]');
                if (newTextEl) {
                  newTextEl.innerHTML = '';
                  newTextEl.appendChild(document.createElement('br'));
                }
                row.parentNode.insertBefore(newRow, row.nextSibling);
                placeCaretAtStartEl(newTextEl || newRow);
                renumberListRows(partRoot);
              }
              EditorHistory.commit();
              return;
            }
            insertLineBreakAtRange(range);
            EditorHistory.commit();
            return;
          }

          if (kind === 'table') {
            const cell = closestCellEl(partRoot, range.startContainer);
            if (cell) {
              const row = cell.closest('tr');
              const table = partRoot.tagName === 'TABLE' ? partRoot : partRoot.querySelector('table');
              const rows = table ? Array.from(table.rows) : [];
              const rowIdx = row ? rows.indexOf(row) : -1;
              const cellIdx = row ? Array.prototype.indexOf.call(row.cells, cell) : -1;
              const nextRow = rowIdx !== -1 ? rows[rowIdx + 1] : null;
              if (nextRow) {
                const targetCell = nextRow.cells[cellIdx] || nextRow.cells[nextRow.cells.length - 1];
                placeCaretAtStartEl(targetCell);
              } else {
                exitPartBelow(partRoot);
              }
            } else {
              exitPartBelow(partRoot);
            }
            EditorHistory.commit();
            return;
          }

          // box/empathy/note/consult/bubble/catalog 等のテキストコンテナ：
          // パーツの実質末尾なら抜ける、それ以外はブロックを割らず改行のみ
          // v0.13.0: 吹き出しはavatar/tailがpartRoot内にテキスト付きで同居するため、
          // 末尾判定はpartRoot全体ではなく本文コンテナ（[data-role~="text"]）基準で行う
          if (atEndOfRootRange(textScopeRootForPart(partRoot, kind), range)) {
            exitPartBelow(partRoot);
            EditorHistory.commit();
            return;
          }
          insertLineBreakAtRange(range);
          EditorHistory.commit();
          return;
        }

        if (key === 'Backspace') {
          if (partRoot) {
            if (atStartOfRootRange(textScopeRootForPart(partRoot, kind), range)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              const prev = partRoot.previousElementSibling;
              if (prev) {
                const prevPrev = prev.previousElementSibling;
                if (isEmptyParagraphEl(prev) && !(prevPrev && isPartRootEl(prevPrev))) {
                  prev.remove(); // 直前の空段落を除去し、キャレットはパーツ先頭のまま
                } else {
                  placeCaretAtEndEl(prev); // 結合はせず、直前段落の末尾へキャレットを移すだけ
                }
              }
              // 直前要素が無い（パーツがエディタの先頭）場合は何もしない
            }
            return; // パーツ内・非先頭は既定動作（空になったコンテナの<br>維持はinputハンドラで補う）
          }
          // パーツの外：空段落＋直前がパーツ根 → 選択（1回目）
          let block = range.startContainer.nodeType === Node.TEXT_NODE ? range.startContainer.parentElement : range.startContainer;
          while (block && block.parentElement !== editor) block = block.parentElement;
          if (block && isEmptyParagraphEl(block)) {
            const prev = block.previousElementSibling;
            if (prev && isPartRootEl(prev)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              selectPartEl(prev);
            }
          }
          return;
        }

        if (key === 'Delete') {
          if (partRoot) {
            if (atEndOfRootRange(textScopeRootForPart(partRoot, kind), range)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              exitPartBelow(partRoot); // 結合はせず、後続段落（無ければ新規作成）へキャレットを移す
              EditorHistory.commit();
            }
            return;
          }
          // パーツの外：段落の末尾＋直後がパーツ根 → 選択（1回目）
          let block = range.startContainer.nodeType === Node.TEXT_NODE ? range.startContainer.parentElement : range.startContainer;
          while (block && block.parentElement !== editor) block = block.parentElement;
          if (block && atEndOfRootRange(block, range)) {
            const next = block.nextElementSibling;
            if (next && isPartRootEl(next)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              selectPartEl(next);
            }
          }
          return;
        }
      });

      // クリック・フォーカス喪失でパーツ選択状態を解除する。ただし、パーツの余白（padding）を
      // 直接クリックした場合（mousedownのtargetがパーツ根そのもの）は逆に選択状態にする
      // （Backspaceでの削除を可能にするため）。
      editor.addEventListener('mousedown', (e) => {
        if (e.target && e.target.nodeType === 1 && isPartRootEl(e.target)) {
          selectPartEl(e.target);
        } else if (selectedPartEl) {
          clearPartSelection();
        }
      });
      document.addEventListener('selectionchange', () => {
        if (selectedPartEl) clearPartSelection();
      });
      editor.addEventListener('blur', () => {
        if (selectedPartEl) clearPartSelection();
      });

      // v0.13.0: パーツ内テキストコンテナへの貼り付けはプレーンテキストのみ（改行→<br>）。
      // パーツの外は既存の挙動のまま（貼り付け直後のinputでnormalizePartsを1回走らせる）。
      let pendingOutsidePartPasteNormalize = false;
      editor.addEventListener('paste', (e) => {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        const partRoot = closestPartRootEl(editor, range.startContainer);
        if (!partRoot) {
          pendingOutsidePartPasteNormalize = true;
          return;
        }
        e.preventDefault();
        e.stopImmediatePropagation();
        const cd = e.clipboardData || window.clipboardData;
        const text = cd ? (cd.getData('text/plain') || '') : '';
        if (!text) return;
        if (!range.collapsed) range.deleteContents();
        const lines = text.split(/\r\n|\r|\n/);
        const frag = document.createDocumentFragment();
        lines.forEach((line, i) => {
          if (i > 0) frag.appendChild(document.createElement('br'));
          if (line) frag.appendChild(document.createTextNode(line));
        });
        if (!frag.childNodes.length) return;
        const insertedLast = frag.lastChild;
        range.insertNode(frag);
        const newRange = document.createRange();
        newRange.setStartAfter(insertedLast);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
        markUnsavedChange();
        EditorHistory.commit();
      });

      // v0.13.0: 入力のたびに軽量チェック（1) パーツ外貼り付け後のnormalizeParts、
      // 2) スペーサーに文字が入ったらdata-spacerを外す、3) パーツ内テキストコンテナが
      // 編集で完全に空になったら<br>を残して潰れないようにする）
      editor.addEventListener('input', () => {
        if (pendingOutsidePartPasteNormalize) {
          pendingOutsidePartPasteNormalize = false;
          normalizeParts(editor);
        }
        try {
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return;
          const node = sel.getRangeAt(0).startContainer;
          const el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
          if (!el) return;
          const spacerAncestor = el.closest ? el.closest('p[data-spacer="1"]') : null;
          if (spacerAncestor && (spacerAncestor.textContent || '').trim() !== '') {
            spacerAncestor.removeAttribute('data-spacer');
          }
          const partRoot = closestPartRootEl(editor, el);
          if (!partRoot) return;
          let tc = el;
          while (tc && tc !== partRoot && !isTextContainerEl(tc)) tc = tc.parentElement;
          if (tc && isTextContainerEl(tc) && (tc === partRoot || partRoot.contains(tc))) {
            const hasText = (tc.textContent || '').trim() !== '';
            const hasBr = !!tc.querySelector('br');
            if (!hasText && !hasBr && tc.children.length === 0) {
              tc.appendChild(document.createElement('br'));
              placeCaretAtStartEl(tc);
            }
          }
        } catch (err) {}
      });

      // v0.13.0: パーツ操作バー（キャレットがパーツ内にあるとき、パーツ右上に浮かぶ操作ピル）
      const partToolbar = createEl('div', { className: 'eisai-part-toolbar' }, editorArea);
      function makePartToolbarBtn(label, title) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'eisai-part-toolbar-btn';
        b.textContent = label;
        b.title = title;
        b.setAttribute('aria-label', title);
        b.onmousedown = (ev) => ev.preventDefault(); // フォーカス・選択範囲を維持したままにする
        partToolbar.appendChild(b);
        return b;
      }
      const partToolbarUp = makePartToolbarBtn('↑', '上へ');
      const partToolbarDown = makePartToolbarBtn('↓', '下へ');
      const partToolbarAddPara = makePartToolbarBtn('＋', '下に段落');
      const partToolbarDelete = makePartToolbarBtn('🗑', '削除');

      let partToolbarTarget = null;
      function hidePartToolbar() {
        partToolbar.style.display = 'none';
        partToolbarTarget = null;
      }
      function positionPartToolbar(partEl) {
        if (!partEl || !editor.contains(partEl)) { hidePartToolbar(); return; }
        partToolbarTarget = partEl;
        partToolbar.style.display = 'flex';
        const containerRect = editorArea.getBoundingClientRect();
        const rect = partEl.getBoundingClientRect();
        const top = rect.top - containerRect.top + editorArea.scrollTop + 4;
        let left = rect.right - containerRect.left + editorArea.scrollLeft - partToolbar.offsetWidth - 4;
        if (left < editorArea.scrollLeft + 4) left = editorArea.scrollLeft + 4;
        partToolbar.style.top = top + 'px';
        partToolbar.style.left = left + 'px';
      }
      function updatePartToolbarFromSelection() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || !editor.contains(sel.anchorNode)) { hidePartToolbar(); return; }
        const partEl = closestPartRootEl(editor, sel.getRangeAt(0).startContainer);
        if (partEl) positionPartToolbar(partEl); else hidePartToolbar();
      }
      document.addEventListener('selectionchange', updatePartToolbarFromSelection);
      editorArea.addEventListener('scroll', () => { if (partToolbarTarget) positionPartToolbar(partToolbarTarget); });
      window.addEventListener('resize', () => { if (partToolbarTarget) positionPartToolbar(partToolbarTarget); });

      // v0.13.0 修正: キャレットがスペーサー段落（p[data-spacer]）の中にある間だけ、
      // クリックできる場所だと分かる薄い破線ヒントを出す（.eisai-spacer-caret はCSS側で
      // ホバー時と同じ::afterのopacityを共有する）
      let lastSpacerCaretEl = null;
      function updateSpacerCaretHighlight() {
        const sel = window.getSelection();
        let spacerEl = null;
        if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
          const node = sel.getRangeAt(0).startContainer;
          const el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
          spacerEl = el && el.closest ? el.closest('p[data-spacer]') : null;
        }
        if (lastSpacerCaretEl && lastSpacerCaretEl !== spacerEl) {
          lastSpacerCaretEl.classList.remove('eisai-spacer-caret');
        }
        if (spacerEl) spacerEl.classList.add('eisai-spacer-caret');
        lastSpacerCaretEl = spacerEl;
      }
      document.addEventListener('selectionchange', updateSpacerCaretHighlight);

      function movePartUp(partEl) {
        let target = partEl.previousElementSibling;
        if (!target) return;
        if (isEmptyParagraphEl(target)) {
          target = target.previousElementSibling;
          if (!target) return;
        }
        partEl.parentNode.insertBefore(partEl, target);
        normalizeParts(editor);
        positionPartToolbar(partEl);
        markUnsavedChange();
        EditorHistory.commit();
      }
      function movePartDown(partEl) {
        let target = partEl.nextElementSibling;
        if (!target) return;
        if (isEmptyParagraphEl(target)) {
          target = target.nextElementSibling;
          if (!target) return;
        }
        partEl.parentNode.insertBefore(target, partEl);
        normalizeParts(editor);
        positionPartToolbar(partEl);
        markUnsavedChange();
        EditorHistory.commit();
      }
      function addParagraphAfterPart(partEl) {
        const p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        partEl.parentNode.insertBefore(p, partEl.nextSibling);
        placeCaretAtStartEl(p);
        markUnsavedChange();
        EditorHistory.commit();
        hidePartToolbar();
      }
      function deletePartViaToolbar(partEl) {
        const next = partEl.nextElementSibling;
        const prev = partEl.previousElementSibling;
        hidePartToolbar();
        clearPartSelection();
        partEl.remove();
        normalizeParts(editor);
        const target = (next && editor.contains(next)) ? next : ((prev && editor.contains(prev)) ? prev : null);
        if (target) placeCaretAtStartEl(target);
        markUnsavedChange();
        EditorHistory.commit();
      }
      partToolbarUp.onclick = () => { if (partToolbarTarget) movePartUp(partToolbarTarget); };
      partToolbarDown.onclick = () => { if (partToolbarTarget) movePartDown(partToolbarTarget); };
      partToolbarAddPara.onclick = () => { if (partToolbarTarget) addParagraphAfterPart(partToolbarTarget); };
      partToolbarDelete.onclick = () => { if (partToolbarTarget) deletePartViaToolbar(partToolbarTarget); };

      // 装飾ブロックかどうかを判定するヘルパー関数
      function isDecorationElement(el) {
        if (!el || el === editor) return false;
        if (el.tagName === 'BUTTON') return true;
        if (el.tagName === 'FIELDSET') return true;
        if (el.tagName === 'UL' || el.tagName === 'OL') return true;
        if (el.tagName === 'DIV' && el.style) {
          const hasDecoration = el.style.background || 
            el.style.backgroundColor || 
            el.style.border || 
            el.style.borderRadius ||
            el.style.boxShadow ||
            (el.style.padding && el.style.padding !== '0px') ||
            (el.className && typeof el.className === 'string' && 
             (el.className.includes('targetlist_') || el.className.includes('eisai-')));
          if (hasDecoration) return true;
        }
        return false;
      }
      
      // リスト内でのBackspace/Delete動作を制御
      editor.addEventListener('keydown', (e) => {
        if (e.key !== 'Backspace' && e.key !== 'Delete') return;
        
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        
        const range = sel.getRangeAt(0);
        if (!range.collapsed) return; // 選択範囲がある場合は通常動作
        
        let node = range.startContainer;
        const originalNode = node;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
        
        // 通常テキスト（p, div等）から装飾への侵食を防ぐ
        // エディタ直下の要素を取得
        let directChild = node;
        while (directChild && directChild.parentElement !== editor) {
          directChild = directChild.parentElement;
        }
        
        if (directChild && !isDecorationElement(directChild)) {
          // 通常テキスト内にいる場合
          
          // Backspace: 先頭で前の要素が装飾なら侵食を防ぐ
          if (e.key === 'Backspace' && range.startOffset === 0) {
            // 現在のノードがdirectChildの最初のテキストノードかチェック
            let firstTextNode = null;
            const walker = document.createTreeWalker(directChild, NodeFilter.SHOW_TEXT, null, false);
            firstTextNode = walker.nextNode();
            
            if (firstTextNode && originalNode === firstTextNode) {
              const prevSibling = directChild.previousElementSibling;
              if (prevSibling && isDecorationElement(prevSibling)) {
                e.preventDefault();
                return;
              }
            }
          }
          
          // Delete: 末尾で次の要素が装飾なら侵食を防ぐ
          if (e.key === 'Delete') {
            const textNode = originalNode;
            if (textNode.nodeType === Node.TEXT_NODE && range.startOffset === textNode.textContent.length) {
              // 最後のテキストノードかチェック
              const allTextNodes = [];
              const walker = document.createTreeWalker(directChild, NodeFilter.SHOW_TEXT, null, false);
              let n;
              while (n = walker.nextNode()) allTextNodes.push(n);
              
              if (allTextNodes.length > 0 && textNode === allTextNodes[allTextNodes.length - 1]) {
                const nextSibling = directChild.nextElementSibling;
                if (nextSibling && isDecorationElement(nextSibling)) {
                  e.preventDefault();
                  return;
                }
              }
            }
          }
        }
        
        // li要素内かどうかチェック
        let liElement = null;
        let current = node;
        while (current && current !== editor) {
          if (current.tagName === 'LI') {
            liElement = current;
            break;
          }
          current = current.parentNode;
        }
        
        // li要素がない場合、装飾ブロック内かチェック
        if (!liElement) {
          // ボタン要素内かチェック
          let buttonElement = null;
          current = node;
          while (current && current !== editor) {
            if (current.tagName === 'BUTTON') {
              buttonElement = current;
              break;
            }
            current = current.parentNode;
          }
          
          // ボタン内の先頭でBackspaceが押された場合、ボタン外への侵食を防ぐ
          if (buttonElement && e.key === 'Backspace' && range.collapsed && range.startOffset === 0) {
            // 現在のノードがボタンの最初のテキストノードかチェック
            let firstTextNode = null;
            const walker = document.createTreeWalker(buttonElement, NodeFilter.SHOW_TEXT, null, false);
            firstTextNode = walker.nextNode();
            
            if (firstTextNode && range.startContainer === firstTextNode) {
              // ボタンの先頭なので侵食を防ぐ
              e.preventDefault();
              return;
            }
          }
          
          // ボタン内の末尾でDeleteが押された場合、下の要素への侵食を防ぐ
          if (buttonElement && e.key === 'Delete' && range.collapsed) {
            const textNode = range.startContainer;
            if (textNode.nodeType === Node.TEXT_NODE && range.startOffset === textNode.textContent.length) {
              // 最後のテキストノードかチェック
              const allTextNodes = [];
              const walker = document.createTreeWalker(buttonElement, NodeFilter.SHOW_TEXT, null, false);
              let n;
              while (n = walker.nextNode()) allTextNodes.push(n);
              if (allTextNodes.length > 0 && textNode === allTextNodes[allTextNodes.length - 1]) {
                e.preventDefault();
                return;
              }
            }
          }
          
          // 装飾ブロック（吹き出し、BOX、枠など）を検出
          let decorationBlock = null;
          current = node;
          while (current && current !== editor) {
            if (current.tagName === 'DIV' && current.style) {
              // 吹き出し、BOX、枠などの装飾ブロックを検出
              const hasDecoration = current.style.background || 
                current.style.backgroundColor || 
                current.style.border || 
                current.style.borderRadius ||
                current.style.boxShadow ||
                current.style.padding ||
                (current.className && typeof current.className === 'string' && 
                 (current.className.includes('targetlist_') || current.className.includes('eisai-')));
              
              // エディタ直下の装飾ブロックかチェック
              if (hasDecoration && current.parentElement === editor) {
                decorationBlock = current;
                break;
              }
              // または親がエディタ直下の装飾ブロック
              if (hasDecoration && current.parentElement && current.parentElement.parentElement === editor) {
                decorationBlock = current.parentElement;
                break;
              }
            }
            current = current.parentNode;
          }
          
          // 装飾ブロック内の先頭でBackspaceが押された場合、ブロック外への侵食を防ぐ
          if (decorationBlock && e.key === 'Backspace' && range.collapsed) {
            // カーソル位置がブロックの先頭かチェック
            const blockRange = document.createRange();
            blockRange.selectNodeContents(decorationBlock);
            blockRange.collapse(true);
            
            // ブロックの先頭にカーソルがある場合
            if (range.startOffset === 0) {
              // 現在のノードがブロックの最初のテキストノードかチェック
              let firstTextNode = null;
              const walker = document.createTreeWalker(decorationBlock, NodeFilter.SHOW_TEXT, null, false);
              firstTextNode = walker.nextNode();
              
              if (firstTextNode && (range.startContainer === firstTextNode || 
                  (range.startContainer.nodeType !== Node.TEXT_NODE && 
                   decorationBlock.contains(range.startContainer)))) {
                // ブロックの先頭なので侵食を防ぐ
                e.preventDefault();
                return;
              }
            }
          }
          
          // 装飾ブロック内の末尾でDeleteが押された場合、下の要素への侵食を防ぐ
          if (decorationBlock && e.key === 'Delete' && range.collapsed) {
            const textNode = range.startContainer;
            if (textNode.nodeType === Node.TEXT_NODE && range.startOffset === textNode.textContent.length) {
              // 最後のテキストノードかチェック
              const allTextNodes = [];
              const walker = document.createTreeWalker(decorationBlock, NodeFilter.SHOW_TEXT, null, false);
              let n;
              while (n = walker.nextNode()) allTextNodes.push(n);
              if (allTextNodes.length > 0 && textNode === allTextNodes[allTextNodes.length - 1]) {
                e.preventDefault();
                return;
              }
            }
          }
          
          // data-list-converted属性を持つdivかチェック
          let convertedDiv = null;
          current = node;
          while (current && current !== editor) {
            if (current.tagName === 'DIV' && current.hasAttribute('data-list-converted')) {
              convertedDiv = current;
              break;
            }
            current = current.parentNode;
          }
          
          // 変換されたdivの先頭でBackspaceが押された場合
          if (convertedDiv && e.key === 'Backspace' && range.collapsed && range.startOffset === 0) {
            // 前の要素がタイトル（div/span/p）かチェック
            const prevSibling = convertedDiv.previousElementSibling;
            if (prevSibling && 
                (prevSibling.tagName === 'DIV' || prevSibling.tagName === 'SPAN' || prevSibling.tagName === 'P') && 
                (prevSibling.style.background || prevSibling.style.fontWeight === 'bold' || 
                 prevSibling.style.backgroundColor || prevSibling.style.position === 'absolute')) {
              // タイトルへの侵食を防ぐ
              e.preventDefault();
              return;
            }
            // 前の要素がない場合も侵食を防ぐ（リストボックスの先頭）
            if (!prevSibling) {
              e.preventDefault();
              return;
            }
            // 前の要素がul/olの場合も侵食を防ぐ
            if (prevSibling.tagName === 'UL' || prevSibling.tagName === 'OL') {
              e.preventDefault();
              return;
            }
          }
          
          return;
        }
        
        // li要素の先頭でBackspaceが押された場合
        if (e.key === 'Backspace' && range.collapsed && range.startOffset === 0) {
          // 最初のli要素かどうかチェック
          const ul = liElement.parentNode;
          if (ul && (ul.tagName === 'UL' || ul.tagName === 'OL')) {
            const isFirstLi = liElement === ul.firstElementChild;
            
            if (isFirstLi) {
              // 最初のliの場合、タイトルへの侵食を防ぐ
              e.preventDefault();
              
              const text = liElement.textContent;
              const nextLi = liElement.nextElementSibling;
              
              if (text.trim() === '') {
                // テキストが空の場合
                if (nextLi) {
                  // 次のliがあれば削除して次に移動
                  liElement.remove();
                  const newRange = document.createRange();
                  newRange.setStart(nextLi, 0);
                  newRange.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(newRange);
                }
                // 最後の1つなら削除しない
              } else {
                // テキストがある場合、liをul外のプレーンテキストに変換
                // ulの直前にdivとして挿入（パディングを維持）
                const div = document.createElement('div');
                div.textContent = text;
                div.style.padding = '15px 20px';
                div.setAttribute('data-list-converted', 'true');
                
                // ulの親要素（リストボックス）を取得
                let listBoxParent = ul.parentNode;
                
                // カスタムツールのリスト（targetlist_クラス）かチェック
                const isCustomList = listBoxParent.className && 
                  typeof listBoxParent.className === 'string' && 
                  listBoxParent.className.includes('targetlist_');
                
                // テーマのリストかチェック（親がdivでborderやbackgroundを持つ）
                const isThemeList = listBoxParent.tagName === 'DIV' && 
                  listBoxParent.style && 
                  (listBoxParent.style.border || listBoxParent.style.background || 
                   listBoxParent.style.backgroundColor || listBoxParent.style.borderRadius);
                
                if (isCustomList || isThemeList) {
                  // リストボックス内にulの直前に挿入
                  listBoxParent.insertBefore(div, ul);
                } else {
                  // その他の場合、ulの直前に挿入
                  listBoxParent.insertBefore(div, ul);
                }
                
                liElement.remove();
                
                // ulが空になったらul自体を削除
                if (ul.children.length === 0) {
                  ul.remove();
                } else {
                  // ulが残っている場合、ulの上パディングを調整
                  ul.style.paddingTop = '10px';
                }
                
                // カーソルをdivの先頭に移動
                const newRange = document.createRange();
                if (div.firstChild) {
                  newRange.setStart(div.firstChild, 0);
                } else {
                  newRange.setStart(div, 0);
                }
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
              }
            } else {
              // 最初のliでない場合、前のliと結合
              const prevLi = liElement.previousElementSibling;
              if (prevLi) {
                e.preventDefault();
                
                // 現在のliの内容を前のliに追加
                const prevTextLength = prevLi.textContent.length;
                prevLi.innerHTML += liElement.innerHTML;
                liElement.remove();
                
                // カーソルを結合位置に移動
                const textNode = prevLi.firstChild;
                if (textNode) {
                  const newRange = document.createRange();
                  if (textNode.nodeType === Node.TEXT_NODE) {
                    newRange.setStart(textNode, prevTextLength);
                  } else {
                    newRange.setStart(prevLi, 0);
                  }
                  newRange.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(newRange);
                }
              }
            }
          }
        }
        
        // li要素の末尾でDeleteが押された場合
        if (e.key === 'Delete' && range.collapsed) {
          const textNode = range.startContainer;
          const isAtEnd = textNode.nodeType === Node.TEXT_NODE && range.startOffset === textNode.textContent.length;
          
          if (isAtEnd) {
            const nextLi = liElement.nextElementSibling;
            if (nextLi && nextLi.tagName === 'LI') {
              e.preventDefault();
              
              // 次のliの内容を現在のliに追加
              liElement.innerHTML += nextLi.innerHTML;
              nextLi.remove();
            } else {
              // 最後のli要素の場合、下の要素への侵食を防ぐ
              e.preventDefault();
              return;
            }
          }
        }
      });
      
      // ブロック要素（リスト、枠、吹き出し）のダブルクリックで配置変更ダイアログを表示
      // ※見出し（横幅いっぱい）は除外
      editor.addEventListener('dblclick', async (e) => {
        // テーブルセルのダブルクリックで行・列操作メニューを表示
        let cellTarget = e.target;
        while (cellTarget && cellTarget !== editor) {
          if (cellTarget.tagName === 'TD' || cellTarget.tagName === 'TH') {
            const row = cellTarget.parentNode;
            const table = cellTarget.closest('table');
            if (table) {
              e.preventDefault();
              e.stopPropagation();
              showTableCellMenu(table, row, cellTarget, e.clientX, e.clientY);
              return;
            }
          }
          cellTarget = cellTarget.parentNode;
        }
        
        // クリックされた要素から配置変更可能なブロックを探す
        let target = e.target;
        let block = null;
        
        // 親要素を辿ってブロック要素を探す
        while (target && target !== editor) {
          // カスタムツールの枠・BOX/リスト（targetlist_クラス）は配置変更対象外
          if (target.className && typeof target.className === 'string' && target.className.includes('targetlist_')) {
            // カスタムツールのリストは配置変更しない
            return;
          }
          // fit-contentを持つdiv（リスト、枠、吹き出し）
          // ただしカスタムツールは除外
          if (target.style && target.style.width === 'fit-content') {
            // 親にtargetlist_クラスがあるかチェック
            let isCustomTool = false;
            let parent = target;
            while (parent && parent !== editor) {
              if (parent.className && typeof parent.className === 'string' && parent.className.includes('targetlist_')) {
                isCustomTool = true;
                break;
              }
              parent = parent.parentElement;
            }
            if (isCustomTool) {
              return;
            }
            block = target;
            break;
          }
          // border や background を持つdiv（枠・BOX）
          // ただし横幅いっぱい（見出し）は除外
          if (target.tagName === 'DIV' && target.style && 
              (target.style.border || target.style.background || target.style.backgroundColor || 
               target.style.boxShadow || target.style.borderRadius)) {
            // 横幅いっぱいの要素（見出し）は除外
            const width = target.style.width;
            if (width === '100%' || width === '' || width === 'auto') {
              // 見出しの可能性が高いのでスキップ
              target = target.parentElement;
              continue;
            }
            // エディタ直下の子要素、または明らかなブロック要素
            if (target.parentElement === editor || target.style.padding || target.style.margin) {
              block = target;
              break;
            }
          }
          target = target.parentElement;
        }
        
        if (!block) return;

        // 見出し（横幅いっぱい）は配置変更しない
        const blockWidth = block.style.width;
        if (!blockWidth || blockWidth === '100%' || blockWidth === 'auto') {
          return;
        }

        // v0.11.0 P1 C4d: 単語のダブルクリック（部分選択）ではダイアログを開かない。
        // ブロック全体が選択されている場合、またはテキスト選択がない場合のみ開く。
        const dblSel = window.getSelection();
        if (dblSel && dblSel.rangeCount > 0 && !dblSel.getRangeAt(0).collapsed) {
          const selectedText = dblSel.toString();
          const blockText = block.textContent || '';
          if (selectedText.trim() !== '' && selectedText.trim() !== blockText.trim()) {
            return;
          }
        }

        // 配置選択ダイアログを表示
        const alignment = await showListAlignmentDialog();
        // v0.11.0 P1 C4d: キャンセル（null）の場合は何も変更しない
        if (alignment === null) {
          editor.focus();
          return;
        }

        // width: fit-content を設定（まだ設定されていない場合）
        if (!block.style.width || block.style.width === 'auto' || block.style.width === '100%') {
          block.style.width = 'fit-content';
        }
        
        // 配置を適用
        const currentMargin = block.style.margin || '';
        const marginMatch = currentMargin.match(/^(\d+(?:\.\d+)?(?:em|px)?)/);
        const topMargin = marginMatch ? marginMatch[1] : '1em';
        
        switch (alignment) {
          case 'left':
            block.style.margin = `${topMargin} auto ${topMargin} 0`;
            break;
          case 'right':
            block.style.margin = `${topMargin} 0 ${topMargin} auto`;
            break;
          case 'center':
          default:
            block.style.margin = `${topMargin} auto`;
            break;
        }
        
        editor.focus();
      });

      // 基本書式ツールバー（SVGアイコン）（v0.12.0 E2-1: .tb-groupで区切りをボーダー化し、
      // eisai-toolbar-separator は使わずグループの外枠で視覚的にまとめる）
      const tbGroupHistory = createEl('div', { className: 'tb-group' }, row1Toolbar);
      const undoBtn = createIconButton(tbGroupHistory, editor, '元に戻す (Ctrl/Cmd+Z)', ICONS.undo, () => {
        editor.focus();
        EditorHistory.undo();
      });
      const redoBtn = createIconButton(tbGroupHistory, editor, 'やり直し (Ctrl/Cmd+Shift+Z, Ctrl+Y)', ICONS.redo, () => {
        editor.focus();
        EditorHistory.redo();
      });
      // v0.13.0: ボタンの有効/無効はEditorHistoryが commit/undo/redo のたびに切り替える
      EditorHistory.setButtons(undoBtn, redoBtn);

      const tbGroupFormat = createEl('div', { className: 'tb-group' }, row1Toolbar);
      // 太字: フォントサイズ用の span 内でも確実に効くように、CSS ベースで適用
      createIconButton(tbGroupFormat, editor, '太字', ICONS.bold, () => {
        editor.focus();
        try {
          document.execCommand('styleWithCSS', false, true);
        } catch (e) {}
        document.execCommand('bold');
        try {
          document.execCommand('styleWithCSS', false, false);
        } catch (e) {}
      });
      createIconButton(tbGroupFormat, editor, '斜体', ICONS.italic, () => document.execCommand('italic'));
      createIconButton(tbGroupFormat, editor, '下線', ICONS.underline, () => document.execCommand('underline'));
      createIconButton(tbGroupFormat, editor, '取り消し線', ICONS.strikethrough, () => document.execCommand('strikeThrough'));

      const tbGroupAlign = createEl('div', { className: 'tb-group' }, row1Toolbar);
      createIconButton(tbGroupAlign, editor, '左揃え', ICONS.alignLeft, () => document.execCommand('justifyLeft'));
      createIconButton(tbGroupAlign, editor, '中央揃え', ICONS.alignCenter, () => document.execCommand('justifyCenter'));
      createIconButton(tbGroupAlign, editor, '右揃え', ICONS.alignRight, () => document.execCommand('justifyRight'));

      // サイズ・文字色・背景色・マーカーは1つのグループにまとめる
      const tbGroupStyle = createEl('div', { className: 'tb-group' }, row1Toolbar);

      // 文字サイズ（v0.12.0 E2-1: 1行に収めるためアイコンのみ表示。ラベルはtitle属性へ）
      const sizeDropdown = createDropdown(tbGroupStyle, '', (menu) => {
        // メニューが全項目見えるように高さ制限を解除し、幅もなりゆきにする

          { val: 3, label: '3 (標準)', px: '16px' },
          { val: 4, label: '4 (大)', px: '18px' },
          { val: 5, label: '5 (特大)', px: '24px' },
          { val: 6, label: '6 (超特大)', px: '32px' },

        sizes.forEach(sizeDef => {
          const item = createEl('button', { className: 'eisai-drop-item' }, menu);
          item.textContent = sizeDef.label;
          // 実際のサイズで表示（ボタン自体のスタイルを上書き）
          item.style.fontSize = sizeDef.px;
          item.onmousedown = (e) => e.preventDefault();
          item.onclick = () => {
            restoreSavedRange(editor);
            editor.focus();
            applyFontSize(sizeDef.val);
            EditorHistory.commit();
            menu.classList.remove('show');
          };
        });
      }, ICONS.fontSize);
      const sizeBtn = sizeDropdown.querySelector('.eisai-dropdown-btn');
      if (sizeBtn) sizeBtn.title = 'サイズ';

      // スタイルツールバー（文字色・背景色・マーカー）
      createColorPicker(tbGroupStyle, 'text');
      createColorPicker(tbGroupStyle, 'bg');
      createColorPicker(tbGroupStyle, 'marker');

      // ========================================
      // v0.13.0 P2: 「パーツの色」ボタン＋ポップオーバー
      // カーソル位置の [data-part] 要素だけ、背景／アクセント／文字／線を個別に変更できる。
      // ========================================
      const partColorBtn = createEl('button', { className: 'eisai-dropdown-btn' }, tbGroupStyle);
      partColorBtn.type = 'button';
      partColorBtn.innerHTML = ICONS.paintDrop;
      partColorBtn.title = 'パーツの色';

      // 既存の「eisai-color-popup」パターン（position:fixed・bodyへ直付け・表示切替はdisplay）を再利用。
      // クラスに eisai-color-popup も含めることで、他のドロップダウンを開いたときに
      // 一緒に閉じる／リサイズ時に一緒にクランプされる既存の仕組みにも乗る。
      const partColorPopup = createEl('div', { className: 'eisai-color-popup eisai-part-color-popup' });
      partColorPopup.style.cssText = `
        position: fixed;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        z-index: 10002;
        padding: 16px;
        display: none;
        min-width: min(320px, calc(100vw - 32px));
        max-width: min(360px, calc(100vw - 32px));
        max-height: 70vh;
        overflow: auto;
      `;
      document.body.appendChild(partColorPopup);

      let partColorTargetEl = null;
      let partColorActiveRole = null;
      // v0.13.0: 色の変更ごとにEditorHistoryへ確定する（chipクリックのcoalesceKeyで
      // 「同じ対象への連打」は1手にまとめる）。旧v0.13.0 P2の独自スナップショット
      // ＋ポップオーバー限定⌘Z横取りは、EditorHistoryへの統合により不要になったため削除した。

      function partColorMakeChip(container, hex, title, onPick) {
        const chip = createEl('button', {}, container);
        chip.type = 'button';
        chip.title = title;
        chip.style.cssText = `width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0;cursor:pointer;background:${hex};flex:none;`;
        chip.onmousedown = (e) => e.preventDefault();
        chip.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          onPick(hex);
        };
        return chip;
      }

      function partColorPick(color) {
        if (!partColorTargetEl || !partColorActiveRole || !editor.contains(partColorTargetEl)) return;
        applyPartColor(partColorTargetEl, partColorActiveRole, color);
        markUnsavedChange();
        // v0.13.0: 同じパーツ・同じロールへの連続クリック（1秒以内）は1手にまとめる
        EditorHistory.commit('partColor', {
          coalesceKey: EditorHistory.keyForElement(partColorTargetEl, partColorActiveRole)
        });
      }

      function renderPartColorPopover() {
        partColorPopup.innerHTML = '';

        const header = createEl('div', {}, partColorPopup);
        header.style.cssText = 'font-size:14px;font-weight:700;color:#374151;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e5e7eb;';

        // キャレットが [data-part] の外にある場合：ガイダンスのみ表示し、他の操作は出さない
        if (!partColorTargetEl || !editor.contains(partColorTargetEl)) {
          header.textContent = '色を変えるパーツの中にカーソルを置いてください';
          return;
        }

        const partKey = partColorTargetEl.getAttribute('data-part') || '';
        header.textContent = PART_COLOR_LABELS[partKey] || partKey;

        // このパーツに実在するロールだけをターゲットの選択肢にする
        const availableRoles = PART_COLOR_ROLE_DEFS.filter((r) => getPartRoleElements(partColorTargetEl, r.role).length > 0);
        if (!availableRoles.length) {
          const msg = createEl('div', {}, partColorPopup, 'このパーツには変更できる色がありません。');
          msg.style.cssText = 'font-size:13px;color:#6b7280;';
          return;
        }
        if (!partColorActiveRole || !availableRoles.some((r) => r.role === partColorActiveRole)) {
          partColorActiveRole = availableRoles[0].role;
        }

        // ターゲット（背景／アクセント／文字／線）セグメントコントロール
        const segment = createEl('div', {}, partColorPopup);
        segment.style.cssText = 'display:flex;gap:4px;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:14px;';
        availableRoles.forEach((r) => {
          const segBtn = createEl('button', {}, segment, r.label);
          segBtn.type = 'button';
          const isActive = r.role === partColorActiveRole;
          segBtn.style.cssText = 'flex:1;padding:6px 4px;font-size:12px;border:none;border-radius:6px;cursor:pointer;' +
            'transition:all .15s ease;font-weight:' + (isActive ? '600' : '500') + ';' +
            'background:' + (isActive ? '#1f2937' : 'transparent') + ';color:' + (isActive ? '#fff' : '#4b5563') + ';';
          segBtn.onmousedown = (e) => e.preventDefault();
          segBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            partColorActiveRole = r.role;
            renderPartColorPopover();
            clampPopupToViewport(partColorPopup);
          };
          segment.appendChild(segBtn);
        });

        const theme = getTheme(currentTheme);
        const tokens = (theme && theme.tokens) || {};

        // (a) このテーマの色（9トークン）
        const themeLabel = createEl('div', {}, partColorPopup, 'このテーマの色');
        themeLabel.style.cssText = 'font-size:11px;color:#9ca3af;margin-bottom:6px;';
        const themeRow = createEl('div', {}, partColorPopup);
        themeRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;';
        ['hero', 'soft', 'decor', 'accent', 'cta', 'ink', 'muted', 'paper', 'line'].forEach((tk) => {
          const hex = tokens[tk];
          if (!hex) return;
          partColorMakeChip(themeRow, hex, tk + ' (' + hex + ')', partColorPick);
        });

        // (b) 他のテーマから（12テーマ × accent/soft = 24チップ）
        const otherLabel = createEl('div', {}, partColorPopup, '他のテーマから');
        otherLabel.style.cssText = 'font-size:11px;color:#9ca3af;margin-bottom:6px;';
        const otherRow = createEl('div', {}, partColorPopup);
        otherRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;max-height:112px;overflow-y:auto;';
        (window.THEME_TOKENS_V3 || []).forEach((t) => {
          ['accent', 'soft'].forEach((tk) => {
            const hex = t.tokens && t.tokens[tk];
            if (!hex) return;
            partColorMakeChip(otherRow, hex, t.number + ' ' + t.name + ' ・ ' + tk + ' (' + hex + ')', partColorPick);
          });
        });

        // (c) 自由に選ぶ
        const freeRow = createEl('div', {}, partColorPopup);
        freeRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:14px;';
        const freeLabel = createEl('span', {}, freeRow, '自由に選ぶ');
        freeLabel.style.cssText = 'font-size:12px;color:#4b5563;';
        const freeInput = document.createElement('input');
        freeInput.type = 'color';
        freeInput.style.cssText = 'width:34px;height:26px;border:1px solid #e5e7eb;border-radius:6px;padding:0;cursor:pointer;';
        freeInput.oninput = () => partColorPick(freeInput.value);
        freeRow.appendChild(freeInput);

        // (d) テーマの色に戻す
        const resetBtn = createEl('button', {}, partColorPopup, 'テーマの色に戻す');
        resetBtn.type = 'button';
        resetBtn.style.cssText = 'width:100%;padding:8px 10px;font-size:12px;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#374151;cursor:pointer;';
        resetBtn.onmousedown = (e) => e.preventDefault();
        resetBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!partColorTargetEl || !editor.contains(partColorTargetEl)) return;
          const def = defaultRoleColor(partKey, partColorActiveRole, tokens, partColorTargetEl);
          applyPartColor(partColorTargetEl, partColorActiveRole, def);
          const attrKey = 'color' + partColorActiveRole.charAt(0).toUpperCase() + partColorActiveRole.slice(1);
          delete partColorTargetEl.dataset[attrKey];
          markUnsavedChange();
          EditorHistory.commit('partColorReset');
        };
      }

      function closePartColorPopover() {
        partColorPopup.style.display = 'none';
      }

      function openPartColorPopover() {
        // 他に開いているドロップダウン・色ポップアップを閉じる
        document.querySelectorAll('.eisai-dropdown-menu.show').forEach((m) => m.classList.remove('show'));
        document.querySelectorAll('.eisai-color-popup').forEach((p) => { if (p !== partColorPopup) p.style.display = 'none'; });

        partColorTargetEl = getCaretPartEl(editor);

        partColorPopup.style.display = 'block';

      partColorBtn.onmousedown = (e) => e.preventDefault();
      partColorBtn.onclick = (e) => {

          closePartColorPopover();

      document.addEventListener('click', (e) => {

        closePartColorPopover();

      // ========================================
      // v0.13.0: 「リンク編集」ボタン — カタログパーツ等で挿入した<a>のリンク先URL／
      // （画像リンクなら）画像URLを、挿入後にあらためて編集できるようにする。
      // キャレット/選択が<a>の中、または<a>を1つだけ含むカード（[data-part]）の中に

      // ========================================
      const linkEditBtn = createEl('button', { className: 'eisai-btn' }, tbGroupStyle);
      linkEditBtn.type = 'button';
      linkEditBtn.innerHTML = ICONS.linkEdit;
      linkEditBtn.title = 'リンク編集';

      function updateLinkEditButtonState() {
        linkEditBtn.disabled = !getCaretLinkContext(editor);
      }
      updateLinkEditButtonState();
      document.addEventListener('selectionchange', () => {
        // エディタ内に選択があるときだけ判定する（他要素へフォーカスが移っても状態を壊さない）
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
