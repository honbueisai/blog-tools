      async function openLinkEditForCaret() {
        restoreSavedRange(editor);
        editor.focus();
        const linkCtx = getCaretLinkContext(editor);
        if (!linkCtx) {
          showToast('リンク（<a>）の中にカーソルを置いてください', 'info');
          return;
        }
        const applied = await openLinkEditDialog(editor, linkCtx);
        if (applied) markUnsavedChange();
        updateLinkEditButtonState();
      }

      linkEditBtn.onmousedown = (e) => e.preventDefault();
      linkEditBtn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        openLinkEditForCaret();
      };

      // カタログパーツ内の<a>をダブルクリックしても同じダイアログを開く
      editor.addEventListener('dblclick', (e) => {
        const a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a || !editor.contains(a)) return;
        if (!a.closest('[data-part="catalog"]')) return;
        e.preventDefault();
        openLinkEditDialog(editor, { anchor: a, root: a.closest('[data-part="catalog"]') }).then((applied) => {
          if (applied) markUnsavedChange();
          updateLinkEditButtonState();
        });
      });

      // 書式クリアボタン（単独グループ）
      const tbGroupClear = createEl('div', { className: 'tb-group' }, row1Toolbar);
      const clearBtn = createEl('button', { className: 'eisai-dropdown-btn' }, tbGroupClear);
      // v0.12.0 E2-1: 1行に収めるためアイコンのみ表示。ラベルはtitle属性へ
      clearBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      clearBtn.title = '装飾を外す';
      clearBtn.onmousedown = (e) => e.preventDefault();
      clearBtn.onclick = () => {
        editor.focus();
        clearFormatting(editor);
        EditorHistory.commit();
      };

      // 全クリアボタン（装飾をすべて削除してテキストのみ・単独の危険操作グループ）
      const tbGroupDanger = createEl('div', { className: 'tb-group' }, row1Toolbar);
      const allClearBtn = createEl('button', { className: 'btn-danger-ghost' }, tbGroupDanger);
      allClearBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"/></svg>全装飾を外す';
      allClearBtn.title = '装飾をすべて削除してテキストのみ';
      allClearBtn.onmousedown = (e) => e.preventDefault();
      allClearBtn.onclick = () => {
        if (!confirm('装飾をすべて外して平文にします。元に戻せません。よろしいですか？')) return;
        editor.focus();

        // 元に戻せない操作のため、装飾解除前の状態を履歴へ自動退避しておく
        try {
          const currentTitle = (typeof getDraftTitle === 'function') ? getDraftTitle() : '';
          let currentHtml = (typeof getPlaygroundHtml === 'function') ? getPlaygroundHtml() : editor.innerHTML;
          if (currentTitle && currentHtml && currentHtml.trim() && typeof Drafts !== 'undefined') {
            if (typeof stripExtensionInjectedNodes === 'function') {
              currentHtml = stripExtensionInjectedNodes(currentHtml);
            }
            // 「現在編集中」の履歴は上書きせず、別エントリとしてスナップショット保存する
            const savedCurrentId = Drafts.getCurrentId();
            Drafts.clearCurrentId();
            const snap = Drafts.saveOrUpdate(currentTitle + '（装飾解除前）', currentHtml);
            Drafts.setCurrentId(savedCurrentId);
            if (!snap && typeof setDraftStatus === 'function') {
              setDraftStatus('⚠️ 装飾解除前のスナップショット保存に失敗しました', 'error');
            }
            if (typeof renderDraftList === 'function') renderDraftList();
          }
        } catch (e) {
          console.warn('[Eisai] 装飾解除前スナップショットに失敗:', e);
        }

        // 全クリア機能：装飾をすべて削除してテキストと改行のみ
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = editor.innerHTML;

        // トップレベルのブロックのみを1回ずつ処理する（子孫要素まで再帰的に
        // querySelectorAll していた旧実装は、入れ子のdiv/pを何重にも拾って
        // 同じテキストが重複する不具合と O(n×depth) の無駄な走査を招いていた）
        const topBlocks = Array.from(tempDiv.children);

        // v0.13.0: data-cta-protected ブロックは、テーマ適用時などと同様に
        // テキスト化の対象から除外し、リンク（href）と表示をそのまま残す。
        // 除外しないと申込枠のCTAリンクが plain text 化され、クリックできなくなってしまう。
        const parts = [];
        if (topBlocks.length > 0) {
          topBlocks.forEach((el) => {
            if (el.hasAttribute && el.hasAttribute('data-cta-protected')) {
              parts.push({ raw: true, value: el.outerHTML });
              return;
            }
            const text = el.textContent || el.innerText || '';
            if (text.trim()) {
              parts.push({ raw: false, value: text.trim() });
            }
          });
        } else {
          // ブロック要素がない場合は全体のテキストを使用
          const text = tempDiv.innerText || tempDiv.textContent || '';
          if (text.trim()) parts.push({ raw: false, value: text.trim() });
        }

        // 段落間は2行改行（<br><br>）で連結。テキスト部分のみ改行を<br>に変換する
        const finalHtml = parts
          .map((p) => (p.raw ? p.value : p.value.replace(/\n{3,}/g, '\n\n').replace(/\n/g, '<br>')))
          .join('<br><br>');

        // プレーンテキスト（＋保護されたCTAブロック）をエディタに設定
        editor.innerHTML = finalHtml;
        EditorHistory.commit();
      };

      // 装飾ツールバー（順番: 見出し→枠・BOX→吹き出し→ボタン→リスト）
      // カスタムモード用のカテゴリコンテナ
      const categoryContainer = createEl('div', { className: 'eisai-category-container' }, row2Toolbar);
      categoryContainer.style.display = 'none'; // 初期状態は非表示（プリセットモード）

      // クラシック（従来のMOCA）：見出し／枠・BOX／吹き出し／ボタン／リスト＋挿入
      function renderClassicDropdowns() {
        const categories = [
          { key: 'heading', label: '見出し', icon: ICONS.heading },
          { key: 'box',     label: '枠・BOX', icon: ICONS.box },
          { key: 'bubble',  label: '吹き出し', icon: ICONS.bubble },
          { key: 'button',  label: 'ボタン', icon: ICONS.button },
          { key: 'list',    label: 'リスト', icon: ICONS.list }
        ];

        categories.forEach((cat) => {
          // 第5引数としてカテゴリキーを渡すことで、プレビュー・適用処理の双方で正しいカテゴリを使えるようにする
          createPreviewDropdown(categoryContainer, cat.label, DESIGNS[cat.key].items, cat.icon, cat.key);
        });

        // 挿入ドロップダウン（装飾の後ろ）
        createDropdown(categoryContainer, '挿入', (menu) => {
          Object.values(DESIGNS.insert.items).forEach((item) => {
            const b = createEl('button', { className: 'eisai-drop-item' }, menu, item.label);
            b.onmousedown = (e) => e.preventDefault();
            b.onclick = (e) => {
              e.preventDefault();
              applyBlock(editor, 'insert', item);
              menu.classList.remove('show');
            };
          });
        }, ICONS.table);
      }

      // ニュー（承認済み47パーツカタログ）：グループ（A〜I）ごとにドロップダウンを1つ生成
      function renderCatalogDropdowns() {
        (window.CATALOG_GROUPS || []).forEach((g) => {
          const items = (window.PARTS_CATALOG_V2 || []).filter((p) => p.group === g.key);
          if (!items.length) return;
          createCatalogGroupDropdown(categoryContainer, editor, g.label, items);
        });
      }

      // v0.13.0: セット（ニュー／クラシック）切替時、カテゴリコンテナの内容を丸ごと差し替える
      function renderCustomModeDropdowns() {
        categoryContainer.innerHTML = '';
        if (customSet === 'classic') {
          renderClassicDropdowns();
        } else {
          renderCatalogDropdowns();
        }
      }
      renderCustomModeDropdowns();

      return {
        setContent(content) {
          _suppressUnsavedMark = true;
          editor.innerHTML = content;
          setTimeout(() => { _suppressUnsavedMark = false; }, 0);
        },
        getHtml() {
          return editor.innerHTML;
        },
        focus() {
          editor.focus();
        }
      };
    }

    // === すべてのインライン装飾要素に!importantを追加する汎用関数 ===
    function preserveInlineFormatting(element) {
      // 処理する装飾要素のセレクタ（li要素は除外してリストスタイルを保護）
      const formattingSelectors = [
        'strong', 'b', 'em', 'i', 'u', 's', 'del', 'mark',
        'span[style*="color"]', 'span[style*="background"]', 'span[style*="font-weight"]',
        'span[style*="font-style"]', 'span[style*="text-decoration"]',
        // table/blockquote/pre/code はコピー時にインラインスタイルを付与するため（B6）、
        // CMS側の素のCSSに負けないよう他の装飾要素と同じく!important化の対象にする
        'table', 'th', 'td', 'blockquote', 'pre', 'code'
      ];
      
      formattingSelectors.forEach(selector => {
        const elements = element.querySelectorAll(selector);
        elements.forEach(el => {
          // li要素は処理しない（リストスタイルを保護）
          if (el.tagName === 'LI') {
            return;
          }
          
          const existingStyle = el.getAttribute('style') || '';
          if (existingStyle) {
            // 既存のスタイルを個別に処理してすべてのプロパティに!importantを追加
            const properties = existingStyle.split(';').filter(prop => prop.trim());
            const newProperties = properties.map(prop => {
              const trimmed = prop.trim();
              if (trimmed) {
                // 既に!importantがあっても、すべてのプロパティに明示的に追加
                if (trimmed.includes('!important')) {
                  return trimmed;
                } else {
                  return trimmed + ' !important';
                }
              }
              return trimmed;
            });
            el.setAttribute('style', newProperties.join('; ') + (newProperties.length > 0 ? ';' : ''));
          } else {
            // スタイルがない要素にはデフォルトスタイルを追加
            switch (el.tagName) {
              case 'STRONG':
              case 'B':
                el.setAttribute('style', 'font-weight: bold !important;');
                break;
              case 'EM':
              case 'I':
                el.setAttribute('style', 'font-style: italic !important;');
                break;
              case 'U':
                el.setAttribute('style', 'text-decoration: underline !important;');
                break;
              case 'S':
              case 'DEL':
                el.setAttribute('style', 'text-decoration: line-through !important;');
                break;
              case 'MARK':
                el.setAttribute('style', 'background-color: yellow !important; color: black !important;');
                break;
            }
          }
        });
      });
      
      // ブログシステムがstrongをspanに変換することを考慮し、
      // 予防的にspan要素にもfont-weightを設定（li内のspanは除外）
      const allSpans = element.querySelectorAll('span');
      allSpans.forEach(span => {
        // li要素内のspanは処理しない
        if (span.closest('li')) {
          return;
        }
        
        const existingStyle = span.getAttribute('style') || '';
        if (!existingStyle.includes('font-weight') && 
            (span.textContent.includes('**') || span.parentElement.tagName === 'STRONG')) {
          // 太字っぽいspanにはfont-weightを追加
          span.setAttribute('style', existingStyle + (existingStyle ? '; ' : '') + 'font-weight: bold !important;');
        }
      });
    }

    // === テーマクラスをインラインスタイルに変換する関数 ===
    // エディタ内CSSと同じスタイルをインラインで出力する
    function convertThemeClassesToInlineStyles(html) {
      // 一時的なdivを作成してHTMLを解析
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;

      // 現在選択中のテーマを取得（要素にdata-themeが見つからない場合のフォールバック用）
      // v0.13.0: getTheme() 経由で旧テーマキー（business-blue等）もLEGACY_THEME_MAPで解決する
      const themeSelector = document.querySelector('.theme-selector');
      const selectedTheme = themeSelector ? themeSelector.value : 'girly-pink';
      const theme = (typeof getTheme === 'function') ? getTheme(selectedTheme) : window.PRESET_THEMES[selectedTheme];

      if (!theme) {
        console.warn('テーマが見つかりません:', selectedTheme);
        return html;
      }

      // 表示（addThemeStyles）と一致させるため、要素ごとに直近の data-theme から
      // 適用すべきテーマを解決する。無ければ選択中テーマにフォールバック (v0.11.0 B9)
      // v0.13.0: data-theme が旧テーマキーの場合も getTheme() で新テーマへ解決する
      const resolveElTheme = (el) => {
        try {
          const dt = el.closest && el.closest('[data-theme]');
          const name = dt ? dt.getAttribute('data-theme') : null;
          return (name && typeof getTheme === 'function' && getTheme(name)) || theme;
        } catch (e) {
          return theme;
        }
      };

      // 見出し系のみ対象：中身が丸ごと1つのdiv/pだけでラップされている場合に限り
      // そのラッパーだけを剥がす（<strong>/<a>/<br>等のインライン書式は保持する）(v0.11.0 B4)
      const stripHeadingWrapper = (innerHtml) => {
        const wrap = document.createElement('div');
        wrap.innerHTML = innerHtml;
        let guard = 0;
        while (wrap.childNodes.length === 1 && wrap.firstChild.nodeType === 1 &&
               /^(div|p)$/i.test(wrap.firstChild.tagName) && guard < 5) {
          wrap.innerHTML = wrap.firstChild.innerHTML;
          guard++;
        }
        return wrap.innerHTML;
      };

      // 標準的なH2/H3タグをテーマスタイルに変換
      tempDiv.querySelectorAll('h2').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = stripHeadingWrapper(el.innerHTML);
        el.outerHTML = `<div style="background: ${elTheme.lightColor} !important; border-left: 5px solid ${elTheme.color} !important; padding: 15px 20px !important; font-size: 120% !important; font-weight: bold !important; margin: 20px 0 !important; line-height: 1.8 !important;">${text}</div>`;
      });

      tempDiv.querySelectorAll('h3').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = stripHeadingWrapper(el.innerHTML);
        el.outerHTML = `<div style="color: ${elTheme.color} !important; font-size: 105% !important; font-weight: bold !important; margin: 15px 0 !important; padding: 8px 0 !important; border-bottom: 2px solid ${elTheme.subColor} !important; padding-left: 10px !important; line-height: 1.8 !important;">${text}</div>`;
      });

      // テーマ見出しを変換 - エディタ内CSSと同じデザイン
      // エディタCSS: background: #ebf5fb; border-left: 5px solid #2980b9; padding: 15px 20px; font-size: 120%; font-weight: bold; margin: 20px 0;
      tempDiv.querySelectorAll('.theme-heading').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = stripHeadingWrapper(el.innerHTML);
        el.outerHTML = `<div style="background: ${elTheme.lightColor}; border-left: 5px solid ${elTheme.color}; padding: 15px 20px; font-size: 120%; font-weight: bold; margin: 20px 0;">${text}</div>`;
      });

      // テーマサブ見出しを変換 - H3用の軽量なデザイン
      tempDiv.querySelectorAll('.theme-subheading').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = stripHeadingWrapper(el.innerHTML);
        el.outerHTML = `<div style="color: ${elTheme.color} !important; font-size: 110% !important; font-weight: 600 !important; margin: 15px 0 !important; padding: 8px 0 !important; border-bottom: 3px solid ${elTheme.color} !important; padding-left: 10px !important;">${text}</div>`;
      });

      // テーマ吹き出し（右）を変換 - 右寄せ + 吹き出し口（右側に三角形）
      tempDiv.querySelectorAll('.theme-bubble-right').forEach(el => {
        const elTheme = resolveElTheme(el);
        // 空の装飾用tailスパンだけを除去し、文字を持つspan（太字/マーカー等の装飾）は保持する (v0.11.0 B5)
        const tempContainer = document.createElement('div');
        tempContainer.innerHTML = el.innerHTML;
        tempContainer.querySelectorAll(':scope > span').forEach(s => {
          if (!s.textContent.trim() && !s.children.length) s.remove();
        });
        const text = tempContainer.innerHTML;
        // 右寄せ + 吹き出し口を右側に配置 + 右側余白を追加（margin-right: 30px）
        el.outerHTML = `<div style="text-align: right; margin: 1em 0;"><div style="display: inline-block; position: relative; background: ${elTheme.lightColor}; color: #154360; border-radius: 20px; padding: 12px 16px; max-width: 80%; line-height: 1.6; text-align: left; margin-right: 30px;">${text}<span style="position: absolute; right: -16px; top: 50%; transform: translateY(-50%); border: 10px solid transparent; border-left: 16px solid ${elTheme.lightColor};"></span></div></div>`;
      });

      // テーマ吹き出し（左）を変換 - 左寄せ + 吹き出し口（左側に三角形）
      tempDiv.querySelectorAll('.theme-bubble-left').forEach(el => {
        const elTheme = resolveElTheme(el);
        // 空の装飾用tailスパンだけを除去し、文字を持つspan（太字/マーカー等の装飾）は保持する (v0.11.0 B5)
        const tempContainer = document.createElement('div');
        tempContainer.innerHTML = el.innerHTML;
        tempContainer.querySelectorAll(':scope > span').forEach(s => {
          if (!s.textContent.trim() && !s.children.length) s.remove();
        });
        const text = tempContainer.innerHTML;
        // 左寄せ + 吹き出し口を左側に配置
        el.outerHTML = `<div style="text-align: left; margin: 1em 0;"><div style="display: inline-block; position: relative; background: ${elTheme.color}; color: #fff; border-radius: 20px; padding: 12px 16px; max-width: 80%; line-height: 1.6; text-align: left; margin-left: 20px;">${text}<span style="position: absolute; left: -16px; top: 50%; transform: translateY(-50%); border: 10px solid transparent; border-right: 16px solid ${elTheme.color};"></span></div></div>`;
      });

      // テーマボックスを変換 - エディタ内CSSと同じデザイン
      // エディタCSS: border: 1px solid #2980b9; border-radius: 4px; padding: 20px; margin: 1em 0;
      tempDiv.querySelectorAll('.theme-box').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = el.innerHTML;
        el.outerHTML = `<div style="border: 1px solid ${elTheme.color}; border-radius: 4px; padding: 20px; margin: 1em 0;">${text}</div>`;
      });

      // テーマボタンを変換 - エディタ内CSSと同じデザイン
      // エディタCSS: display: block; margin: 20px auto; padding: 12px 30px; background: #2980b9; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
      tempDiv.querySelectorAll('.theme-button').forEach(el => {
        const elTheme = resolveElTheme(el);
        const text = el.innerHTML;
        const url = el.getAttribute('onclick')?.match(/location\.href='([^']*)'/)?.[1] || '#';
        el.outerHTML = `<a href="${url}" style="display: block; margin: 20px auto; padding: 12px 30px; background: ${elTheme.color}; color: #fff; border: none; border-radius: 4px; font-weight: bold; text-decoration: none; text-align: center; max-width: 300px;">${text}</a>`;
      });

      // テーマリストを変換 - エディタ内CSSと同じデザイン
      // エディタCSS: border: 2px solid #2980b9; border-radius: 6px; margin: 1em 0; overflow: hidden;
      // タイトル: background: #2980b9; color: #fff; padding: 8px 15px; font-weight: bold;
      // ul: margin: 0; padding: 15px 15px 15px 35px;
      tempDiv.querySelectorAll('.theme-list').forEach(el => {
        const elTheme = resolveElTheme(el);
        const titleEl = el.querySelector('.theme-list-title');
        const listEl = el.querySelector('ul');

        if (titleEl && listEl) {
          const title = titleEl.textContent || titleEl.innerHTML;
          // 各li要素に箇条書きスタイルを設定
          const liElements = listEl.querySelectorAll('li');
          liElements.forEach(li => {
            li.setAttribute('style', 'display: list-item !important; list-style-type: disc !important; list-style-position: inside !important; margin-bottom: 8px !important; line-height: 1.8 !important;');

            // li内のstrongタグにもインラインスタイルを追加して太字を強制
            const strongElements = li.querySelectorAll('strong');
            strongElements.forEach(strong => {
              strong.setAttribute('style', 'font-weight: bold !important;');
            });
          });
          const items = listEl.innerHTML;
          el.outerHTML = `<div style="border: 2px solid ${elTheme.color}; border-radius: 6px; margin: 1em 0; overflow: hidden;"><div style="background: ${elTheme.color}; color: #fff; padding: 8px 15px; font-weight: bold; margin: 0;">${title}</div><ul style="margin: 0; padding: 15px 20px 15px 40px; list-style: none; line-height: 1.8;">${items}</ul></div>`;
        }
      });

      // すべてのul要素にリストスタイルを適用（テーマリスト以外も対応）
      tempDiv.querySelectorAll('ul').forEach(listEl => {
        // テーマリスト内のulは除外（既に処理済み）
        if (listEl.closest('.theme-list')) {
          return;
        }

        // 各li要素に箇条書きスタイルを設定
        const liElements = listEl.querySelectorAll('li');
        liElements.forEach(li => {
          li.setAttribute('style', 'display: list-item !important; list-style-type: disc !important; list-style-position: inside !important; margin-bottom: 8px !important; line-height: 1.8 !important;');

          // li内のstrongタグにもインラインスタイルを追加
          const strongElements = li.querySelectorAll('strong');
          strongElements.forEach(strong => {
            strong.setAttribute('style', 'font-weight: bold !important;');
          });
        });

        // ul自体にもスタイルを設定（左パディングを増やして箇条書きのスペースを確保）
        listEl.setAttribute('style', 'margin: 1em 0; padding: 15px 20px 15px 40px; list-style: none; line-height: 1.8;');
      });

      // テーブル/blockquote/pre/code にもテーマ色でインラインスタイルを付与する
      // （コピー先CMSに対応CSSが無いと無装飾のまま貼り付いてしまうため）(v0.11.0 B6)
      tempDiv.querySelectorAll('table').forEach(el => {
        const elTheme = resolveElTheme(el);
        const prevTable = el.getAttribute('style') || '';
        el.setAttribute('style', `${prevTable}; border-collapse: collapse; width: 100%; margin: 1em 0;`);
        const headerCells = el.querySelectorAll('th');
        headerCells.forEach(th => {
          const prev = th.getAttribute('style') || '';
          th.setAttribute('style', `${prev}; border: 1px solid ${elTheme.color}; padding: 8px 12px; background: ${elTheme.color}; color: #fff;`);
        });
        if (!headerCells.length) {
          // thead/thが無いテーブルは先頭行をヘッダー扱いにする
          const firstRow = el.querySelector('tr');
          if (firstRow) {
            Array.from(firstRow.children).forEach(cell => {
              const prev = cell.getAttribute('style') || '';
              cell.setAttribute('style', `${prev}; border: 1px solid ${elTheme.color}; padding: 8px 12px; background: ${elTheme.color}; color: #fff; font-weight: bold;`);
            });
          }
        }
        el.querySelectorAll('td').forEach(td => {
          const prev = td.getAttribute('style') || '';
          // 既にヘッダー扱いで枠線を設定済みのセルは上書きしない
          if (!/border:/.test(prev)) {
            td.setAttribute('style', `${prev}; border: 1px solid ${elTheme.color}; padding: 8px 12px;`);
          }
        });
      });

      tempDiv.querySelectorAll('blockquote').forEach(el => {
        const elTheme = resolveElTheme(el);
        const prev = el.getAttribute('style') || '';
        el.setAttribute('style', `${prev}; border-left: 4px solid ${elTheme.color}; background: ${elTheme.lightColor}; padding: 10px 16px; margin: 1em 0;`);
      });

      tempDiv.querySelectorAll('pre').forEach(el => {
        const elTheme = resolveElTheme(el);
        const prev = el.getAttribute('style') || '';
        el.setAttribute('style', `${prev}; font-family: monospace; background: ${elTheme.lightColor}; padding: 12px 16px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap;`);
      });

      tempDiv.querySelectorAll('code').forEach(el => {
        const elTheme = resolveElTheme(el);
        const prev = el.getAttribute('style') || '';
        if (el.closest('pre')) {
          // pre内のcodeは親のpreで既に装飾済みなので軽めに
          el.setAttribute('style', `${prev}; font-family: monospace;`);
        } else {
          el.setAttribute('style', `${prev}; font-family: monospace; background: ${elTheme.lightColor}; padding: 2px 6px; border-radius: 3px;`);
        }
      });

      // すべてのインライン装飾要素に!importantを追加
      preserveInlineFormatting(tempDiv);

      return tempDiv.innerHTML;
    }

    // === HTMLをブログ用にフォーマットする関数 ===
    function formatHtmlForBlog(html) {
      let formattedHtml = html;

      // <pre>...</pre> の中身は改行・連続スペースをそのまま保持したいので、
      // 以降の改行削除／空白圧縮の対象から外すため一時的にプレースホルダへ退避
      const preBlocks = [];
      formattedHtml = formattedHtml.replace(/<pre[\s\S]*?<\/pre>/gi, (m) => {
        const idx = preBlocks.length;
        preBlocks.push(m);
        return `__PRE_${idx}__`;
      });

      // 段落にブログシステムと同じスタイルを追加（空段落は除く）
      formattedHtml = formattedHtml.replace(/<p>(?!<br>)/g, '<p style="font-weight: normal; margin: 1em 0; line-height: 1.8;">');
      
      // 空段落（brのみ）には通常の行間と同じ高さを設定
      formattedHtml = formattedHtml.replace(/<p><br><\/p>/g, '<p style="font-weight: normal; margin: 0; line-height: 1.8;"><br></p>');
      
      // 見出しにもブログシステムに合わせた行間を調整
      formattedHtml = formattedHtml.replace(/<div style="background:([^"]+); border-left:([^"]+); padding:([^"]+); font-size:([^"]+); font-weight:([^"]+); margin:([^"]+);">/g, 
        '<div style="background:$1; border-left:$2; padding:$3; font-size:$4; font-weight: $5; margin: $6; line-height: 1.8;">');
      
      // 吹き出しにも行間を調整
      formattedHtml = formattedHtml.replace(/line-height: 1\.6/g, 'line-height: 1.8');
      
      // ボックス内のリスト項目にも行間を調整
      formattedHtml = formattedHtml.replace(/line-height: 1\.6 !important/g, 'line-height: 1.8 !important');
      
      // 改行をすべて削除（ブログシステムが<br>を自動挿入するのを防ぐ）
      formattedHtml = formattedHtml.replace(/\r\n/g, '');
      formattedHtml = formattedHtml.replace(/\n/g, '');
      formattedHtml = formattedHtml.replace(/\r/g, '');
      
      // 複数のスペースを1つに圧縮
      formattedHtml = formattedHtml.replace(/\s{2,}/g, ' ');

      // ブロック要素の閉じタグ直後の空白のみを圧縮
      // （インライン要素間の意味のあるスペースや pre/code 内の書式を壊さないよう、
      //   タグ間全般を潰していた >\s+< から対象を限定）
      formattedHtml = formattedHtml.replace(/(<\/(?:p|div|ul|ol|li|table|thead|tbody|tr|td|th|h[1-6]|blockquote)>)\s+(<)/g, '$1$2');

      // 退避しておいた<pre>ブロックを復元
      formattedHtml = formattedHtml.replace(/__PRE_(\d+)__/g, (m, i) => preBlocks[Number(i)] !== undefined ? preBlocks[Number(i)] : m);

      return formattedHtml;
    }

    // === 下書き保存システム (v0.9.0) ===
    // データモデル:
    //   - 履歴は localStorage に永続化（ブラウザ別 / デバイス別）
    //   - 「現在編集中ID」は **インメモリのみ** で保持。リロードすると null に戻る
    //   - 起動時はエディタを空にし、ユーザーが履歴をクリックするか新規編集を始めるまで何も復元しない
    // v0.13.0: 旧バージョン（editor-icons-legacy.html）は eisai_editor_drafts_v2 を使い続けるため、
    //   新エディタは履歴保存キーを eisai_editor_drafts_v3 に分離する。初回起動時のみ v2 → v3 へ
    //   一方向コピー（v2は削除しない・旧バージョン側の履歴はそのまま残る）。
    const DRAFTS_KEY = 'eisai_editor_drafts_v3';
    const LEGACY_DRAFTS_KEY = 'eisai_editor_drafts_v2';
    const DRAFTS_MAX = 50;
    const AUTOSAVE_DELAY_MS = 2000;
    let _currentDraftId = ''; // インメモリ：リロードでリセット

    // === 未保存変更の検知・警告 (v0.11.0 P0データセーフティ) ===
    // _dirty: 編集監視（MutationObserver / タイトル入力）で true になる。保存成功時や
    //         履歴読込・新規作成・テーマ適用の完了時に false へ戻す。
    let _dirty = false;
    // 履歴読込・サンプル生成など「プログラムによる内容の丸ごと置換」の最中は
    // MutationObserver 経由の markUnsavedChange() を発火させないための抑制フラグ。
    let _suppressUnsavedMark = false;
    function hasUnsavedChanges() {
      return _dirty && getPlaygroundHtml().trim().length > 0;
    }
    function guardUnsaved(actionLabel) {
      if (!hasUnsavedChanges()) return true;
      return confirm(actionLabel + '\n\n未保存の変更があります。破棄してよろしいですか？');
    }

    const Drafts = {
      // ID重複排除：同IDが複数あれば updatedAt が新しい方を残す
      _dedupe(list) {
        if (!Array.isArray(list)) return [];
        const byId = new Map();
        for (const d of list) {
          if (!d || !d.id) continue;
          const ex = byId.get(d.id);
          if (!ex || (d.updatedAt || '') > (ex.updatedAt || '')) {
            byId.set(d.id, d);
          }
        }
        return Array.from(byId.values())
          .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      },
      load() {
        let raw = null;
        try {
          raw = localStorage.getItem(DRAFTS_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return this._dedupe(parsed);
        } catch (e) {
          console.warn('下書き読込エラー:', e);
          // 壊れた生データを別キーに退避してから空リストを返す（データ消失を防ぐ）
          try {
            if (raw) localStorage.setItem(DRAFTS_KEY + '_broken_' + Date.now(), raw);
          } catch (e2) {
            console.warn('壊れた下書きデータの退避に失敗:', e2);
          }
          if (typeof setDraftStatus === 'function') {
            setDraftStatus('履歴データが壊れていたため退避しました', 'error');
          }
          return [];
        }
      },
      save(list) {
        try {
          const cleaned = this._dedupe(list);
          if (cleaned.length > DRAFTS_MAX) cleaned.length = DRAFTS_MAX;
          localStorage.setItem(DRAFTS_KEY, JSON.stringify(cleaned));
          return true;
        } catch (e) {
          console.error('下書き保存エラー:', e);
          if (e.name === 'QuotaExceededError') {
            showToast('❌ ブラウザのストレージ容量が一杯です。古い下書きを削除してください。', 'error');
          }
          return false;
        }
      },
      get(id) {
        return this.load().find((d) => d.id === id);
      },
      remove(id) {
        const list = this.load().filter((d) => d.id !== id);
        this.save(list);
        if (this.getCurrentId() === id) this.clearCurrentId();
      },
      // 現在編集中ID（インメモリ：リロードでリセット）
      getCurrentId() { return _currentDraftId || ''; },
      setCurrentId(id) { _currentDraftId = id || ''; },
      clearCurrentId() { _currentDraftId = ''; },
      // 新規エントリ作成
      _newItem(title, html, kind) {
        const now = new Date().toISOString();
        return {
          id: 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          title: (title || '').slice(0, 80),
          html: html || '',
          kind: kind, // 'current' | 'snapshot'
          createdAt: now,
          updatedAt: now,
        };
      },
      // 保存：現在編集中エントリがあれば更新、無ければ新規作成
      // 「同じ記事の保存は新規履歴にせず、既存履歴を更新する」要件を満たす
      saveOrUpdate(title, html) {
        if (!title || !title.trim()) return null;
        const list = this.load();
        let id = this.getCurrentId();
        let item = id ? list.find((d) => d.id === id) : null;
        if (item) {
          item.title = title.slice(0, 80);
          item.html = html || '';
          item.kind = 'current';
          item.updatedAt = new Date().toISOString();
        } else {
          item = this._newItem(title, html, 'current');
          list.push(item);
          this.setCurrentId(item.id);
        }
        const ok = this.save(list);
        if (!ok) return null; // 保存失敗（容量超過等）：呼び出し元で失敗表示させる
        return item;
      },
      // 既存エントリ（履歴）を「現在編集中」として開く（コピーして新IDで開始）
      openAsCurrent(id) {
        const src = this.get(id);
        if (!src) return null;
        const item = this._newItem(src.title, src.html, 'current');
        const list = this.load();
        list.push(item);
        const ok = this.save(list);
        if (!ok) return null; // 保存失敗：現在IDは更新しない
        this.setCurrentId(item.id);
        return item;
      },
    };

    // v0.13.0: 旧バージョン（v2）→新エディタ（v3）への履歴引き継ぎ。
    // v3が空（未使用）で、かつv2に1件以上ある場合のみコピーする（v2は削除しない・一方向・複数回実行しても安全）。
    function migrateDraftsFromLegacyIfNeeded() {
      try {
        const v3Raw = localStorage.getItem(DRAFTS_KEY);
        const v3List = v3Raw ? JSON.parse(v3Raw) : [];
        if (Array.isArray(v3List) && v3List.length > 0) return; // v3に既にデータがあれば何もしない
        const v2Raw = localStorage.getItem(LEGACY_DRAFTS_KEY);
        if (!v2Raw) return;
        const v2List = JSON.parse(v2Raw);
        if (!Array.isArray(v2List) || v2List.length === 0) return;
        localStorage.setItem(DRAFTS_KEY, JSON.stringify(v2List));
        showToast('以前の履歴を引き継ぎました', 'success');
      } catch (e) {
        console.warn('[Eisai] v2→v3 履歴移行エラー:', e);
      }
    }

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${d.getFullYear()}/${m}/${day} ${h}:${min}`;
      } catch (e) { return ''; }
    }

    function setDraftStatus(label, type) {
      const el = document.getElementById('draft-status');
      if (!el) return;
      el.textContent = label;
      el.classList.remove('saved', 'saving', 'error');
      if (type) el.classList.add(type);
    }

    function getDraftTitle() {
      // 表題バー（playground内）を優先、なければサイドバー入力
      const articleEl = document.getElementById('article-title-display');
      if (articleEl && articleEl.value.trim()) return articleEl.value.trim();
      const sidebarEl = document.getElementById('draft-title-input');
      return sidebarEl ? sidebarEl.value.trim() : '';
    }

    function setDraftTitle(t) {
      const v = t || '';
      const sidebarEl = document.getElementById('draft-title-input');
      if (sidebarEl) sidebarEl.value = v;
      const articleEl = document.getElementById('article-title-display');
      if (articleEl) articleEl.value = v;
      // v0.12.0 E2-2: プログラム経由の表題変更でも文字数チップを更新
      const charCountEl = document.getElementById('article-title-charcount');
      if (charCountEl) charCountEl.textContent = v.length + '字';
    }

    // 拡張機能が埋め込んだ <!--EISAI_TITLES:[...]--> の3タイトル候補
    let editorTitleCandidates = [];

    // 貼り付けHTML文字列から EISAI_TITLES を抽出し、コメントを除去した文字列を返す
    function parseEisaiTitlesFromHtml(html) {
      let titles = [];
      let cleaned = html || '';
      // v0.11.0 D-2 Part1-3 (OPS-21): タイトル文字列に "]" が含まれると、配列部分だけを
      // 非欲張りにマッチする旧正規表現ではコメントの途中で切れてしまう。
      // まずコメント全体（最初の "-->" まで）を丸ごと捕捉し、その内容をJSON.parseする。
      const m = cleaned.match(/<!--\s*EISAI_TITLES\s*:\s*([\s\S]*?)-->/i)
        || cleaned.match(/&lt;!--\s*EISAI_TITLES\s*:\s*([\s\S]*?)--&gt;/i);
      if (m) {
        try {
          const decoded = m[1].replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim();
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed)) {
            titles = parsed.map(t => String(t || '').trim()).filter(Boolean).map(t => t.slice(0, 33));
          }
        } catch (e) {
          console.warn('[Eisai] EISAI_TITLESの解析に失敗:', e);
        }
        // JSON.parseに失敗しても、マッチしたコメント全体は必ず除去する（"]-->"等の断片を残さない）
        cleaned = cleaned.slice(0, m.index) + cleaned.slice(m.index + m[0].length);
      }
      // コメントは本文へ残さない（<p>で包まれたケースや旧形式の残骸も保険的に除去）
      cleaned = cleaned.replace(/<p[^>]*>\s*(?:<!--|&lt;!--)?\s*EISAI_TITLES[\s\S]*?(?:-->|--&gt;)\s*<\/p>/gi, '');
      cleaned = cleaned.replace(/(?:<!--|&lt;!--)\s*EISAI_TITLES[\s\S]*?(?:-->|--&gt;)/gi, '');
      cleaned = cleaned.replace(/EISAI_TITLES\s*:\s*\[[\s\S]*?\]/gi, '');
      return { titles: titles.slice(0, 3), html: cleaned };
    }

    // 表題バー内のタイトル候補ボタンを描画（クリックで表題フォームに反映）
    // v0.12.0 E2-2: 1行に収まるコンパクトなチップ。短縮ラベル + 省略タイトル、全文はtitle属性で
    const EDITOR_TITLE_LABELS = ['① SEO', '② 共感', '③ CV'];
    function renderEditorTitleCandidates() {
      const wrap = document.getElementById('article-title-candidates');
      if (!wrap) return;
      while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
      if (!editorTitleCandidates || editorTitleCandidates.length < 2) {
        wrap.style.display = 'none';
        return;
      }
      wrap.style.display = 'flex';
      const current = getDraftTitle();
      editorTitleCandidates.forEach((title, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'article-title-cand' + (title === current ? ' active' : '');
        btn.title = title + '（' + title.length + '字）';
        const displayTitle = title.length > 14 ? title.slice(0, 14) + '…' : title;
        btn.innerHTML = '<span class="cand-label">' + (EDITOR_TITLE_LABELS[idx] || ('案' + (idx + 1))) + '</span>' + displayTitle.replace(/</g, '&lt;');
        btn.onclick = () => {
          setDraftTitle(title);
          if (typeof onTitleInput === 'function') onTitleInput();
          wrap.querySelectorAll('.article-title-cand').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        wrap.appendChild(btn);
      });
    }

    function flashTitleError() {
      const el = document.getElementById('draft-title-input');
      if (!el) return;
      el.classList.add('error');
      el.focus();
      setTimeout(() => el.classList.remove('error'), 1500);
    }

    // 本文の取得／反映は `.eisai-editor`（contentEditable）に対して行う。
    // `#playground` 全体を書き換えるとエディタ枠（ツールバー・表題バー含む）が消滅するため厳禁。
    function getPlaygroundHtml() {
      const editorEl = document.querySelector('.eisai-editor');
      return editorEl ? editorEl.innerHTML : '';
    }

    // v0.13.0 P3: 「テーマを変更」ボタンの有効/無効を、エディタの内容有無に応じて切り替える。
    // 「内容をクリア」直後のプレースホルダーだけの状態も「空」として扱う。
    function updateRethemeBtnState() {
      const btn = document.querySelector('.btn-retheme');
      if (!btn) return;
      const editorEl = document.querySelector('.eisai-editor');
      let hasContent = false;
      if (editorEl) {
        const isOnlyPlaceholder = editorEl.children.length === 1 &&
          editorEl.firstElementChild &&
          editorEl.firstElementChild.classList.contains('eisai-empty-placeholder');
        hasContent = !isOnlyPlaceholder && (editorEl.textContent || '').trim().length > 0;
      }
      btn.disabled = !hasContent;
    }

    // 旧バージョンで保存された履歴がエディタ枠ごと格納されているケースがあるため、
    // 読み込み時に `.eisai-editor` 配下だけを取り出すサニタイズを行う。
    function extractBodyHtml(html) {
      if (!html) return '';
      if (html.indexOf('eisai-editor') === -1) return html; // クリーンなHTML
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        // 一番内側の .eisai-editor を採用（多重入れ子も救済）
        const all = tmp.querySelectorAll('.eisai-editor');
        if (all.length > 0) {
          const inner = all[all.length - 1];
          return inner.innerHTML;
        }
        // 旧IDでパネル丸ごとのケース
        const panel = tmp.querySelector('#eisai-editor-icons');
        if (panel) {
          const ed = panel.querySelector('.eisai-editor');
          if (ed) return ed.innerHTML;
        }
      } catch (e) {
        console.warn('extractBodyHtml失敗:', e);
      }
      return html;
    }

    function setPlaygroundHtml(html) {
      const editorEl = document.querySelector('.eisai-editor');
      if (editorEl) {
        _suppressUnsavedMark = true;
        editorEl.innerHTML = extractBodyHtml(html);
        setTimeout(() => { _suppressUnsavedMark = false; }, 0);
        // v0.13.0: 履歴読込／新規作成／起動時の初期化はいずれも「別の記事に切り替える」
        // 操作のため、EditorHistoryをこの内容を起点にリセットする（前の記事へは戻れなくする）
        EditorHistory.reset(editorEl);
      }
    }

    // 日付グループ判定（今日/昨日/今週/過去）
    function classifyByDate(iso) {
      try {
        const d = new Date(iso);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const target = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const dayDiff = Math.floor((today - target) / 86400000);
        if (dayDiff <= 0) return { key: 'today', label: '今日' };
        if (dayDiff === 1) return { key: 'yesterday', label: '昨日' };
        if (dayDiff <= 7) return { key: 'thisWeek', label: '今週（過去7日）' };
        if (dayDiff <= 30) return { key: 'thisMonth', label: '今月（過去30日）' };
        return { key: 'older', label: 'それ以前' };
      } catch (e) {
        return { key: 'older', label: 'それ以前' };
      }
    }

    // 時刻のみ表示（履歴アイテム用）
    function formatTime(iso) {
      try {
        const d = new Date(iso);
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${min}`;
      } catch (e) { return ''; }
    }

    function renderDraftList() {
      const listEl = document.getElementById('draft-list');
      if (!listEl) return;
      const drafts = Drafts.load();
      const currentId = Drafts.getCurrentId();
      listEl.innerHTML = '';

      // v0.12.0 E2-4: 右パネルヘッダーの件数バッジを更新
      const countBadge = document.getElementById('history-count-badge');
      if (countBadge) countBadge.textContent = String(drafts.length);

      // 日付でグループ化
      const groups = { today: [], yesterday: [], thisWeek: [], thisMonth: [], older: [] };
      const groupLabels = {
        today: '今日',
        yesterday: '昨日',
        thisWeek: '今週（過去7日）',
        thisMonth: '今月（過去30日）',
        older: 'それ以前',
      };
      drafts.forEach((d) => {
        const cls = classifyByDate(d.updatedAt);
        if (groups[cls.key]) groups[cls.key].push(d);
      });

      // 順番にレンダリング
      ['today', 'yesterday', 'thisWeek', 'thisMonth', 'older'].forEach((key) => {
        const list = groups[key];
        if (list.length === 0) return;

        const header = document.createElement('div');
        header.className = 'history-group-header';
        header.textContent = groupLabels[key];
        listEl.appendChild(header);

        list.forEach((d) => {
          const item = document.createElement('div');
          const isCurrent = d.id === currentId;
          item.className = 'draft-item ' + (isCurrent ? 'current' : 'snapshot');
          item.title = `作成: ${formatDate(d.createdAt)}\n更新: ${formatDate(d.updatedAt)}\nクリックで読込`;

          const name = document.createElement('span');
          name.className = 'draft-name';
          name.textContent = d.title || '(無題)';

          const meta = document.createElement('span');
          meta.className = 'draft-meta';
          meta.textContent = key === 'today' || key === 'yesterday' ? formatTime(d.updatedAt) : formatDate(d.updatedAt).slice(5);

          const del = document.createElement('button');
          del.className = 'draft-item-delete';
          del.textContent = '×';
          del.title = '削除';
          del.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`「${d.title || '(無題)'}」を削除しますか？`)) {
              Drafts.remove(d.id);
              renderDraftList();
            }
          };

          item.appendChild(name);
          if (isCurrent) {
            const badge = document.createElement('span');
            badge.className = 'draft-badge';
            badge.textContent = '編集中';
            item.appendChild(badge);
          }
          item.appendChild(meta);
          item.appendChild(del);
          item.onclick = () => openHistoryItem(d.id);
          listEl.appendChild(item);
        });
      });
    }

    // 履歴項目クリック時の挙動：そのエントリを直接「現在編集中」にする（コピーしない）
    // 現在の編集内容は自動保存で履歴に残っているため、確認なしでそのまま読込する
    // 旧バグでエディタ枠ごと保存されたエントリは、読み込み時にクリーン版へ自動修復する
    function openHistoryItem(id) {
      const src = Drafts.get(id);
      if (!src) return;
      if (id === Drafts.getCurrentId()) return;
      if (!guardUnsaved('履歴を開く')) return;
      // v0.11.0 D-2 Part1-5 (OPS-24): 前の記事の3タイトル候補が残らないようにリセット
      editorTitleCandidates = [];
      renderEditorTitleCandidates();
      Drafts.setCurrentId(id);
      const cleaned = extractBodyHtml(src.html);
      setDraftTitle(src.title);
      setPlaygroundHtml(cleaned);
      _dirty = false;
      // 旧バグの巻き添えエントリをクリーン版で自動修復（永続化）
      if (cleaned !== src.html) {
        const list = Drafts.load();
        const idx = list.findIndex((d) => d.id === id);
        if (idx >= 0) {
          list[idx].html = cleaned;
          list[idx].updatedAt = new Date().toISOString();
          Drafts.save(list);
          console.log('[Eisai] 旧バグ履歴を自動修復:', src.title);
        }
      }
      setDraftStatus(`読込: ${src.title}`, 'saved');
      renderDraftList();
    }

    // 「💾 履歴に残す」ボタン：現在編集中があれば更新、無ければ新規作成
    function saveDraft() {
      const title = getDraftTitle();
      if (!title) {
        showToast('表題が空です。「テーマを適用」でH1から自動入力できます。', 'info');
        flashTitleError();
        return;
      }
      let html = getPlaygroundHtml();
      if (!html || html.trim().length === 0) {
        showToast('本文が空です。', 'info');
        return;
      }
      // 拡張機能の注入要素を除去してから保存（履歴も常にクリーンに保つ）
      if (typeof stripExtensionInjectedNodes === 'function') {
        html = stripExtensionInjectedNodes(html);
      }
      const wasUpdate = !!Drafts.getCurrentId();
      const item = Drafts.saveOrUpdate(title, html);
      if (!item) {
        setDraftStatus('❌ 保存に失敗しました（ストレージ容量を確認してください）', 'error');
        showToast('❌ 履歴の保存に失敗しました。ブラウザのストレージ容量をご確認ください。', 'error');
        return;
      }
      _dirty = false;
      setDraftStatus((wasUpdate ? '✅ 履歴を更新' : '✅ 新規保存') + ': ' + formatDate(item.updatedAt), 'saved');
      renderDraftList();
    }

    // 新規作成：現在の編集内容は自動保存で履歴に残っているため、確認なしで即座にまっさらへ
    function newDraft() {
      if (!guardUnsaved('新規作成')) return;
      // v0.11.0 D-2 Part1-5 (OPS-24): 前の記事の3タイトル候補が残らないようにリセット
      editorTitleCandidates = [];
      renderEditorTitleCandidates();
      Drafts.clearCurrentId();
      setDraftTitle('');
      setPlaygroundHtml('');
      _dirty = false;
      setDraftStatus('未保存（新規）', '');
      renderDraftList();
      // 表題バーへフォーカス
      const articleEl = document.getElementById('article-title-display');
      if (articleEl) articleEl.focus();
    }

    function exportAllDrafts() {
      const drafts = Drafts.load();
      if (drafts.length === 0) {
        showToast('エクスポートする下書きがありません。', 'info');
        return;
      }
      const payload = {
        format: 'eisai-editor-drafts',
        version: 2,
        exportedAt: new Date().toISOString(),
        drafts,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `eisai-drafts-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDrafts(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.format !== 'eisai-editor-drafts' || !Array.isArray(data.drafts)) {
            showToast('❌ ファイル形式が正しくありません。', 'error');
            return;
          }
          // v1（旧 name フィールド）→ v2（title）の互換変換
          const normalized = data.drafts.map((d) => ({
            id: d.id || ('d_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
            title: (d.title != null ? d.title : (d.name || '')).slice(0, 80),
            html: d.html || '',
            kind: d.kind || 'snapshot',
            createdAt: d.createdAt || new Date().toISOString(),
            updatedAt: d.updatedAt || new Date().toISOString(),
          }));
          const existing = Drafts.load();
          const merged = normalized.concat(existing);
          const dedupedCount = Drafts._dedupe(merged).length;
          const ok = Drafts.save(merged);
          if (!ok) {
            showToast('❌ インポートの保存に失敗しました。ブラウザのストレージ容量をご確認ください。', 'error');
            return;
          }
          renderDraftList();
          if (dedupedCount > DRAFTS_MAX) {
            const omitted = dedupedCount - DRAFTS_MAX;
            showToast(`✅ ${DRAFTS_MAX}件を取り込み（上限のため${omitted}件は省略）`, 'success');
          } else {
            showToast(`✅ ${normalized.length}件の下書きをインポートしました。`, 'success');
          }
        } catch (err) {
          showToast('❌ ファイルの読込に失敗しました: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    // 自動保存は廃止。変更があった場合のみ「未保存の変更あり」とステータス表示する。
    function markUnsavedChange() {

        setDraftStatus('表題を入力してください', 'error');
        return;
      }

    // 起動時はまっさら状態を維持（Gemini/ChatGPT 方式）。
    // 過去の編集は履歴サイドバーから明示的に選択して開く。
    // ※ この関数は互換のために残してあるが、現状の設計では呼び出さない。
    function tryRestoreCurrent() {
      // 何もしない（意図的）
    }

    // === 表題バー / 本文コピーバー（playground内・v0.9.0） ===
    function escapeHtmlAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ブラウザ拡張機能（LanguageTool / Grammarly 等）が contentEditable に注入する
    // ラッパー要素・装飾要素を除去する。コピー結果がCMSで正しく描画されない原因になる。
    function stripExtensionInjectedNodes(html) {
      if (!html) return '';
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;

        // 完全に削除する要素（中身ごと）
        const removeSelectors = [
          'lt-toolbar', 'lt-popup', 'lt-panel',
          'grammarly-extension', 'grammarly-popups',
          '[data-grammarly-shadow-root]',
        ];
        removeSelectors.forEach((sel) => {
          tmp.querySelectorAll(sel).forEach((el) => el.remove());
        });

        // ラッパー（unwrap）する要素：中身は残してタグだけ取り除く
        const unwrapSelectors = [
          '.lg-badge-container',           // LanguageTool バッジコンテナ
          '.grammarly-btn', '.gr_-editor',
          'lt-div',
        ];
        unwrapSelectors.forEach((sel) => {
          try {
            tmp.querySelectorAll(sel).forEach((el) => {
              const parent = el.parentNode;
              if (!parent) return;
              while (el.firstChild) parent.insertBefore(el.firstChild, el);
              parent.removeChild(el);
            });
          } catch (e) {}
        });

        // lt-* / grammarly-* 系クラスはトークン（クラス先頭一致）で判定してunwrap。
        // [class*="lt-"] のような部分一致だと result-box や default-... のような
        // 通常クラスまで誤って剥がしてしまうため、クラス単位の startsWith に切り替える。
        // theme- / eisai- / bubble 系クラスを併せ持つ要素は絶対にunwrapしない。
        try {
          const extensionPrefixes = ['lt-', 'lt_', 'grammarly-', 'gr_'];
          const protectedTokens = ['theme-', 'eisai-', 'bubble'];
          tmp.querySelectorAll('[class]').forEach((el) => {
            const classes = Array.from(el.classList);
            if (!classes.length) return;
            const isExtensionNode = classes.some((c) => extensionPrefixes.some((p) => c.startsWith(p)));
            if (!isExtensionNode) return;
            const isProtected = classes.some((c) => protectedTokens.some((p) => c.includes(p)));
            if (isProtected) return;
            const parent = el.parentNode;
            if (!parent) return;
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
          });
        } catch (e) {}

        // 拡張機能由来のdata属性を持つ要素（属性だけ削除）
        tmp.querySelectorAll('[data-lt-installed], [data-gramm], [data-gramm_editor]').forEach((el) => {
          el.removeAttribute('data-lt-installed');
          el.removeAttribute('data-gramm');
          el.removeAttribute('data-gramm_editor');
        });

        // v0.13.0: パーツ間の「スペーサー」段落・パーツ選択状態のマーカーは編集専用の補助であり、
        // ブログ貼付用HTMLには一切出さない。中身が空のスペーサーは段落ごと除去し
        // （＝通常の記事は従来どおりの見た目になる）、文字が入って本物の段落になったものは
        // data-spacer 属性だけを外して段落自体は残す。
        tmp.querySelectorAll('p[data-spacer="1"]').forEach((p) => {
          const text = (p.textContent || '').trim();
          if (!text) {
            p.remove();
          } else {
            p.removeAttribute('data-spacer');
          }
        });
        tmp.querySelectorAll('[data-spacer]').forEach((el) => el.removeAttribute('data-spacer'));
        tmp.querySelectorAll('[data-selected]').forEach((el) => el.removeAttribute('data-selected'));

        // v0.13.0 P1 §5: テーマv3のエディタ専用マーカー属性をブログ貼付用HTMLから除去する。
        // data-cta-protected / data-photo-placeholder はCMS側・保護ロジックで必要なので残す。
        // v0.13.0 生成語彙対応: data-cta-kind（cta部品のmid/final区別）もエディタ専用のため除去する。
        // v0.13.0 吹き出し再構築: data-side（左右判定用。パーツの色/テーマ変更/デフォルト色decisionの
        // 内部マーカー）もエディタ専用のため除去する。
        tmp.querySelectorAll('[data-part], [data-role], [data-index], [data-step], [data-theme], [data-color-bg], [data-color-accent], [data-color-text], [data-color-line], [data-catalog-no], [data-cta-kind], [data-side]').forEach((el) => {
          el.removeAttribute('data-part');
          el.removeAttribute('data-role');
          el.removeAttribute('data-index');
          el.removeAttribute('data-step');
          el.removeAttribute('data-theme');
          el.removeAttribute('data-color-bg');
          el.removeAttribute('data-color-accent');
          el.removeAttribute('data-color-text');
          el.removeAttribute('data-color-line');
          el.removeAttribute('data-catalog-no');
          el.removeAttribute('data-cta-kind');
          el.removeAttribute('data-side');
        });

        return tmp.innerHTML;
      } catch (e) {
        console.warn('拡張機能タグ除去に失敗:', e);
        return html;
      }
    }

    // === ブログ貼付用HTML生成の単一パイプライン（v0.11.0 P1 C2: 出力経路の一本化） ===
    // サイドバー「📋 HTML出力」・表題バー「📋 本文」・「🖥 サンプルチェック」の
    // 3箇所は必ずこの関数を経由させ、出力されるHTMLを完全に一致させる。
    function buildBlogHtml(rawHtml) {
      // ★ ブラウザ拡張（LanguageTool / Grammarly等）の注入要素を除去
      let html = (typeof stripExtensionInjectedNodes === 'function')
        ? stripExtensionInjectedNodes(rawHtml)
        : (rawHtml || '');
      // ボタンのonclickを復元（エディタ用の無効化を解除）
      html = html.replace(/data-onclick="([^"]*)" onclick="event\.preventDefault\(\);"/g, 'onclick="$1"');
      // テーマクラスをインラインスタイルに変換（ブログ貼り付け用）
      if (typeof convertThemeClassesToInlineStyles === 'function') {
        html = convertThemeClassesToInlineStyles(html);
      }
      // ブロック要素間に改行を追加して読みやすくする
      if (typeof formatHtmlForBlog === 'function') {
        html = formatHtmlForBlog(html);
      }
      return html;
    }

    function flashCopyOK(btn, msg) {
      if (!btn) return;
      // v0.11.0 D-2 Part1-2 (OPS-19): 元のラベルは初回のみ保存し、連打時に前のタイマーを
      // 必ずクリアしてから張り直す。これにより高速な連続クリックでもラベルが固まらない。
      if (btn.dataset.label === undefined) {
        btn.dataset.label = btn.textContent;
      }
      clearTimeout(btn._flashTimer);
      btn.textContent = msg;
      btn.classList.add('copy-ok');
      btn._flashTimer = setTimeout(() => {
        btn.textContent = btn.dataset.label;
        btn.classList.remove('copy-ok');
      }, 1800);
    }

    function injectArticleTitleBar(retry = 0) {
      // パネルは class 経由で逆引き（id 設定が確実でないケースに備える）
      const fixedHeader = document.querySelector('.eisai-fixed-header');
      const editorArea = document.querySelector('.eisai-editor-container');
      if (!fixedHeader || !editorArea) {
        if (retry < 10) {
          console.log('[Eisai] エディタDOM未準備、リトライ', retry);
          setTimeout(() => injectArticleTitleBar(retry + 1), 200);
        } else {
          console.warn('[Eisai] 表題バー注入失敗：エディタDOMが見つかりません');
        }
        return;
      }
      const panel = editorArea.parentElement;
      if (!panel) return;

      // 表題バー（H1表示のみ。v0.12.0: タイトル/本文コピーボタンはトップバーへ移設済み。
      // #btn-copy-title / #btn-copy-body は #topbar に静的HTMLとして存在するため、
      // ここでは再生成しない＝bindTitleAndBodyCopy()がid経由で見つけて紐付ける）
      if (!document.getElementById('article-title-bar')) {
        const titleBar = document.createElement('div');
        titleBar.id = 'article-title-bar';
        titleBar.className = 'article-title-bar';
        titleBar.innerHTML = `
          <span class="article-title-label">表題</span>
          <input type="text" id="article-title-display" class="article-title-display"
                 placeholder="表題はここ（テーマを適用するとH1が自動入力されます）" maxlength="120" autocomplete="off">
          <span id="article-title-charcount" class="article-title-charcount">0字</span>
        `;
        panel.insertBefore(titleBar, editorArea);
      }
      // v0.13.1: 湯浅さん指摘「HTMLコピーとタイトルコピーのボタンが無くなっている」。v0.12.0で
      // 右上のトップバーへ移したため見つけにくくなっていた。旧版（0.11）と同じく、表題の横（本文の
      // すぐ上）に戻す。要素ごと移すので、bindTitleAndBodyCopy()のid経由の紐付けはそのまま使える。
      (function moveCopyButtonsNextToTitle() {
        const bar = document.getElementById('article-title-bar');
        if (!bar) return;
        ['btn-copy-title', 'btn-copy-body'].forEach(id => {
          const btn = document.getElementById(id);
          if (btn && btn.parentElement !== bar) bar.appendChild(btn);
        });
      })();

      // タイトル候補（拡張機能が埋め込んだ3案）を選ぶ行
      if (!document.getElementById('article-title-candidates')) {
        const cand = document.createElement('div');
        cand.id = 'article-title-candidates';
        cand.className = 'article-title-candidates';
        cand.style.display = 'none';
        const bar = document.getElementById('article-title-bar');
        if (bar && bar.parentNode) bar.parentNode.insertBefore(cand, bar.nextSibling);
      }

      bindTitleAndBodyCopy();
    }

    function bindTitleAndBodyCopy() {
      const articleEl = document.getElementById('article-title-display');
      const sidebarEl = document.getElementById('draft-title-input');

      // v0.12.0 E2-2: 表題の文字数チップをライブ更新
      const charCountEl = document.getElementById('article-title-charcount');
      const updateTitleCharCount = () => {
        if (charCountEl && articleEl) charCountEl.textContent = articleEl.value.length + '字';
      };

      // 双方向同期：表題バー ↔ サイドバー入力
      if (articleEl && sidebarEl) {
        articleEl.value = sidebarEl.value;
        updateTitleCharCount();
        articleEl.addEventListener('input', () => {
          sidebarEl.value = articleEl.value;
          updateTitleCharCount();
          if (typeof onTitleInput === 'function') onTitleInput();
        });
        sidebarEl.addEventListener('input', () => {
          articleEl.value = sidebarEl.value;
          updateTitleCharCount();
        });
      }

      // タイトルコピー（v0.11.0 D-2 Part1-6 (UX-14/F17): プレーンテキストでコピー、タグは付けない）
      const copyTitleBtn = document.getElementById('btn-copy-title');
      if (copyTitleBtn) {
        copyTitleBtn.onclick = () => {
          const title = (articleEl ? articleEl.value : '').trim();
          if (!title) {
            showToast('表題が空です。テーマを適用してください。', 'info');
            return;
          }
          navigator.clipboard.writeText(title).then(() => {
            flashCopyOK(copyTitleBtn, '✅ コピー完了');
          }).catch((err) => {
            console.error('タイトルコピー失敗:', err);
            showToast('❌ コピーに失敗しました。', 'error');
          });
        };
      }

      // 本文コピー（テーマ装飾をインライン化、ブログ貼付用）
      const copyBodyBtn = document.getElementById('btn-copy-body');
      if (copyBodyBtn) {
        copyBodyBtn.onclick = () => {
          const editorEl = document.querySelector('.eisai-editor');
          if (!editorEl) {
            showToast('本文エディタが見つかりません。', 'info');
            return;
          }
          let html = editorEl.innerHTML || '';
          if (!html.replace(/\s|<br\s*\/?>/g, '').trim()) {
            showToast('本文が空です。', 'info');
            return;
          }
          // ★ サイドバー「HTML出力」・プレビューと完全に同じ出力にする（v0.11.0 P1 C2）
          html = buildBlogHtml(html);
          navigator.clipboard.writeText(html).then(() => {
            flashCopyOK(copyBodyBtn, '✅ コピー完了');
          }).catch((err) => {
            console.error('本文コピー失敗:', err);
            showToast('❌ コピーに失敗しました。', 'error');
          });
        };
      }
    }

    // === v0.12.0 E1-1: 左パネル／履歴パネルの表示切替（永続化） ===
    function initPanelToggles() {
      const sidebar = document.getElementById('sidebar');
      const panelRight = document.getElementById('panel-right');
      const btnLeft = document.getElementById('btn-toggle-left');
      const btnHistory = document.getElementById('btn-toggle-history');

      function applyLeft(open) {
        if (sidebar) sidebar.style.display = open ? '' : 'none';
        if (btnLeft) btnLeft.setAttribute('aria-pressed', open ? 'true' : 'false');
      }
      function applyHistory(open) {
        if (panelRight) panelRight.style.display = open ? '' : 'none';
        if (btnHistory) btnHistory.setAttribute('aria-pressed', open ? 'true' : 'false');
      }

      let leftOpen = true;
      try {
        const saved = localStorage.getItem('eisai_ui_left_open');
        if (saved !== null) leftOpen = saved === '1';
      } catch (e) {}

      let historyOpen = window.innerWidth >= 1280;
      try {
        const saved = localStorage.getItem('eisai_ui_history_open');
        if (saved !== null) historyOpen = saved === '1';
      } catch (e) {}

      applyLeft(leftOpen);
      applyHistory(historyOpen);

      if (btnLeft) {
        btnLeft.onclick = () => {
          leftOpen = !leftOpen;
          applyLeft(leftOpen);
          try { localStorage.setItem('eisai_ui_left_open', leftOpen ? '1' : '0'); } catch (e) {}
        };
      }
      if (btnHistory) {
        btnHistory.onclick = () => {
          historyOpen = !historyOpen;
          applyHistory(historyOpen);
          try { localStorage.setItem('eisai_ui_history_open', historyOpen ? '1' : '0'); } catch (e) {}
        };
      }
    }

    // === v0.12.0 E1-2: プレビューモーダル ===
    function initPreviewModal() {
      const modal = document.getElementById('preview-modal');
      const btnOpen = document.getElementById('btn-preview');
      const btnClose = document.getElementById('btn-preview-close');
      const btnCopy = document.getElementById('btn-preview-copy-body');
      const titleEl = document.getElementById('preview-modal-title');
      const bodyEl = document.getElementById('preview-modal-body');
      if (!modal || !btnOpen) return;

      function isOpen() {
        return modal.style.display !== 'none' && modal.style.display !== '';
      }

      function closeModal() {
        modal.style.display = 'none';
      }

      function openModal() {
        const editorEl = document.querySelector('.eisai-editor');
        const html = editorEl ? (editorEl.innerHTML || '') : '';
        if (!html.replace(/\s|<br\s*\/?>/g, '').trim()) {
          showToast('先に記事を貼り付けてテーマを適用してください', 'info');
          return;
        }
        const articleEl = document.getElementById('article-title-display');
        if (titleEl) titleEl.textContent = articleEl ? articleEl.value.trim() : '';
        if (bodyEl) bodyEl.innerHTML = buildBlogHtml(html);
        modal.style.display = 'flex';
      }

      btnOpen.onclick = openModal;
      if (btnClose) btnClose.onclick = closeModal;

      // 背景クリックで閉じる（シート自体のクリックは伝播を止めて閉じない）
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      // Esc で閉じる
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen()) closeModal();

      // 「本文をコピー」：#btn-copy-body と同じ生成ロジック（buildBlogHtml）を使い、

      if (btnCopy) {
        btnCopy.onclick = () => {

            console.error('本文コピー失敗:', err);

          });

      }

    // === アプリケーション初期化 ===
    let latestHtml = '';
    let editor = null;

    function initEditor() {
      editor = createEisaiEditorIcons({
        target: document.getElementById('playground'),
        initialContent: '',
        onCopyHtml: (html) => {
          // ★ 表題バー「本文コピー」・プレビューと完全に同じ出力にする（v0.11.0 P1 C2）
          const outputHtml = buildBlogHtml(html);

          latestHtml = outputHtml;
          document.getElementById('html-output').textContent = outputHtml;
          
          // クリップボードにコピー
          navigator.clipboard.writeText(outputHtml).then(() => {
            const charCount = outputHtml.length;
            const lineCount = (outputHtml.match(/\n/g) || []).length + 1;
            
            // 簡潔なアナウンスを表示
            const message = `✅ HTMLをコピーしました（${charCount.toLocaleString()}文字 / ${lineCount}行）`;

            showToast(message, 'success');
          }).catch(err => {
            console.error('クリップボードへのコピーに失敗しました:', err);
            showToast('❌ クリップボードへのコピーに失敗しました。ブラウザの設定を確認してください。', 'error');
          });
        },
        onPreview: (html) => {
          const previewWindow = window.open('', '_blank', 'width=800,height=600');
          previewWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <title>プレビュー</title>
              <style>
                body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6; }
                ${document.querySelector('style').textContent}
              </style>
            </head>
            <body>
              ${html}
            </body>
            </html>
          `);
        }
      });

      // エディタ内のキーイベント制御
      // 枠（div）やリスト内でEnterキーを押したときに、ブロック分割されずに改行されるようにする
      const playground = document.getElementById('playground');
      playground.addEventListener('keydown', (e) => {
        if (e.isComposing) return; // IME入力中は処理しない
        if (e.key === 'Enter') {
          const sel = window.getSelection();
          if (!sel.rangeCount) return;
          const range = sel.getRangeAt(0);
          
          // キャレット位置の親要素を探索
          let node = range.commonAncestorContainer;
          if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
          
          // 枠(div) または リスト項目(li) の中かチェック
          let insideBlock = false;
          let current = node;
          let isHeadingBlock = false;
          while (current && current !== playground) {
            // 枠（divでstyle属性を持つもの、またはテーマクラスを持つもの）または li
            const isStyledDiv = current.nodeName === 'DIV' && current.getAttribute('style');
            const isThemeElement = current.classList && (
              current.classList.contains('theme-heading') ||
              current.classList.contains('theme-box') ||
              current.classList.contains('theme-bubble-left') ||
              current.classList.contains('theme-bubble-right') ||
              current.classList.contains('theme-list')
            );
            const isLi = current.nodeName === 'LI';

            if (isStyledDiv || isThemeElement || isLi) {
              insideBlock = true;
              isHeadingBlock = !!(current.classList && current.classList.contains('theme-heading'));
              break;
            }
            current = current.parentNode;
          }

          if (insideBlock) {
            // v0.11.0 P1 C4a (OPS-18): リスト項目(li)の場合。
            // 空の最後のliでEnterを押した場合はリストから「抜けて」段落を作る。
            // それ以外（通常のli）はデフォルト挙動（新しいli作成）に任せる。
            if (current.nodeName === 'LI') {
              const list = current.parentElement; // ul/ol
              const isLastLi = list && list.lastElementChild === current;
              const liText = (current.textContent || '').replace(/ /g, ' ').trim();
              const hasImages = current.querySelector('img');

              if (isLastLi && liText === '' && !hasImages && list) {
                e.preventDefault();
                const p = document.createElement('p');
                p.innerHTML = '<br>';
                const parentList = list;
                const afterList = parentList.parentNode;
                parentList.removeChild(current);
                if (parentList.children.length === 0) {
                  // リストが空になった場合はリスト自体を段落に置き換える
                  afterList.insertBefore(p, parentList);
                  afterList.removeChild(parentList);
                } else {
                  afterList.insertBefore(p, parentList.nextSibling);
                }
                const newRange = document.createRange();
                newRange.setStart(p, 0);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
                if (p.scrollIntoView) {
                  p.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
                // v0.13.0: preventDefaultで自前のDOM操作をしているため、通常のinput/beforeinputでは
                // 拾えない（=このままだと元に戻せない）。ここで明示的に1手として確定する
                EditorHistory.commit();
              }
              return;
            }

            // v0.11.0 P1 C4a (OPS-18): キャレットがブロック（見出し/枠/吹き出し等）の
            // 末尾にあるかを判定する。見出し(theme-heading)は常に「抜ける」動作、
            // 枠・吹き出し等は末尾でのみ「抜ける」（それ以外は<br>で改行を維持）。
            const endRange = document.createRange();
            endRange.setStart(range.endContainer, range.endOffset);
            endRange.setEnd(current, current.childNodes.length);
            const tailProbe = document.createElement('div');
            tailProbe.appendChild(endRange.cloneContents());
            const atBlockEnd = (tailProbe.textContent || '').replace(/​/g, '').trim() === '';

            if (isHeadingBlock || atBlockEnd) {
              // ブロックの直後に新しい段落を作り、キャレットをそこへ移動する
              e.preventDefault();
              const p = document.createElement('p');
              p.innerHTML = '<br>';
              current.parentNode.insertBefore(p, current.nextSibling);
              const newRange = document.createRange();
              newRange.setStart(p, 0);
              newRange.collapse(true);
              sel.removeAllRanges();
              sel.addRange(newRange);
              if (p.scrollIntoView) {
                p.scrollIntoView({ block: 'nearest', inline: 'nearest' });
              }
              // v0.13.0: 自前のDOM操作のため明示的にコミットする
              EditorHistory.commit();
              return;
            }

            e.preventDefault();

            // Range APIを使って確実に改行を挿入
            const br = document.createElement('br');
            range.deleteContents(); // 選択範囲があれば削除
            range.insertNode(br);

            // キャレットをbrの直後に移動
            // brの後にテキストノードなどがなければ、キャレットが移動しないように見えることがある
            // そのため、ゼロ幅スペースを入れるか、キャレット位置を調整する
            range.setStartAfter(br);
            range.setEndAfter(br);

            // chromeなどの場合、末尾のbrは無視されることがあるため、
            // もうひとつbrが必要な場合があるが、まずはシンプルに

            sel.removeAllRanges();
            sel.addRange(range);

            // スクロール位置の調整（必要であれば）
            if (br.scrollIntoView) {
              br.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            }
            // v0.13.0: 自前のDOM操作のため明示的にコミットする
            EditorHistory.commit();
          }
        } else if (e.key === 'Backspace') {
          const sel = window.getSelection();
          if (!sel.rangeCount) return;
          const range = sel.getRangeAt(0);
          
          // 範囲選択されている場合はデフォルト挙動でOK
          if (!range.collapsed) return;

          // 枠(div)の中で、中身が空（または改行のみ）の場合に枠を削除する
          let node = range.commonAncestorContainer;
          if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
          
          let current = node;
          while (current && current !== playground) {
            // 枠（divでstyle属性を持つ）
            if (current.nodeName === 'DIV' && current.getAttribute('style')) {
              // 中身のテキストを確認（トリムして空なら）
              const textContent = current.textContent.trim();
              // さらに、子要素が <br> だけ、あるいは空の場合を判定
              // textContentが空でも画像などがある場合は削除しないように注意
              const hasImages = current.querySelector('img');
              
              if (textContent === '' && !hasImages) {
                // 枠を削除して、代わりに p タグを挿入
                e.preventDefault();
                const p = document.createElement('p');
                p.innerHTML = '<br>';
                current.parentNode.insertBefore(p, current);
                current.parentNode.removeChild(current);
                
                // キャレットをpに移動
                const newRange = document.createRange();
                newRange.setStart(p, 0);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
                // v0.13.0: 自前のDOM操作（枠の削除）のため明示的にコミットする
                EditorHistory.commit();
                return;
              }
              break;
            }
            current = current.parentNode;
          }
        }
      });
      
      // イベントリスナー設定（エディタ初期化後に設定）
      document.getElementById('btn-apply-theme').onclick = applyThemeToGeminiHtml;
    }

      latestHtml = outputHtml;
